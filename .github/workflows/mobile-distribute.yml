name: Mobile distribute (TestFlight / Play Internal)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Distribution target"
        required: true
        type: choice
        options:
          - testflight
          - playInternal

permissions:
  contents: read

jobs:
  preflight:
    name: Mobile release preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ee/mobile/package-lock.json

      - name: Install dependencies
        working-directory: ee/mobile
        run: npm ci --include=dev

      - name: Lint
        working-directory: ee/mobile
        run: npm run lint

      - name: Typecheck
        working-directory: ee/mobile
        run: npm run typecheck

      - name: Unit tests
        working-directory: ee/mobile
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run test

      - name: Verify Expo config resolves
        working-directory: ee/mobile
        run: npm run verify:expo-config

  distribute:
    name: Build and submit ${{ inputs.target }}
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ee/mobile/package-lock.json

      - name: Install dependencies
        working-directory: ee/mobile
        run: npm ci --include=dev

      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Prepare Google Play service account
        if: inputs.target == 'playInternal'
        working-directory: ee/mobile
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          node -e 'const fs = require("fs"); const value = process.env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; if (!value) throw new Error("GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not configured"); const key = JSON.parse(value); if (key.type !== "service_account" || !key.client_email || !key.private_key) throw new Error("GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not a service account key"); fs.writeFileSync("google-service-account.json", value, { mode: 0o600 });'

      - name: EAS build (wait)
        working-directory: ee/mobile
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            testflight)
              npx eas-cli build --platform ios --profile testflight --auto-submit-with-profile testflight --non-interactive --wait
              ;;
            playInternal)
              npx eas-cli build --platform android --profile playInternal --non-interactive --wait
              ;;
            *)
              echo "Unknown target: $TARGET"
              exit 1
              ;;
          esac

      - name: EAS submit Android build (latest)
        if: inputs.target == 'playInternal'
        working-directory: ee/mobile
        run: |
          npx eas-cli submit --platform android --profile playInternal --latest --non-interactive

      - name: Remove Google Play service account
        if: always() && inputs.target == 'playInternal'
        working-directory: ee/mobile
        run: |
          node -e 'require("fs").rmSync("google-service-account.json", { force: true })'
