name: Mobile checks

on:
  workflow_call:
  workflow_dispatch:

jobs:
  mobile:
    name: Mobile lint + typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ee/mobile/package-lock.json

      - name: Install dependencies
        working-directory: ee/mobile
        run: npm ci --include=dev

      - name: Lint
        working-directory: ee/mobile
        run: npm run lint

      - name: Typecheck
        working-directory: ee/mobile
        run: npm run typecheck

  mobile-tests:
    name: Mobile unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ee/mobile/package-lock.json

      - name: Install dependencies
        working-directory: ee/mobile
        run: npm ci --include=dev

      - name: Record collection source
        run: |
          mkdir -p test-results/mobile
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; import {testRevision} from "./scripts/lib/test-revision.mjs"; writeFileSync("test-results/mobile/source-before.json", JSON.stringify(testRevision(process.cwd())));'

      - name: Test
        working-directory: ee/mobile
        run: |
          npm run generate:ticket-editor
          mkdir -p ../../test-results/mobile
          npx vitest list --filesOnly --json=../../test-results/mobile/collected.json
          npx vitest list --json=../../test-results/mobile/collected-tests.json
          node -e 'for (const file of ["collected.json", "collected-tests.json"]) { const entries = require("../../test-results/mobile/" + file); if (!Array.isArray(entries) || entries.length === 0) throw new Error("Empty mandatory mobile collection: " + file); }'
          npm run test -- --reporter=default --reporter=json --outputFile=../../test-results/mobile/results.json
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Record final collection source
        if: always()
        run: |
          mkdir -p test-results/mobile
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; import {testRevision} from "./scripts/lib/test-revision.mjs"; writeFileSync("test-results/mobile/source-after.json", JSON.stringify(testRevision(process.cwd())));'

      - name: Preserve mobile collection and execution reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-execution
          path: test-results/mobile/
          if-no-files-found: error
          retention-days: 30

  mobile-audit:
    name: Mobile dependency audit (report)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ee/mobile/package-lock.json

      - name: Install dependencies
        working-directory: ee/mobile
        run: npm ci --include=dev

      - name: Generate npm audit report
        working-directory: ee/mobile
        run: |
          npm audit --omit=dev --json > npm-audit.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: mobile-npm-audit
          path: ee/mobile/npm-audit.json

  mobile-repro:
    name: Mobile reproducibility checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ee/mobile/package-lock.json

      - name: Install dependencies (npm ci)
        working-directory: ee/mobile
        run: npm ci --include=dev

      - name: Ensure lockfile is unchanged
        run: git diff --exit-code -- ee/mobile/package-lock.json

      - name: Verify Expo config resolves
        working-directory: ee/mobile
        run: npm run verify:expo-config
