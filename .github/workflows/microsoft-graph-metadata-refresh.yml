name: Microsoft Graph metadata refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # A failing repin still opens the pull request: the point is to surface a
      # Microsoft-side removal as a red check a human has to look at.
      - name: Repin Microsoft Graph metadata
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run guard:microsoft-graph-endpoints:update

      - name: Open bump pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- tools/microsoft-graph; then
            echo "Microsoft Graph metadata already current; nothing to bump."
            exit 0
          fi
          commit="$(node -p "require('./tools/microsoft-graph/endpoints.json').metadata.commit.slice(0, 12)")"
          branch="chore/microsoft-graph-metadata-${commit}"
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            echo "Branch ${branch} already exists; a bump pull request is already open."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add tools/microsoft-graph
          git commit -m "chore: repin Microsoft Graph metadata" \
            -m "Repin msgraph-metadata to ${commit} so the endpoint guard validates against Microsoft's current published surface and the freshness gate stays green."
          git push origin "${branch}"
          gh pr create \
            --title "chore: repin Microsoft Graph metadata (${commit})" \
            --body "Automated weekly repin of the Microsoft Graph CSDL used by \`npm run guard:microsoft-graph-endpoints\`. If the endpoint guard fails on this PR, Microsoft changed or removed a surface Alga calls." \
            --base main \
            --head "${branch}"
