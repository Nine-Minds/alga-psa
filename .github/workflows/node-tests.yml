name: Node tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-discovery:
    name: Browser test discovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e-tests/package-lock.json
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm --prefix e2e-tests ci
      - name: Build shared libraries imported by test fixtures
        run: npx nx run-many -t build --projects=@alga-psa/db,@alga-psa/core,@alga-psa/shared,@alga-psa/types,@alga-psa/event-bus,@alga-psa/event-schemas,@alga-psa/validation,@alga-psa/formatting,@alga-psa/search --parallel=3
        env:
          NX_DAEMON: 'false'
          NODE_OPTIONS: '--max-old-space-size=8192'
      - name: Collect browser files without starting applications or browsers
        run: node scripts/collect-browser-test-inventory.mjs
      - name: Preserve collection evidence and import diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-discovery-${{ github.sha }}
          path: test-results/browser-discovery/
          if-no-files-found: error
          retention-days: 30

  node-tooling:
    name: Node tooling execution complete
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - uses: ./.github/actions/install-ripgrep
      - name: Run every required tooling test and reconcile execution
        run: node scripts/run-node-tooling-tests.mjs
      - name: Preserve execution evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-tooling-${{ github.sha }}
          path: test-results/node-tooling/
          if-no-files-found: error
          retention-days: 30

  appliance:
    name: Appliance Node execution complete
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ee/appliance/status-ui/package-lock.json
            ee/appliance/host-service/package-lock.json
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm --prefix ee/appliance/status-ui ci
      - run: npm --prefix ee/appliance/host-service ci
      - uses: ./.github/actions/install-ripgrep
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Build status UI and run every appliance Node test
        run: node scripts/run-appliance-tests.mjs
      - name: Preserve appliance execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appliance-node-${{ github.sha }}
          path: test-results/appliance/
          if-no-files-found: error
          retention-days: 30

  node-workflow-complete:
    name: Node workflow execution gate
    if: always()
    needs: [browser-discovery, node-tooling, appliance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/install-ripgrep
      - name: Download node-tooling reports from this candidate run
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: node-tooling-${{ github.sha }}
          path: test-results/node-workflow-input/node-tooling-${{ github.sha }}
      - name: Download appliance-node reports from this candidate run
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: appliance-node-${{ github.sha }}
          path: test-results/node-workflow-input/appliance-node-${{ github.sha }}
      - name: Download browser-discovery reports from this candidate run
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: browser-discovery-${{ github.sha }}
          path: test-results/node-workflow-input/browser-discovery-${{ github.sha }}
      - name: Independently verify mandatory Node execution and browser collection
        if: always()
        run: node scripts/verify-node-workflow.mjs
        env:
          NODE_WORKFLOW_JOBS: ${{ toJSON(needs) }}
      - name: Preserve aggregate verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-workflow-gate-${{ github.sha }}
          path: test-results/node-workflow-gate/
          if-no-files-found: error
          retention-days: 30
