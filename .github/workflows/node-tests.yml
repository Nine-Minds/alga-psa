name: Node tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep CI off the production PostHog project (flag-request and event quotas).
  ALGA_USAGE_STATS: 'false'

jobs:
  browser-discovery:
    name: Browser test discovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e-tests/package-lock.json
      - run: npm install -g npm@11
      - name: Install browser discovery dependencies with bounded download recovery
        env:
          FFMPEG_STATIC_DOWNLOAD_RETRY: 'true'
        run: node scripts/install-api-test-dependencies.mjs
      - run: npm --prefix e2e-tests ci
      - name: Build shared libraries imported by test fixtures
        run: npx nx run-many -t build --projects=@alga-psa/db,@alga-psa/core,@alga-psa/shared,@alga-psa/types,@alga-psa/event-bus,@alga-psa/event-schemas,@alga-psa/validation,@alga-psa/formatting,@alga-psa/search --parallel=3
        env:
          NX_DAEMON: 'false'
          NODE_OPTIONS: '--max-old-space-size=8192'
      - name: Collect browser files without starting applications or browsers
        run: node scripts/collect-browser-test-inventory.mjs
      - name: Preserve collection evidence and import diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-discovery-${{ github.sha }}
          path: test-results/browser-discovery/
          if-no-files-found: error
          retention-days: 30

  node-tooling:
    name: Node tooling execution complete
    # Pinned: `ubuntu-latest` rolled to ubuntu-26.04 on 2026-10-21 and the
    # Chromium install below dies with "Playwright does not support chromium
    # on ubuntu26.04-x64". Unpin once Playwright ships 26.04 dependencies.
    runs-on: ubuntu-24.04
    # The Chromium step below is network-bound on a mirror we do not control
    # and has taken anywhere from 21s to 8m51s. At 15 minutes a slow-but-
    # healthy install left the ~4-minute tooling suite less room than it
    # needs, and the suite was cancelled mid-run. That step now carries its
    # own 12-minute ceiling; this budget covers it alongside npm ci and the
    # suite, so only a genuine hang can reach the job cap.
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e-tests/package-lock.json
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm --prefix e2e-tests ci
      - uses: ./.github/actions/prepare-apt
      - name: Install Chromium for authenticated dashboard hydration tests
        working-directory: e2e-tests
        # Split from the single `--with-deps` call. The browser binary comes
        # from the Playwright CDN in seconds; only the system packages touch
        # apt, and azure.archive.ubuntu.com is intermittently degraded (see
        # .github/actions/install-ripgrep). On 2026-10-22 it served those
        # 24.3 MB at 47.3 kB/s: `--with-deps` took 8m33s of a 15-minute job,
        # the tooling suite was cancelled four minutes in, and the gate could
        # only report a cancelled job plus a half-written report it could not
        # parse. Bound each apt attempt so a stall cannot run forever, and
        # retry once -- apt resumes its partial .debs, so a degraded mirror
        # finishes on the second pass instead of starving the suite.
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          npx --no-install playwright install chromium
          attempt=1
          max_attempts=2
          until timeout 330 npx --no-install playwright install-deps chromium; do
            code=$?
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "playwright install-deps failed after ${attempt} attempts (last exit ${code})" >&2
              exit "$code"
            fi
            echo "install-deps attempt ${attempt} failed or stalled (exit ${code}); clearing apt locks and retrying" >&2
            # A timed-out attempt can leave apt/dpkg holding a lock or a
            # half-unpacked package; clear both so the retry can proceed.
            sudo pkill -9 -f 'apt-get|dpkg' 2>/dev/null || true
            sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock \
              /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend 2>/dev/null || true
            sudo dpkg --configure -a 2>/dev/null || true
            attempt=$((attempt+1))
            sleep 10
          done
      - uses: ./.github/actions/install-ripgrep
      - name: Run every required tooling test and reconcile execution
        run: node scripts/run-node-tooling-tests.mjs
      - name: Preserve execution evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-tooling-${{ github.sha }}
          path: test-results/node-tooling/
          if-no-files-found: error
          retention-days: 30

  appliance:
    name: Appliance Node execution complete
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ee/appliance/status-ui/package-lock.json
            ee/appliance/host-service/package-lock.json
      - run: npm install -g npm@11
      - name: Install appliance dependencies with bounded download recovery
        env:
          FFMPEG_STATIC_DOWNLOAD_RETRY: 'true'
        run: node scripts/install-api-test-dependencies.mjs
      - run: npm --prefix ee/appliance/status-ui ci
      - run: npm --prefix ee/appliance/host-service ci
      - uses: ./.github/actions/install-ripgrep
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Build status UI and run every appliance Node test
        run: node scripts/run-appliance-tests.mjs
      - name: Preserve appliance execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appliance-node-${{ github.sha }}
          path: test-results/appliance/
          if-no-files-found: error
          retention-days: 30

  node-workflow-complete:
    name: Node workflow execution gate
    if: always()
    needs: [browser-discovery, node-tooling, appliance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/install-ripgrep
      - name: Download node-tooling reports from this candidate run
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: node-tooling-${{ github.sha }}
          path: test-results/node-workflow-input/node-tooling-${{ github.sha }}
      - name: Download appliance-node reports from this candidate run
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: appliance-node-${{ github.sha }}
          path: test-results/node-workflow-input/appliance-node-${{ github.sha }}
      - name: Download browser-discovery reports from this candidate run
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: browser-discovery-${{ github.sha }}
          path: test-results/node-workflow-input/browser-discovery-${{ github.sha }}
      - name: Independently verify mandatory Node execution and browser collection
        if: always()
        run: node scripts/verify-node-workflow.mjs
        env:
          NODE_WORKFLOW_JOBS: ${{ toJSON(needs) }}
      - name: Preserve aggregate verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-workflow-gate-${{ github.sha }}
          path: test-results/node-workflow-gate/
          if-no-files-found: error
          retention-days: 30
