name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which suite to run'
        required: false
        default: 'tier1'
        type: choice
        options:
          - tier1
          - full
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Nightly full run at 04:30 UTC.
    - cron: '30 4 * * *'

jobs:
  check-changes:
    name: Check for relevant changes
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
      full: ${{ steps.filter.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check for changes that affect DB-backed tests
        id: filter
        env:
          TIER1_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TIER1_HEAD_SHA: ${{ github.sha }}
        # Manual dispatch has no base, deliberately selecting full coverage.
        # The same conservative policy drives selection inside the Tier-1 job.
        run: node scripts/select-integration-tests.mjs

  integration-tests:
    name: ${{ (github.event_name == 'schedule' || github.event.inputs.suite == 'full' || needs.check-changes.outputs.full == 'true') && 'Full integration suite' || 'Tier-1 integration subset' }}
    needs: check-changes
    # `needs` is skipped entirely on schedule; `always()` lets the nightly run proceed.
    if: always() && (github.event_name == 'schedule' || needs.check-changes.outputs.should_run == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Event-bus integration paths need real Redis streams; the suite-wide
      # `redis` stub alias is skipped via REAL_REDIS below.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER_ADMIN: postgres
      DB_PASSWORD_ADMIN: test_password
      DB_USER_SERVER: app_user
      DB_PASSWORD_SERVER: test_password
      APP_ENV: test
      NODE_ENV: test
      # Fail loudly instead of describe.skip when the DB is unreachable (see server/test-utils/requireDb.ts).
      REQUIRE_DB: '1'
      VITEST_SEED: '20260610'
      # Use the real Redis service instead of the unit-suite stub alias
      # (vitest.config.ts skips the `redis` stub when this is set).
      REAL_REDIS: '1'
      REDIS_HOST: localhost
      REDIS_PORT: '6379'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The Tier-1 gate diffs against TIER1_BASE_SHA to pick affected suites.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Nx computation cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-cache-${{ runner.os }}-${{ hashFiles('package-lock.json', 'nx.json', 'tsconfig.base.json', '**/project.json') }}
          restore-keys: |
            nx-cache-${{ runner.os }}-

      - name: Upgrade npm to version 11
        run: npm install -g npm@11

      # No npm install fallback: a failing npm ci means the lockfile is out of
      # sync with a package.json, and regenerating dependencies on the fly once
      # swapped vitest 3→4 and silently broke test-file serialization. Fail
      # loudly instead.
      - name: Install dependencies
        run: npm ci

      # Same step as unit-tests.yml: vitest aliases @alga-psa/* to src for test
      # files, but code loaded natively at runtime resolves package "exports" ->
      # dist. The onboarding seeds (ee/server/seeds/onboarding/psa/*.cjs) do
      # `await import('@alga-psa/db')` when tests invoke them, which dies with
      # "Cannot find module .../dist/index.js" unless the dists are built.
      - name: Build shared libraries
        run: npx nx run-many -t build --projects=@alga-psa/db,@alga-psa/core,@alga-psa/shared,@alga-psa/types,@alga-psa/event-bus,@alga-psa/event-schemas,@alga-psa/validation,@alga-psa/formatting,@alga-psa/search --parallel=3
        env:
          NX_DAEMON: 'false'
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Wait for Postgres to be ready
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for postgres..."
            sleep 2
          done

      # Some tests read credentials from secrets/ files directly (getSecret falls back to env).
      - name: Create secrets files
        run: |
          mkdir -p secrets
          echo -n "test_password" > secrets/postgres_password
          echo -n "test_password" > secrets/db_password_server
          chmod 600 secrets/*

      # Manifest floor + every suite whose import graph reaches the diff
      # (scripts/run-tier1-integration.mjs). Schema/harness changes widen this
      # to the full directory; unavailable change evidence also requires full coverage.
      - name: Run Tier-1 integration subset
        id: tier1
        if: github.event_name != 'schedule' && github.event.inputs.suite != 'full' && needs.check-changes.outputs.full != 'true'
        working-directory: ./server
        run: npm run test:integration:tier1 -- --reporter=default --reporter=json --outputFile.json=./test-results-integration.json
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          TIER1_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

      - name: Run full integration suite
        id: full
        if: github.event_name == 'schedule' || github.event.inputs.suite == 'full' || needs.check-changes.outputs.full == 'true'
        working-directory: ./server
        # Use the same runner as Tier-1 so the mandatory floor is validated
        # against actual collection even when the entire directory is selected.
        run: npm run test:integration:tier1 -- --reporter=default --reporter=json --outputFile.json=./test-results-integration.json
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          TIER1_BASE_SHA: ''

      # Append this run's numbers to the shared metrics sheet
      # (docs/reference/test-metrics.md). No-op until the Google secrets exist.
      # Tier-1 rows are recorded on push to main only — PR runs would be noisy
      # and fork PRs don't get secrets anyway.
      # Recording is gated on the suite step's *outcome* rather than always():
      # a run the job timeout cancelled reports whatever fraction of the suite
      # had finished, which lands in the sheet as a vacuous green.
      - name: Record Tier-1 metrics to Google Sheet
        if: always() && github.event_name == 'push' && (steps.tier1.outcome == 'success' || steps.tier1.outcome == 'failure')
        continue-on-error: true
        run: node scripts/record-test-metrics.mjs
        env:
          TEST_METRICS_SUITE: integration-tier1
          TEST_METRICS_RESULTS: server/test-results-integration.json
          GOOGLE_SA_KEY: ${{ secrets.TEST_METRICS_GOOGLE_SA_KEY }}
          TEST_METRICS_SHEET_ID: ${{ vars.TEST_METRICS_SHEET_ID }}

      - name: Record full-suite metrics to Google Sheet
        if: always() && (steps.full.outcome == 'success' || steps.full.outcome == 'failure')
        continue-on-error: true
        run: node scripts/record-test-metrics.mjs
        env:
          TEST_METRICS_SUITE: integration-full
          TEST_METRICS_RESULTS: server/test-results-integration.json
          GOOGLE_SA_KEY: ${{ secrets.TEST_METRICS_GOOGLE_SA_KEY }}
          TEST_METRICS_SHEET_ID: ${{ vars.TEST_METRICS_SHEET_ID }}

  # src/test/infrastructure is the original DB-backed billing-engine suite
  # (invoice generation, tax, credits). It ran as two extra steps inside the
  # integration job until the pair outgrew the 90-minute budget and the job
  # timeout cancelled the integration suite mid-run (2026-08-21). Its own job
  # gives each suite independent duration headroom and keeps infra's pool
  # problems out of the integration run.
  # Full coverage is partitioned across independent service instances. The
  # aggregate rejects missing, stale or failed shard evidence.
  infrastructure-tests:
    name: Infrastructure shard ${{ matrix.shard }}
    needs: check-changes
    if: always() && (github.event_name == 'schedule' || needs.check-changes.outputs.should_run == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((github.event_name == 'schedule' || github.event.inputs.suite == 'full' || needs.check-changes.outputs.full == 'true') && '[1,2,3]' || '[1]') }}

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      INFRA_MODE: ${{ (github.event_name == 'schedule' || github.event.inputs.suite == 'full' || needs.check-changes.outputs.full == 'true') && 'full' || 'tier1' }}
      INFRA_SHARD_INDEX: ${{ matrix.shard }}
      INFRA_SHARD_TOTAL: ${{ (github.event_name == 'schedule' || github.event.inputs.suite == 'full' || needs.check-changes.outputs.full == 'true') && '3' || '1' }}
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER_ADMIN: postgres
      DB_PASSWORD_ADMIN: test_password
      DB_USER_SERVER: app_user
      DB_PASSWORD_SERVER: test_password
      APP_ENV: test
      NODE_ENV: test
      REQUIRE_DB: '1'
      VITEST_SEED: '20260610'
      REAL_REDIS: '1'
      REDIS_HOST: localhost
      REDIS_PORT: '6379'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Nx computation cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-cache-${{ runner.os }}-${{ hashFiles('package-lock.json', 'nx.json', 'tsconfig.base.json', '**/project.json') }}
          restore-keys: |
            nx-cache-${{ runner.os }}-

      - name: Upgrade npm to version 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build shared libraries
        run: npx nx run-many -t build --projects=@alga-psa/db,@alga-psa/core,@alga-psa/shared,@alga-psa/types,@alga-psa/event-bus,@alga-psa/event-schemas,@alga-psa/validation,@alga-psa/formatting,@alga-psa/search --parallel=3
        env:
          NX_DAEMON: 'false'
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Wait for Postgres to be ready
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Create secrets files
        run: |
          mkdir -p secrets
          echo -n "test_password" > secrets/postgres_password
          echo -n "test_password" > secrets/db_password_server
          chmod 600 secrets/*

      - name: Run and reconcile assigned infrastructure files
        id: run
        timeout-minutes: 35
        run: node scripts/run-infrastructure-tests.mjs
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Upload infrastructure shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-shard-${{ matrix.shard }}
          path: test-results/infrastructure/
          if-no-files-found: error
          retention-days: 7

  infrastructure-complete:
    name: Infrastructure execution complete
    needs: [check-changes, infrastructure-tests]
    if: always() && (github.event_name == 'schedule' || needs.check-changes.outputs.should_run == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INFRA_MODE: ${{ (github.event_name == 'schedule' || github.event.inputs.suite == 'full' || needs.check-changes.outputs.full == 'true') && 'full' || 'tier1' }}
      INFRA_SHARD_TOTAL: ${{ (github.event_name == 'schedule' || github.event.inputs.suite == 'full' || needs.check-changes.outputs.full == 'true') && '3' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download all infrastructure shards
        uses: actions/download-artifact@v4
        with:
          pattern: infrastructure-shard-*
          path: test-results/infrastructure-shards
      - name: Verify all required infrastructure files and assertions executed
        if: always()
        run: node scripts/verify-infrastructure-shards.mjs
      - name: Upload combined infrastructure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-execution-evidence
          path: test-results/infrastructure/
          if-no-files-found: error
          retention-days: 7
      - name: Record full infrastructure metrics to Google Sheet
        if: always() && env.INFRA_MODE == 'full'
        continue-on-error: true
        run: node scripts/record-test-metrics.mjs
        env:
          TEST_METRICS_SUITE: infrastructure-full
          TEST_METRICS_RESULTS: test-results/infrastructure/results.json
          GOOGLE_SA_KEY: ${{ secrets.TEST_METRICS_GOOGLE_SA_KEY }}
          TEST_METRICS_SHEET_ID: ${{ vars.TEST_METRICS_SHEET_ID }}

  workspace-db-tests:
    name: Workspace database tests
    needs: check-changes
    if: always() && (github.event_name == 'schedule' || needs.check-changes.outputs.should_run == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER_ADMIN: postgres
      DB_PASSWORD_ADMIN: test_password
      DB_USER_SERVER: app_user
      DB_PASSWORD_SERVER: test_password
      APP_ENV: test
      NODE_ENV: test
      REQUIRE_DB: '1'
      VITEST_SEED: '20260610'
      REAL_REDIS: '1'
      REDIS_HOST: localhost
      REDIS_PORT: '6379'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Nx computation cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-cache-${{ runner.os }}-${{ hashFiles('package-lock.json', 'nx.json', 'tsconfig.base.json', '**/project.json') }}
          restore-keys: |
            nx-cache-${{ runner.os }}-

      - name: Upgrade npm to version 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Verify discovery and selection against the installed Vitest runner
        run: node --test scripts/tests/test-discovery.vitest.test.mjs scripts/tests/integration-selection.vitest.test.mjs scripts/tests/infrastructure-runner.vitest.test.mjs

      - name: Build shared libraries
        run: npx nx run-many -t build --projects=@alga-psa/db,@alga-psa/core,@alga-psa/shared,@alga-psa/types,@alga-psa/event-bus,@alga-psa/event-schemas,@alga-psa/validation,@alga-psa/formatting,@alga-psa/search --parallel=3
        env:
          NX_DAEMON: 'false'
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Wait for Postgres to be ready
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Create secrets files
        run: |
          mkdir -p secrets
          echo -n "test_password" > secrets/postgres_password
          echo -n "test_password" > secrets/db_password_server
          chmod 600 secrets/*

      - name: Run and reconcile workspace database tests
        timeout-minutes: 75
        run: node scripts/run-workspace-db-tests.mjs
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Upload workspace database execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-db-evidence
          path: test-results/workspace-db/
          if-no-files-found: error
          retention-days: 14
