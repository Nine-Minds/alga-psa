name: Flaky test report

# Retry-only passes are invisible in a green run: the browser lane retries once
# and the unit shards now retry once too. This reads the per-run flaky-tests-*
# artifacts of the last week and publishes the list, without quarantining or
# gating anything.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      window_days:
        description: Days of production-regression runs to aggregate
        type: string
        required: false
        default: '7'

permissions:
  contents: read
  actions: read

jobs:
  report:
    name: Aggregate flaky tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aggregate per-run flaky-test artifacts
        run: node scripts/collect-flaky-tests.mjs test-results/flaky-tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FLAKY_WINDOW_DAYS: ${{ inputs.window_days || '7' }}
      # The sheet is where the list is tracked and owned (flaky_tests tab, one
      # row per test per report); the summary and artifact below stay as the
      # run's own record. A re-run attempt of the same workflow run appends
      # nothing.
      - name: Record the report in the test-metrics sheet
        run: node scripts/record-flaky-tests.mjs test-results/flaky-tests
        env:
          GOOGLE_SA_KEY: ${{ secrets.TEST_METRICS_GOOGLE_SA_KEY }}
          TEST_METRICS_SHEET_ID: ${{ vars.TEST_METRICS_SHEET_ID }}
      # The collector writes collection.json even when aggregation fails, so the
      # normal red path still ships its diagnostics. Only a job killed before
      # that write leaves the directory absent, and then the failing step above
      # is the signal; this upload warns rather than piling on a second error.
      - name: Preserve flaky test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-test-report-${{ github.run_id }}
          path: test-results/flaky-tests/
          if-no-files-found: warn
          retention-days: 30
