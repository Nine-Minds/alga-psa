name: Secret Bootstrap Guard

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  secret-bootstrap-guard:
    name: Secrets bootstrap idempotency (generate-secrets.sh)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run secret bootstrap tests
        # Pure node:test + bash; no npm dependencies required.
        run: node --test scripts/tests/generate-secrets.test.mjs

      - name: Smoke: generate once, preserve on rerun, validate
        run: |
          set -euo pipefail
          SMOKE_DIR="$(mktemp -d)"
          trap 'rm -rf "$SMOKE_DIR"' EXIT
          export SECRETS_DIR="$SMOKE_DIR/secrets"

          # First run: absent key must be generated.
          ./scripts/generate-secrets.sh >/dev/null
          test -s "$SMOKE_DIR/secrets/credential_encryption_key"
          FIRST="$(cat "$SMOKE_DIR/secrets/credential_encryption_key")"

          # Second run: value must be preserved.
          ./scripts/generate-secrets.sh >/dev/null
          SECOND="$(cat "$SMOKE_DIR/secrets/credential_encryption_key")"
          test "$FIRST" = "$SECOND"

          # validate-secrets.sh must bootstrap + pass from the same absent state.
          rm -rf "$SMOKE_DIR/secrets"
          SECRETS_DIR="$SMOKE_DIR/secrets" ./scripts/validate-secrets.sh >/dev/null
          test -s "$SMOKE_DIR/secrets/credential_encryption_key"
