name: Secret Bootstrap Guard

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  secret-bootstrap-guard:
    name: Secrets bootstrap idempotency (generate-secrets.sh)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run secret bootstrap tests
        # Pure node:test + bash; no npm dependencies required.
        run: node --test scripts/tests/generate-secrets.test.mjs

      - name: Smoke: fresh, migration, refusal, and failure propagation
        run: |
          set -euo pipefail
          SMOKE_DIR="$(mktemp -d)"
          trap 'rm -rf "$SMOKE_DIR"' EXIT

          # 1. Fresh: absent key must be generated; rerun must preserve it.
          export SECRETS_DIR="$SMOKE_DIR/fresh/secrets"
          ./scripts/generate-secrets.sh >/dev/null
          test -s "$SMOKE_DIR/fresh/secrets/credential_encryption_key"
          FIRST="$(cat "$SMOKE_DIR/fresh/secrets/credential_encryption_key")"
          ./scripts/generate-secrets.sh >/dev/null
          test "$FIRST" = "$(cat "$SMOKE_DIR/fresh/secrets/credential_encryption_key")"

          # 2. Legacy complete set: add only the credential key, preserve the rest.
          LEGACY="$SMOKE_DIR/legacy/secrets"
          mkdir -p "$LEGACY"
          for n in postgres_password db_password_server db_password_hocuspocus \
                   redis_password email_password crypto_key token_secret_key \
                   nextauth_secret google_oauth_client_id \
                   google_oauth_client_secret alga_auth_key; do
            printf 'legacy-%s\n' "$n" > "$LEGACY/$n"
          done
          SECRETS_DIR="$LEGACY" ./scripts/generate-secrets.sh >/dev/null
          test -s "$LEGACY/credential_encryption_key"
          test "$(cat "$LEGACY/nextauth_secret")" = "legacy-nextauth_secret"

          # 3. Existing/partial: refusal to regenerate a missing established
          #    secret — exit non-zero, nothing created.
          PARTIAL="$SMOKE_DIR/partial/secrets"
          mkdir -p "$PARTIAL"
          printf 'pg\n' > "$PARTIAL/postgres_password"
          if SECRETS_DIR="$PARTIAL" ./scripts/generate-secrets.sh >/dev/null 2>&1; then
            echo "expected refusal for missing established secret" >&2
            exit 1
          fi
          test ! -e "$PARTIAL/db_password_server"

          # 4. validate-secrets.sh from a fresh absent state: bootstrap + pass.
          SECRETS_DIR="$SMOKE_DIR/validate/secrets" ./scripts/validate-secrets.sh >/dev/null
          test -s "$SMOKE_DIR/validate/secrets/credential_encryption_key"
