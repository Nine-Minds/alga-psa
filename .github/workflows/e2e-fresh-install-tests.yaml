name: E2E Fresh Install Tests

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      no_cache:
        description: Build all images without layer caches
        type: boolean
        default: false
concurrency:
  group: fresh-install-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_tests: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.should_run == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Share the conservative policy with integration coverage. In particular,
      # runner/fixture scripts, service builds and unknown paths cannot silently
      # bypass the production browser job; only known documentation may skip it.
      - name: Determine production validation requirements
        id: filter
        env:
          TIER1_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TIER1_HEAD_SHA: ${{ github.sha }}
        run: node scripts/select-integration-tests.mjs

  browser-collection:
    name: Standalone browser collection
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e-tests/package-lock.json
      - name: Install standalone browser dependencies
        working-directory: e2e-tests
        run: npm ci
      - name: Collect both editions without root workspace dependencies
        working-directory: e2e-tests
        run: |
          mkdir -p ../test-results/browser-collection
          E2E_EDITION=community PLAYWRIGHT_JSON_OUTPUT_FILE=../test-results/browser-collection/community.json npm run test:list -- --reporter=json
          E2E_EDITION=enterprise PLAYWRIGHT_JSON_OUTPUT_FILE=../test-results/browser-collection/enterprise.json npm run test:list -- --reporter=json
      - name: Retain standalone browser collection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-collection
          path: test-results/browser-collection/
          if-no-files-found: error
          retention-days: 30

  build-images:
    needs: [changes, browser-collection]
    if: needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: server
            dockerfile: Dockerfile.build
            image: alga-e2e-test_server_ce_local:latest
            artifact: fresh-install-server-community
            cache: false
          - service: server-ee
            dockerfile: ee/server/Dockerfile.build
            image: alga-e2e-test_server_ee_local:latest
            artifact: fresh-install-server-enterprise
            cache: false
          - service: algasim
            context: ./packages/emulators
            dockerfile: packages/emulators/Dockerfile
            image: alga-e2e-test-algasim:latest
            cache: true
          - service: setup
            dockerfile: setup/Dockerfile.ubuntu
            image: alga-setup:ubuntu
            cache: true
          - service: email-service
            dockerfile: services/email-service/Dockerfile
            image: alga-e2e-test-email-service:latest
            cache: false
          - service: hocuspocus
            dockerfile: hocuspocus/Dockerfile
            image: alga-e2e-test-hocuspocus:latest
            cache: true
          - service: redis
            dockerfile: redis/Dockerfile
            image: alga-e2e-test-redis:latest
            cache: true
          - service: pgbouncer
            context: ./pgbouncer
            dockerfile: pgbouncer/Dockerfile
            image: alga-e2e-test-pgbouncer:latest
            cache: true
    steps:
      - uses: actions/checkout@v4

      - name: Ensure build disk headroom
        run: |
          # Avoid minutes of unconditional cleanup on runners with enough space.
          if [ "$(df -Pk / | awk 'NR == 2 {print $4}')" -lt 47185920 ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          fi
          df -h /

      - name: Set up emulator build runtime
        if: matrix.service == 'algasim'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Compile candidate emulator packages and verify controls
        if: matrix.service == 'algasim'
        run: |
          npm install -g npm@11
          npm ci
          packages/emulators/build-image.sh --stage-only
          npm test --workspace=@alga-psa/emulator-host
          npm test --workspace=@alga-psa/emulator-stripe
          npm test --workspace=@alga-psa/emulator-qbo
          npm test --workspace=@alga-psa/emulator-xero
          npm test --workspace=@alga-psa/emulator-msgraph
          npm test --workspace=@alga-psa/emulator-smtp-sink
          node --test e2e-tests/harness/emulator-control.test.mjs
          node --test e2e-tests/harness/calendar-callback-proxy.test.mjs

      - uses: docker/setup-buildx-action@v3

      - name: Provide memory headroom for production compilation
        if: matrix.service == 'server' || matrix.service == 'server-ee'
        run: |
          # EE's webpack build exceeded runner RAM and was killed by the OS.
          # Keep the actual production build and its bounded Node heap; provide
          # backing space for transient native/webpack allocation peaks.
          free -h
          sudo fallocate -l 8G /swapfile-alga-production-build
          sudo chmod 600 /swapfile-alga-production-build
          sudo mkswap /swapfile-alga-production-build
          sudo swapon /swapfile-alga-production-build
          free -h

      - name: Build and export ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          tags: ${{ matrix.image }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_BUILD_MAX_OLD_SPACE_SIZE=12288
            NEXT_PUBLIC_FORCE_FEATURE_FLAGS=release-v1-6-feature:true
          outputs: type=docker,dest=${{ runner.temp }}/${{ matrix.service }}.tar
          no-cache: ${{ inputs.no_cache == true }}
          # The server/email workspace layers are huge; exporting them to the
          # shared Actions cache adds transfer time and evicts smaller caches.
          # Setup's OS/npm layers are cheap to reuse and apt took 10m in run 33938095770.
          cache-from: ${{ matrix.cache && format('type=gha,version=2,scope=fresh-install-{0}', matrix.service) || '' }}
          cache-to: ${{ matrix.cache && format('type=gha,version=2,scope=fresh-install-{0},mode=max,ignore-error=true,timeout=3m', matrix.service) || '' }}

      - name: Compress image for transfer
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/${{ matrix.service }}.tar
        run: gzip -1 "$IMAGE_ARCHIVE"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact || format('fresh-install-image-{0}', matrix.service) }}
          path: ${{ runner.temp }}/${{ matrix.service }}.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  production-browser:
    name: Production browser (${{ matrix.edition }})
    needs: [changes, browser-collection, build-images]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: community
            server_archive: server
            compose_suffix: ''
          - edition: enterprise
            server_archive: server-ee
            compose_suffix: ':docker-compose.e2e-ee.yaml'
    env:
      COMPOSE_FILE: docker-compose.base.yaml:docker-compose.ce.yaml:docker-compose.prod.yaml:docker-compose.setup-ubuntu.override.yaml:docker-compose.imap-test.yaml:docker-compose.e2e-emulators.yaml${{ matrix.compose_suffix }}
    steps:
      - name: Check build results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_TESTS: ${{ needs.changes.outputs.run_tests }}
          COLLECTION_RESULT: ${{ needs.browser-collection.result }}
          BUILD_RESULT: ${{ needs.build-images.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$RUN_TESTS" = true ]; then
            test "$COLLECTION_RESULT" = success
            test "$BUILD_RESULT" = success
          else
            echo "No application files were modified; skipping fresh-install tests."
          fi

      - name: Checkout repository
        if: needs.changes.outputs.run_tests == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up test environment secrets and .env
        if: needs.changes.outputs.run_tests == 'true'
        run: |
          # Create secrets directory
          mkdir -p secrets

          # Create sample secrets (placeholders, real values not needed for this test if services are self-contained)
          # Using similar placeholders as pr-checks.yaml for consistency
          # Use printf instead of echo to avoid trailing newlines
          printf "placeholder-password" > secrets/postgres_password
          printf "placeholder-password" > secrets/db_password_server
          printf "placeholder-password" > secrets/db_password_hocuspocus
          printf "placeholder-password" > secrets/redis_password
          printf "placeholder-key-32-chars-long-01" > secrets/alga_auth_key
          printf "placeholder-key-32-chars-long-02" > secrets/crypto_key
          printf "placeholder-key-32-chars-long-03" > secrets/token_secret_key
          printf "placeholder-key-32-chars-long-04" > secrets/nextauth_secret
          printf "placeholder-key-32-chars-long-05" > secrets/credential_encryption_key
          printf "placeholder-password" > secrets/email_password
          printf "placeholder-id" > secrets/google_oauth_client_id
          printf "placeholder-secret" > secrets/google_oauth_client_secret

          # Set permissions
          chmod 600 secrets/*

          # Copy and configure environment file
          cp .env.example .env

          # Configure required environment variables for the test
          # Set APP_ENV to production for production build testing
          cat >> .env << EOL
          APP_VERSION=1.0.0-e2e
          APP_NAME=alga-e2e-test
          APP_ENV=production
          APP_HOST=0.0.0.0
          APP_PORT=3000
          APP_EDITION=${{ matrix.edition }}
          NEXT_PUBLIC_EDITION=${{ matrix.edition }}

          # Database Configuration (will be overridden by docker-compose services but good to have)
          DB_TYPE=postgres
          DB_USER_ADMIN=postgres

          # Logging Configuration
          LOG_LEVEL=INFO
          LOG_IS_FORMAT_JSON=false
          LOG_IS_FULL_DETAILS=false

          # Email Configuration (disabled for tests)
          EMAIL_ENABLE=false

          # Authentication Configuration
          NEXTAUTH_URL=http://localhost:3000
          NEXTAUTH_SECRET=placeholder-key-32-chars-long-04
          NEXTAUTH_SESSION_EXPIRES=86400
          AUTH_TRUST_HOST=true

          # Optional Configuration
          REQUIRE_HOCUSPOCUS=false
          
          # Secret Provider Configuration (override production defaults)
          SECRET_READ_CHAIN=env,filesystem
          SECRET_WRITE_PROVIDER=filesystem
          EOL
        shell: bash

      - name: Temporarily rename root docker-compose.yaml to avoid conflict in act
        if: env.ACT
        run: |
          if [ -f docker-compose.yaml ]; then
            echo "Temporarily renaming root docker-compose.yaml to docker-compose.yaml.ignored"
            sudo mv docker-compose.yaml docker-compose.yaml.ignored
          fi
        shell: bash

      - name: Install Docker Compose v2.36.0
        if: needs.changes.outputs.run_tests == 'true'
        id: install_docker_compose # Add an ID for dependent steps
        run: |
          COMPOSE_VERSION="v2.36.0"
          COMPOSE_URL="https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-$(uname -s)-$(uname -m)"
          DEST_PATH="/usr/local/bin/docker-compose" # Standard location

          echo "Downloading Docker Compose from ${COMPOSE_URL} to ${DEST_PATH}"
          sudo rm -f "${DEST_PATH}" # Remove existing to avoid conflicts
          # Use curl with -fS (fail silently on server errors, show client errors) and -L (follow redirects)
          sudo curl -fSL "${COMPOSE_URL}" -o "${DEST_PATH}"
          
          # Verify download was successful and file is not empty and is executable
          if [ ! -s "${DEST_PATH}" ]; then
            echo "Error: Downloaded docker-compose is empty. URL ${COMPOSE_URL} might be incorrect or file not found."
            exit 1
          fi
          if ! file "${DEST_PATH}" | grep -q "executable"; then
            echo "Error: Downloaded file at ${DEST_PATH} is not an executable. It might be an HTML error page."
            echo "Downloaded content (first 5 lines):"
            sudo head -n 5 "${DEST_PATH}"
            exit 1
          fi
          
          sudo chmod +x "${DEST_PATH}"
          echo "Docker Compose version:"
          docker-compose --version # Verify installation
        shell: bash

      - name: Ensure installation disk headroom
        if: steps.install_docker_compose.outcome == 'success'
        run: |
          if [ "$(df -Pk / | awk 'NR == 2 {print $4}')" -lt 31457280 ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          fi
          df -h /

      - name: Download images from this run
        if: steps.install_docker_compose.outcome == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: fresh-install-image-*
          path: ${{ runner.temp }}/fresh-install-images
          merge-multiple: true

      - name: Download production server for this edition
        if: steps.install_docker_compose.outcome == 'success'
        uses: actions/download-artifact@v4
        with:
          name: fresh-install-server-${{ matrix.edition }}
          path: ${{ runner.temp }}/fresh-install-images

      - name: Load and verify images
        if: steps.install_docker_compose.outcome == 'success'
        env:
          IMAGE_DIRECTORY: ${{ runner.temp }}/fresh-install-images
          SERVER_ARCHIVE: ${{ matrix.server_archive }}
        run: |
          node e2e-tests/harness/create-calendar-callback-tls.mjs "$RUNNER_TEMP/calendar-callback-tls"
          export E2E_CALLBACK_TLS_DIR="$RUNNER_TEMP/calendar-callback-tls"
          echo "E2E_CALLBACK_TLS_DIR=$E2E_CALLBACK_TLS_DIR" >> "$GITHUB_ENV"
          for service in "$SERVER_ARCHIVE" setup email-service hocuspocus redis pgbouncer algasim; do
            archive="$IMAGE_DIRECTORY/$service.tar.gz"
            docker load --input "$archive"
            rm "$archive"
          done
          # Resolve explicit and Compose-generated tags so a configuration change cannot
          # accidentally run an old/pulled image instead of this run's build.
          docker-compose -p alga-e2e-test config --format json > "$RUNNER_TEMP/fresh-install-compose.json"
          for service in server setup email-service hocuspocus redis pgbouncer algasim; do
            image=$(jq -r --arg service "$service" '.services[$service].image // (.name + "-" + $service)' "$RUNNER_TEMP/fresh-install-compose.json")
            docker image inspect "$image" > /dev/null
          done

      - name: Start and verify candidate service emulators
        if: steps.install_docker_compose.outcome == 'success'
        run: |
          echo '127.0.0.1 algasim.test' | sudo tee -a /etc/hosts
          docker-compose -p alga-e2e-test up --no-build --wait --wait-timeout 90 -d algasim test-ingress
          docker-compose -p alga-e2e-test exec -T algasim node --input-type=module -e 'const r = await fetch("https://calendar-callback:3443/probe", { signal: AbortSignal.timeout(5000) }); if (r.status !== 404) throw new Error("Calendar callback TLS routing failed")'
          curl --fail --silent http://127.0.0.1:9500/control/catalog > "$RUNNER_TEMP/algasim-catalog.json"
          jq -e '[.result.emulators[].id] | sort == ["msgraph", "qbo", "smtp-sink", "stripe", "webhook-sink", "xero"]' "$RUNNER_TEMP/algasim-catalog.json"
          docker image inspect alga-e2e-test-algasim:latest --format '{{.Id}}' > "$RUNNER_TEMP/algasim-image-id.txt"

      - name: Start foundational services (postgres and redis)
        if: steps.install_docker_compose.outcome == 'success'
        run: |
          echo "Starting foundational services: postgres and redis"
          docker-compose -p alga-e2e-test up --no-build -d postgres redis
        shell: bash

      - name: Wait for postgres to be ready
        if: steps.install_docker_compose.outcome == 'success'
        run: |
          echo "Waiting for postgres to be ready..."
          
          # Wait for postgres to be healthy
          echo "Checking postgres health..."
          MAX_ATTEMPTS=30
          ATTEMPT_NUM=1
          until docker-compose -p alga-e2e-test exec -T postgres pg_isready -U postgres; do
            if [ $ATTEMPT_NUM -ge $MAX_ATTEMPTS ]; then
              echo "Timeout: Postgres did not become ready within the allocated time."
              docker-compose -p alga-e2e-test logs postgres
              exit 1
            fi
            echo "Attempt $ATTEMPT_NUM/$MAX_ATTEMPTS: Postgres not ready. Waiting 5 seconds..."
            sleep 5
            ATTEMPT_NUM=$((ATTEMPT_NUM+1))
          done
          echo "Postgres is ready."
        shell: bash

      - name: Start pgbouncer service
        if: steps.install_docker_compose.outcome == 'success'
        run: |
          echo "Starting pgbouncer service"
          docker-compose -p alga-e2e-test up --no-build -d pgbouncer
        shell: bash

      - name: Wait for pgbouncer to be ready
        if: steps.install_docker_compose.outcome == 'success'
        run: |
          echo "Waiting for pgbouncer to be ready..."
          
          # Wait for pgbouncer port to be open
          echo "Checking pgbouncer port availability..."
          MAX_ATTEMPTS=30
          ATTEMPT_NUM=1
          until docker run --rm --network alga-e2e-test_app-network busybox nc -z pgbouncer 6432; do
            if [ $ATTEMPT_NUM -ge $MAX_ATTEMPTS ]; then
              echo "Timeout: PgBouncer port did not become available within the allocated time."
              docker-compose -p alga-e2e-test logs pgbouncer
              exit 1
            fi
            echo "Attempt $ATTEMPT_NUM/$MAX_ATTEMPTS: PgBouncer port not ready. Waiting 5 seconds..."
            sleep 5
            ATTEMPT_NUM=$((ATTEMPT_NUM+1))
          done
          echo "PgBouncer port is ready."
          
          # Additional wait for pgbouncer to fully initialize
          echo "Waiting additional 5 seconds for pgbouncer to fully initialize..."
          sleep 5
        shell: bash

      - name: Start setup service (Ubuntu build override)
        if: steps.install_docker_compose.outcome == 'success'
        run: |
          echo "Starting setup service"
          # Use the setup image built for this run; never rebuild during installation.
          # Set DB_HOST_ADMIN and DB_PORT_ADMIN to connect directly to postgres for admin operations
          # while keeping DB_HOST and DB_PORT pointing to pgbouncer for migrations/seeds
          DB_HOST_ADMIN=postgres \
          DB_PORT_ADMIN=5432 \
          docker-compose -p alga-e2e-test \
            up --no-build -d setup
        shell: bash

      - name: Wait for Setup service to complete (Ubuntu build override)
        if: steps.install_docker_compose.outcome == 'success'
        id: wait_for_setup
        run: |
          echo "Waiting for setup service to complete..."
          MAX_ATTEMPTS=60 # 10 minutes (60 attempts * 10 seconds)
          ATTEMPT_NUM=1
          
          # Get the container ID before the loop, it might be gone after exit
          SETUP_CONTAINER_ID=$(docker-compose -p alga-e2e-test ps -q setup)
          if [ -z "$SETUP_CONTAINER_ID" ]; then
            echo "Critical: Could not get initial container ID for setup service. Assuming it failed to start."
            docker-compose -p alga-e2e-test logs setup
            echo "status=failure" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "Monitoring Setup Container ID: $SETUP_CONTAINER_ID"

          while [ $ATTEMPT_NUM -le $MAX_ATTEMPTS ]; do
            # Check if the setup container is still running
            if ! docker-compose -p alga-e2e-test ps setup | grep -q "Up"; then
              # Container has exited, check its exit code using the stored ID
              echo "Setup container (ID: $SETUP_CONTAINER_ID) is no longer 'Up'. Checking exit code."
              # Use the stored SETUP_CONTAINER_ID
              if [ -z "$SETUP_CONTAINER_ID" ]; then # Should not happen if initial check passed
                echo "Error: Lost setup container ID." # Should be redundant due to initial check
                SETUP_EXIT_CODE="1" 
              else
                echo "Inspecting container ID: $SETUP_CONTAINER_ID"
                INSPECT_OUTPUT=$(docker inspect -f '{{.State.ExitCode}} {{.State.Error}}' "$SETUP_CONTAINER_ID" 2>/dev/null)
                echo "Inspect output: '$INSPECT_OUTPUT'"
                SETUP_EXIT_CODE=$(echo "$INSPECT_OUTPUT" | awk '{print $1}')
                # If SETUP_EXIT_CODE is empty or not a number, default to 1
                if ! [[ "$SETUP_EXIT_CODE" =~ ^[0-9]+$ ]]; then
                    echo "Failed to parse exit code from inspect output, defaulting to 1."
                    SETUP_EXIT_CODE="1"
                fi
              fi
              
              echo "Reported Setup Exit Code: $SETUP_EXIT_CODE"
              if [ "$SETUP_EXIT_CODE" -eq 0 ]; then
                echo "Setup service completed successfully."
                echo "status=success" >> "$GITHUB_OUTPUT"
                exit 0
              else
                echo "Setup service failed with exit code $SETUP_EXIT_CODE."
                docker-compose -p alga-e2e-test logs setup
                echo "status=failure" >> "$GITHUB_OUTPUT"
                exit 1
              fi
            fi

            # Check logs for completion message as a secondary check (optional, primary is exit code)
            if docker-compose -p alga-e2e-test logs setup | grep -q "Setup completed!"; then
               echo "Setup completion message found in logs. Waiting a bit for container to exit."
               sleep 5 # Give it a moment to exit gracefully
               # Re-check exit status using the stored ID
                if ! docker-compose -p alga-e2e-test ps setup | grep -q "Up"; then
                    # Use the stored SETUP_CONTAINER_ID
                    INSPECT_OUTPUT_LOG_CHECK=$(docker inspect -f '{{.State.ExitCode}}' "$SETUP_CONTAINER_ID" 2>/dev/null)
                    SETUP_EXIT_CODE_LOG_CHECK=$(echo "$INSPECT_OUTPUT_LOG_CHECK" | awk '{print $1}')
                    if ! [[ "$SETUP_EXIT_CODE_LOG_CHECK" =~ ^[0-9]+$ ]]; then
                        echo "Failed to parse exit code from inspect output (log check), defaulting to 1."
                        SETUP_EXIT_CODE_LOG_CHECK="1"
                    fi

                    if [ "$SETUP_EXIT_CODE_LOG_CHECK" -eq 0 ]; then
                        echo "Setup service completed successfully after log check (Exit Code: $SETUP_EXIT_CODE_LOG_CHECK)."
                        echo "status=success" >> "$GITHUB_OUTPUT"
                        exit 0 # Successful exit from the script
                    else
                        echo "Setup service showed completion log but exited with code $SETUP_EXIT_CODE_LOG_CHECK."
                        docker-compose -p alga-e2e-test logs setup
                        echo "status=failure" >> "$GITHUB_OUTPUT"
                        exit 1 # Failed exit from the script
                    fi
                fi
            fi

            echo "Attempt $ATTEMPT_NUM/$MAX_ATTEMPTS: Setup service still running. Waiting 10 seconds..."
            sleep 10
            ATTEMPT_NUM=$((ATTEMPT_NUM+1))
          done
          echo "Timeout: Setup service did not complete within the allocated time."
          docker-compose -p alga-e2e-test logs
          echo "status=failure" >> "$GITHUB_OUTPUT"
          exit 1
        shell: bash

      - name: Start remaining services after setup completion
        if: steps.wait_for_setup.outputs.status == 'success' && steps.install_docker_compose.outcome == 'success'
        run: |
          echo "Setup completed successfully. Starting remaining services..."
          # Start the selected edition and shared services using this run's images
          # Use --no-recreate to avoid restarting setup which already completed
          # Use --no-deps to avoid waiting on setup dependency again
          docker-compose -p alga-e2e-test up -d \
            --no-build --no-recreate --no-deps \
            server email-service imap-test-server hocuspocus
        shell: bash

      - name: Collect initial container logs
        if: steps.wait_for_setup.outputs.status == 'success' && steps.install_docker_compose.outcome == 'success'
        run: |
          echo "=== CONTAINER STATUS ==="
          docker-compose -p alga-e2e-test ps
          
          echo -e "\n=== ALL CONTAINER LOGS ==="
          docker-compose -p alga-e2e-test logs --tail=100
          
          echo -e "\n=== SERVER LOGS (detailed) ==="
          docker-compose -p alga-e2e-test logs server --tail=200
        shell: bash

      - name: Wait for Server service to be healthy
        if: steps.wait_for_setup.outputs.status == 'success' && steps.install_docker_compose.outcome == 'success'
        run: |
          echo "Waiting for server service to be healthy..."
          MAX_ATTEMPTS=30 # 5 minutes (30 attempts * 10 seconds)
          ATTEMPT_NUM=1
          # Using APP_PORT from .env, default to 3000 if not found (though it should be there)
          APP_PORT_VALUE=$(grep APP_PORT .env | cut -d '=' -f2 | head -n 1 || echo "3000")
          HEALTH_CHECK_URL="http://localhost:${APP_PORT_VALUE}/api/health" # Assuming a health endpoint exists
          # Fallback if /api/health is not standard, try base URL
          # HEALTH_CHECK_URL="http://localhost:${APP_PORT_VALUE}/"

          until curl --output /dev/null --silent --head --fail "$HEALTH_CHECK_URL"; do
            if [ $ATTEMPT_NUM -ge $MAX_ATTEMPTS ]; then
              echo "Timeout: Server service did not become healthy at $HEALTH_CHECK_URL within the allocated time."
              echo "=== FINAL SERVER LOGS ==="
              docker-compose -p alga-e2e-test logs server --tail=500
              echo "=== ALL CONTAINER STATUS ==="
              docker-compose -p alga-e2e-test ps
              exit 1
            fi
            echo "Attempt $ATTEMPT_NUM/$MAX_ATTEMPTS: Server not yet healthy at $HEALTH_CHECK_URL. Waiting 10 seconds..."
            
            # Show server logs every 5 attempts to debug issues
            if [ $((ATTEMPT_NUM % 5)) -eq 0 ]; then
              echo "=== SERVER LOGS (attempt $ATTEMPT_NUM) ==="
              docker-compose -p alga-e2e-test logs server --tail=50
            fi
            
            sleep 10
            ATTEMPT_NUM=$((ATTEMPT_NUM+1))
          done
          echo "Server service is healthy at $HEALTH_CHECK_URL."
        shell: bash

      - name: Verify provider routing from running Alga processes
        if: steps.wait_for_setup.outputs.status == 'success' && steps.install_docker_compose.outcome == 'success'
        run: |
          test "$(docker network inspect alga-e2e-test_app-network --format '{{.Internal}}')" = true
          for service in server email-service; do
            docker-compose -p alga-e2e-test exec -T "$service" node --input-type=module < e2e-tests/harness/check-provider-routing.mjs
          done

      - name: Trigger Login Page to Generate Credentials
        if: steps.wait_for_setup.outputs.status == 'success' && steps.install_docker_compose.outcome == 'success'
        run: |
          echo "Attempting to trigger login page to generate credentials in server logs..."
          APP_PORT_VALUE=$(grep APP_PORT .env | cut -d '=' -f2 | head -n 1 || echo "3000")
          LOGIN_PAGE_URL="http://localhost:${APP_PORT_VALUE}/auth/signin"
          # Perform a curl request to the login page. We don't need the output, just the action of hitting the page.
          # Allow failure as the page might not return 200 immediately or might redirect,
          # but the act of requesting it should trigger the log.
          curl -s -o /dev/null -w "%{http_code}" "${LOGIN_PAGE_URL}" || echo "Curl to login page finished (ignore exit code here)."
          echo "Login page triggered. Waiting a few seconds for logs to propagate..."
          sleep 3 # Wait for server to process the request and log credentials
        shell: bash

      - name: Capture Credentials from Server Logs
        if: steps.wait_for_setup.outputs.status == 'success' && steps.install_docker_compose.outcome == 'success'
        id: capture_creds
        run: |
          echo "Attempting to capture credentials from server logs..."
          # Wait a few seconds for logs to flush if needed
          sleep 5
          SERVER_LOGS=$(docker-compose -p alga-e2e-test logs server)

          # Extract email (should be glinda@emeraldcity.oz)
          USER_EMAIL=$(echo "$SERVER_LOGS" | grep -oP 'User Email is -> \[ \K[^ ]+' || echo "")
          # Extract password
          USER_PASSWORD=$(echo "$SERVER_LOGS" | grep -oP 'Password is -> \[ \K[^ ]+' || echo "")

          if [ -z "$USER_EMAIL" ] || [ -z "$USER_PASSWORD" ]; then
            echo "Failed to extract credentials from server logs."
            echo "Server Logs:"
            echo "$SERVER_LOGS"
            exit 1
          fi

          echo "Successfully extracted credentials."
          echo "e2e_user_email=$USER_EMAIL" >> "$GITHUB_OUTPUT"
          # Use a delimiter to safely pass passwords with special characters
          EOF_DELIM=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "e2e_user_password<<$EOF_DELIM"
            echo "$USER_PASSWORD"
            echo "$EOF_DELIM"
          } >> "$GITHUB_OUTPUT"
          # Mask the password in logs
          echo "::add-mask::$USER_PASSWORD"
        shell: bash

      - name: Warm up authentication system
        if: steps.wait_for_setup.outputs.status == 'success' && steps.capture_creds.outputs.e2e_user_email != ''
        run: |
          echo "Warming up authentication system to prime database connections..."
          APP_PORT_VALUE=$(grep APP_PORT .env | cut -d '=' -f2 | head -n 1 || echo "3000")

          # Make a few requests to warm up the auth system and connection pool
          # First, hit the CSRF endpoint to initialize NextAuth
          curl -s -o /dev/null -w "CSRF endpoint: %{http_code}\n" \
            "http://localhost:${APP_PORT_VALUE}/api/auth/csrf" || true

          # Then make a login attempt with invalid credentials to warm up the full auth path
          # This primes: database connections, NextAuth session machinery, lazy-loaded modules
          CSRF_TOKEN=$(curl -s "http://localhost:${APP_PORT_VALUE}/api/auth/csrf" | grep -oP '"csrfToken":"\K[^"]+' || echo "")
          curl -s -o /dev/null -w "Auth warmup: %{http_code}\n" \
            -X POST "http://localhost:${APP_PORT_VALUE}/api/auth/callback/credentials" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "email=warmup@test.invalid&password=warmup&csrfToken=${CSRF_TOKEN}" || true

          echo "Auth system warmed up. Waiting for connections to stabilize..."
          sleep 3
        shell: bash

      - name: Set up Node.js
        if: steps.wait_for_setup.outputs.status == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright npm packages
        if: steps.wait_for_setup.outputs.status == 'success'
        working-directory: ./e2e-tests
        run: npm ci
        shell: bash

      - name: Get Playwright version
        if: steps.wait_for_setup.outputs.status == 'success'
        id: playwright_version
        working-directory: ./e2e-tests
        run: |
          PLAYWRIGHT_VERSION=$(npx playwright --version | awk '{print $2}')
          echo "version=$PLAYWRIGHT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Playwright version: $PLAYWRIGHT_VERSION"
        shell: bash

      - name: Cache Playwright browsers
        if: steps.wait_for_setup.outputs.status == 'success'
        id: playwright_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ steps.playwright_version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.wait_for_setup.outputs.status == 'success' && steps.playwright_cache.outputs.cache-hit != 'true'
        working-directory: ./e2e-tests
        run: npx playwright install chromium
        shell: bash

      - name: Install Playwright system dependencies
        if: steps.wait_for_setup.outputs.status == 'success'
        working-directory: ./e2e-tests
        # Hard ceiling so this step can never again consume the whole job budget.
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # `npx playwright install-deps` shells out to `apt-get`, which has
          # intermittently stalled for 30+ minutes on the GitHub runner (an
          # apt/dpkg lock or a Debian mirror hang). Because the step had no
          # timeout, a single stall consumed the entire 60-minute job budget and
          # the run was cancelled at "Install Playwright system dependencies"
          # before the login e2e test ever executed -- even though the build and
          # all services were up and healthy by ~T+29m. Good runs finish this
          # step in 35-490s, so bound each attempt and retry: a transient stall
          # self-heals instead of killing the job.
          set -x
          attempt=1
          max_attempts=3
          until timeout 240 npx playwright install-deps chromium; do
            code=$?
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "playwright install-deps failed after $attempt attempts (last exit $code)."
              exit "$code"
            fi
            echo "Attempt $attempt failed/stalled (exit $code); clearing apt locks and retrying..."
            # A timed-out attempt can leave apt/dpkg holding a lock; clear it so
            # the retry is not guaranteed to stall the same way.
            sudo pkill -9 -f 'apt-get|dpkg' 2>/dev/null || true
            sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock \
              /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend 2>/dev/null || true
            sudo dpkg --configure -a 2>/dev/null || true
            attempt=$((attempt+1))
            sleep 10
          done
        shell: bash

      - name: Verify browser retry and first-failure diagnostics policy
        id: browser_policy
        if: steps.wait_for_setup.outputs.status == 'success'
        working-directory: ./e2e-tests
        timeout-minutes: 7
        run: xvfb-run --auto-servernum npm run test:harness

      - name: Run Playwright E2E tests
        # A diagnostic-policy failure must still fail the job, but should not
        # prevent collecting independent customer-journey evidence.
        if: ${{ !cancelled() && (steps.browser_policy.outcome == 'success' || steps.browser_policy.outcome == 'failure') }}
        working-directory: ./e2e-tests
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_EDITION: ${{ matrix.edition }}
          E2E_REVISION: ${{ github.sha }}
          E2E_BUILD_FEATURE_FLAGS: release-v1-6-feature:true
          E2E_USER_EMAIL: ${{ steps.capture_creds.outputs.e2e_user_email }}
          E2E_USER_PASSWORD: ${{ steps.capture_creds.outputs.e2e_user_password }}
          E2E_DATABASE_ISOLATED: 'true'
          E2E_EMULATORS_ISOLATED: 'true'
          E2E_EMAIL_TRANSPORT_ISOLATED: 'true'
          E2E_REDIS_PASSWORD: placeholder-password
          ALGASIM_CONTROL_URL: http://127.0.0.1:9500
          ALGASIM_PUBLIC_STRIPE_URL: http://localhost:4050
          ALGASIM_CALLBACK_BASE_URL: http://server:3000
          E2E_DB_HOST: 127.0.0.1
          E2E_DB_PORT: '5432'
          E2E_DB_NAME: server
          E2E_DB_USER: postgres
          E2E_DB_PASSWORD: placeholder-password
        timeout-minutes: 25
        run: xvfb-run --auto-servernum npm test
        shell: bash

      # Publish completed browser evidence before the independent API lane.
      - name: Upload Playwright diagnostics
        if: always() && steps.wait_for_setup.outputs.status == 'success' && !env.ACT
        uses: actions/upload-artifact@v4
        with:
          name: fresh-install-playwright-${{ matrix.edition }}
          path: |
            e2e-tests/playwright-report/
            e2e-tests/test-results/
            e2e-tests/harness-results/
            e2e-tests/execution-evidence/
            ${{ runner.temp }}/algasim-catalog.json
            ${{ runner.temp }}/algasim-image-id.txt
          retention-days: 7

      - name: Record browser journey readiness
        if: always() && steps.wait_for_setup.outputs.status == 'success' && !env.ACT
        continue-on-error: true
        run: node scripts/record-browser-metrics.mjs
        env:
          TEST_METRICS_BROWSER: e2e-tests/execution-evidence/metrics.json
          E2E_EDITION: ${{ matrix.edition }}
          GOOGLE_SA_KEY: ${{ secrets.TEST_METRICS_GOOGLE_SA_KEY }}
          TEST_METRICS_SHEET_ID: ${{ vars.TEST_METRICS_SHEET_ID }}

      - name: Install API test dependencies
        id: api_dependencies
        if: ${{ !cancelled() && steps.wait_for_setup.outputs.status == 'success' }}
        timeout-minutes: 10
        run: npm ci

      - name: Attest ownership of the fresh-install API database
        id: api_database
        if: ${{ !cancelled() && steps.api_dependencies.outcome == 'success' }}
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker-compose -p alga-e2e-test ps -q postgres)
          test -n "$container_id"
          test "$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "$container_id")" = alga-e2e-test
          test "$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.service" }}' "$container_id")" = postgres
          test "$(docker inspect --format '{{ .State.Running }}' "$container_id")" = true
          environment_id=$(node -e 'console.log(require("node:crypto").randomUUID())')
          # Provision through the verified owned container, not an arbitrary DB URL.
          docker exec -i -e PGPASSWORD=placeholder-password "$container_id" psql --no-password -U postgres -d server -v ON_ERROR_STOP=1 -v environment_id="$environment_id" <<'SQL'
          CREATE TABLE public.alga_test_environment_ownership (
            singleton boolean PRIMARY KEY CHECK (singleton),
            environment_id uuid NOT NULL,
            database_name text NOT NULL
          );
          INSERT INTO public.alga_test_environment_ownership
            VALUES (true, :'environment_id'::uuid, current_database());
          SQL
          echo "E2E_DATABASE_ID=$environment_id" >> "$GITHUB_ENV"

      - name: Run API E2E tests with execution reconciliation
        if: ${{ !cancelled() && steps.api_database.outcome == 'success' }}
        timeout-minutes: 15
        env:
          E2E_EDITION: ${{ matrix.edition }}
          TEST_API_BASE_URL: http://127.0.0.1:3000
          E2E_DATABASE_ISOLATED: 'true'
          E2E_DB_HOST: 127.0.0.1
          E2E_DB_PORT: '5432'
          E2E_DB_NAME: server
          E2E_DB_USER: postgres
          E2E_DB_PASSWORD: placeholder-password
        run: node scripts/run-additional-workspace-tests.mjs api-e2e

      - name: Upload API execution evidence
        if: ${{ always() && steps.api_dependencies.outcome == 'success' && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: fresh-install-api-${{ matrix.edition }}
          path: test-results/api-e2e/
          if-no-files-found: error
          retention-days: 7

      - name: Prepare populated v1.5.0 upgrade
        id: upgrade_schema
        if: ${{ !cancelled() && matrix.edition == 'enterprise' && steps.api_database.outcome == 'success' }}
        timeout-minutes: 10
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_USER_ADMIN: postgres
          DB_PASSWORD_ADMIN: placeholder-password
          DB_USER_SERVER: app_user
          UPGRADE_DATABASE_ISOLATED: 'true'
          UPGRADE_DB_NAME: upgrade_ci
          E2E_USER_EMAIL: ${{ steps.capture_creds.outputs.e2e_user_email }}
        run: node scripts/prepare-supported-upgrade-ci.mjs

      - name: Switch candidate server to upgraded database
        id: upgrade_server
        if: ${{ !cancelled() && steps.upgrade_schema.outcome == 'success' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          image=alga-e2e-test_server_ee_local:latest
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = "$GITHUB_SHA"
          expected_image=$(docker image inspect --format '{{.Id}}' "$image")
          printf '%s\n' '{"services":{"server":{"environment":{"DB_HOST":"postgres","DB_PORT":"5432","DB_NAME_SERVER":"upgrade_ci"}}}}' > "$RUNNER_TEMP/upgrade-compose.json"
          export COMPOSE_FILE="$COMPOSE_FILE:$RUNNER_TEMP/upgrade-compose.json"
          docker-compose -p alga-e2e-test up --no-build --no-deps --force-recreate -d server
          container=$(docker-compose -p alga-e2e-test ps -q server)
          test "$(docker inspect --format '{{.Image}}' "$container")" = "$expected_image"
          echo "UPGRADE_APPLICATION_REVISION=$GITHUB_SHA" >> "$GITHUB_ENV"
          ready=false
          for _attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/api/health >/dev/null; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true

      - name: Run supported-upgrade browser gate
        if: ${{ !cancelled() && steps.upgrade_server.outcome == 'success' }}
        timeout-minutes: 10
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_EDITION: enterprise
          E2E_DATABASE_ISOLATED: 'true'
          E2E_DB_HOST: 127.0.0.1
          E2E_DB_PORT: '5432'
          E2E_DB_NAME: upgrade_ci
          E2E_DB_USER: postgres
          E2E_DB_PASSWORD: placeholder-password
          E2E_USER_PASSWORD: ${{ steps.capture_creds.outputs.e2e_user_password }}
        run: xvfb-run --auto-servernum node e2e-tests/run-upgrade.mjs

      - name: Upload supported-upgrade evidence
        if: ${{ always() && matrix.edition == 'enterprise' && steps.upgrade_schema.outcome != 'skipped' && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: supported-upgrade-execution
          path: test-results/supported-upgrade/
          if-no-files-found: error
          retention-days: 7

      - name: Upload upgrade browser diagnostics
        if: ${{ always() && matrix.edition == 'enterprise' && steps.upgrade_server.outcome == 'success' && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: supported-upgrade-diagnostics
          path: e2e-tests/test-results/
          retention-days: 7

      - name: Start isolated Citus upgrade service
        id: citus_upgrade_service
        if: ${{ !cancelled() && matrix.edition == 'enterprise' && steps.api_database.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/citus-upgrade-compose.json" <<'JSON'
          {"services":{"upgrade-citus":{"image":"citusdata/citus:12.1","command":["postgres","-c","password_encryption=md5"],"environment":{"POSTGRES_USER":"postgres","POSTGRES_PASSWORD":"placeholder-password","POSTGRES_DB":"postgres","POSTGRES_HOST_AUTH_METHOD":"md5"},"ports":["127.0.0.1:55433:5432"],"networks":["app-network"]},"server":{"environment":{"DB_HOST":"upgrade-citus","DB_PORT":"5432","DB_NAME_SERVER":"upgrade_citus_ci"}}}}
          JSON
          export COMPOSE_FILE="$COMPOSE_FILE:$RUNNER_TEMP/citus-upgrade-compose.json"
          docker-compose -p alga-e2e-test up --no-build --no-deps -d upgrade-citus
          ready=false
          for _attempt in $(seq 1 60); do
            if docker-compose -p alga-e2e-test exec -T upgrade-citus pg_isready -U postgres; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true

      - name: Prepare populated supported Citus upgrade
        id: citus_upgrade_schema
        if: ${{ !cancelled() && steps.citus_upgrade_service.outcome == 'success' }}
        timeout-minutes: 20
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          UPGRADE_DB_PORT: '55433'
          DB_USER_ADMIN: postgres
          DB_PASSWORD_ADMIN: placeholder-password
          DB_USER_SERVER: app_user
          UPGRADE_DB_BACKEND: citus
          UPGRADE_DATABASE_ISOLATED: 'true'
          UPGRADE_DB_NAME: upgrade_citus_ci
          E2E_USER_EMAIL: ${{ steps.capture_creds.outputs.e2e_user_email }}
        run: node scripts/prepare-supported-upgrade-ci.mjs

      - name: Switch the same candidate image to upgraded Citus
        id: citus_upgrade_server
        if: ${{ !cancelled() && steps.citus_upgrade_schema.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          image=alga-e2e-test_server_ee_local:latest
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = "$GITHUB_SHA"
          expected_image=$(docker image inspect --format '{{.Id}}' "$image")
          export COMPOSE_FILE="$COMPOSE_FILE:$RUNNER_TEMP/citus-upgrade-compose.json"
          docker-compose -p alga-e2e-test up --no-build --no-deps --force-recreate -d server
          container=$(docker-compose -p alga-e2e-test ps -q server)
          test "$(docker inspect --format '{{.Image}}' "$container")" = "$expected_image"
          echo "UPGRADE_APPLICATION_REVISION=$GITHUB_SHA" >> "$GITHUB_ENV"
          ready=false
          for _attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/api/health >/dev/null; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true

      - name: Run supported Citus upgrade browser gate
        id: citus_upgrade_browser
        if: ${{ !cancelled() && steps.citus_upgrade_server.outcome == 'success' }}
        timeout-minutes: 10
        env:
          UPGRADE_DB_BACKEND: citus
          E2E_BASE_URL: http://localhost:3000
          E2E_EDITION: enterprise
          E2E_DATABASE_ISOLATED: 'true'
          E2E_DB_HOST: 127.0.0.1
          E2E_DB_PORT: '55433'
          E2E_DB_NAME: upgrade_citus_ci
          E2E_DB_USER: postgres
          E2E_DB_PASSWORD: placeholder-password
          E2E_USER_PASSWORD: ${{ steps.capture_creds.outputs.e2e_user_password }}
        run: xvfb-run --auto-servernum node e2e-tests/run-upgrade.mjs

      - name: Upload supported Citus upgrade evidence
        if: ${{ always() && steps.citus_upgrade_browser.outcome != 'skipped' && matrix.edition == 'enterprise' && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: supported-citus-upgrade-execution
          path: test-results/supported-upgrade/
          if-no-files-found: error
          retention-days: 7

      - name: Upload supported Citus upgrade diagnostics
        if: ${{ always() && steps.citus_upgrade_server.outcome == 'success' && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: supported-citus-upgrade-diagnostics
          path: e2e-tests/test-results/
          retention-days: 7

      - name: Start explicit Teams development configuration
        id: teams_development_server
        if: ${{ !cancelled() && matrix.edition == 'enterprise' && steps.api_database.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const workspace = process.env.GITHUB_WORKSPACE;
          const volumes = ['packages', 'ee'].map(part => ({ type: 'bind', source: `${workspace}/${part}`, target: `/app/${part}`, read_only: true }));
          volumes.push({ type: 'bind', source: `${workspace}/e2e-tests/harness/start-teams-development-ci.mjs`, target: '/app/start-teams-development-ci.mjs', read_only: true });
          const server = { entrypoint: ['node', '/app/start-teams-development-ci.mjs'], command: [], volumes,
            environment: { NODE_ENV: 'development', TEAMS_EMULATOR_MODE: 'true', NEXT_PUBLIC_FORCE_FEATURE_FLAGS: 'release-v1-6-feature:true', NEXT_DIST_DIR: '.next/teams-development',
              DB_HOST: 'postgres', DB_PORT: '5432', DB_NAME_SERVER: 'server', REDIS_PREFIX: 'teams-development:',
              TEAMS_BOT_APP_ID: 'e2e-teams-bot', TEAMS_BOT_APP_TENANT_ID: 'e2e-bot-tenant', TEAMS_BOT_APP_PASSWORD: 'synthetic-e2e-teams-bot-secret',
              TEAMS_BOT_OPENID_CONFIG_URL: 'http://algasim:4010/v1/.well-known/openidconfiguration', TEAMS_BOT_SERVICE_URL_ALLOWLIST: 'http://algasim:4010',
              NEXT_PUBLIC_APP_URL: 'http://localhost:3000', NODE_OPTIONS: '--max-old-space-size=12288' } };
          writeFileSync(`${process.env.RUNNER_TEMP}/teams-development-compose.json`, JSON.stringify({ services: { server } }));
          JS
          export COMPOSE_FILE="$COMPOSE_FILE:$RUNNER_TEMP/teams-development-compose.json"
          # Earlier production/provider phases have completed. Retain their logs,
          # but release worker memory before compiling the development app.
          docker-compose -p alga-e2e-test stop email-service hocuspocus
          docker-compose -p alga-e2e-test up --no-build --no-deps --force-recreate -d server
          ready=false
          for _attempt in $(seq 1 90); do
            if curl --max-time 15 --fail --silent http://localhost:3000/auth/msp/signin >/dev/null; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true

      - name: Run Teams development execution gate
        id: teams_development_browser
        if: ${{ !cancelled() && steps.teams_development_server.outcome == 'success' }}
        timeout-minutes: 10
        env:
          E2E_TEAMS_DEVELOPMENT: 'true'
          E2E_BASE_URL: http://localhost:3000
          E2E_EDITION: enterprise
          E2E_DATABASE_ISOLATED: 'true'
          E2E_EMULATORS_ISOLATED: 'true'
          ALGASIM_CONTROL_URL: http://localhost:9500
          E2E_DB_HOST: 127.0.0.1
          E2E_DB_PORT: '5432'
          E2E_DB_NAME: server
          E2E_DB_USER: postgres
          E2E_DB_PASSWORD: placeholder-password
          E2E_USER_EMAIL: ${{ steps.capture_creds.outputs.e2e_user_email }}
          E2E_USER_PASSWORD: ${{ steps.capture_creds.outputs.e2e_user_password }}
        run: xvfb-run --auto-servernum node e2e-tests/run-teams-development.mjs

      - name: Upload Teams development execution
        if: ${{ always() && steps.teams_development_browser.outcome != 'skipped' && matrix.edition == 'enterprise' && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: teams-development-execution
          path: test-results/teams-development/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Teams development diagnostics
        if: ${{ always() && steps.teams_development_server.outcome == 'success' && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: teams-development-diagnostics
          path: e2e-tests/test-results/local/
          retention-days: 7

      - name: Collect all container logs on failure
        if: failure() && steps.install_docker_compose.outcome == 'success'
        timeout-minutes: 5
        run: |
          echo "=== COLLECTING ALL LOGS DUE TO FAILURE ==="

          echo "=== CONTAINER STATUS ==="
          timeout 60 docker-compose -p alga-e2e-test ps || echo "Could not get container status"

          echo -e "\n=== DOCKER SYSTEM INFO ==="
          # `docker system df` can hang for minutes against a disk-full/wedged
          # daemon (it previously stalled here until the step was SIGTERM'd ->
          # exit 143), so cap it with `timeout`.
          timeout 60 docker system df || echo "docker system df timed out or failed"
          timeout 60 docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}\t{{.CreatedAt}}" || echo "docker images timed out or failed"
          
          echo -e "\n=== ALL CONTAINER LOGS ==="
          docker-compose -p alga-e2e-test logs --tail=1000 || echo "Could not get compose logs"
          
          echo -e "\n=== INDIVIDUAL SERVICE LOGS ==="
          for service in server setup postgres redis pgbouncer hocuspocus workflow-worker; do
            echo "--- $service logs ---"
            docker-compose -p alga-e2e-test logs $service --tail=200 2>/dev/null || echo "No logs for $service"
          done
          
          echo -e "\n=== DOCKER INSPECT (running containers) ==="
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | grep alga-e2e-test || echo "No running containers found"
          
          # Try to get logs from any containers that might have the project name
          echo -e "\n=== DIRECT DOCKER LOGS ==="
          for container in $(docker ps -a --filter "name=alga-e2e-test" --format "{{.Names}}"); do
            echo "--- Direct logs for $container ---"
            docker logs "$container" --tail=100 2>/dev/null || echo "Could not get logs for $container"
          done
        shell: bash

      - name: Save container logs as artifacts
        if: always() && steps.install_docker_compose.outcome == 'success'
        run: |
          mkdir -p logs

          # Copy any Playwright screenshots to logs directory
          cp e2e-tests/*.png logs/ 2>/dev/null || echo "No Playwright screenshots found"
          cp e2e-tests/test-results/**/*.png logs/ 2>/dev/null || echo "No test-results screenshots found"

          # Save logs for each service
          for service in server setup postgres redis pgbouncer hocuspocus workflow-worker; do
            echo "Saving logs for $service..."
            docker-compose -p alga-e2e-test logs $service --no-color > "logs/${service}.log" 2>/dev/null || echo "No logs for $service" > "logs/${service}.log"
          done
          
          # Save combined logs
          docker-compose -p alga-e2e-test logs --no-color > "logs/all-services.log" 2>/dev/null || echo "Could not save combined logs"
          
          # Save container status
          docker-compose -p alga-e2e-test ps > "logs/container-status.txt" 2>/dev/null || echo "Could not save container status"
          
          # Save environment info
          echo "Environment variables:" > logs/environment.txt
          env | grep -E "(APP_|NODE_|DB_|REDIS_)" >> logs/environment.txt || echo "Could not save environment"
          
          ls -la logs/
        shell: bash

      - name: Upload logs as artifacts
        if: always() && steps.install_docker_compose.outcome == 'success' && github.actor != 'nektos/act'
        uses: actions/upload-artifact@v4
        with:
          name: container-logs-${{ matrix.edition }}
          path: logs/
          retention-days: 7

      - name: Cleanup Docker Compose
        if: always() && steps.install_docker_compose.outcome == 'success' # Ensure docker-compose was attempted to be installed
        run: |
          echo "Cleaning up Docker Compose environment..."
          # Check if docker-compose command is available before trying to use it
          if command -v docker-compose &> /dev/null; then
            docker-compose -p alga-e2e-test down -v --remove-orphans || echo "Docker Compose cleanup failed, but continuing."
          else
            echo "docker-compose command not found, skipping cleanup."
          fi
        shell: bash

      - name: Restore root docker-compose.yaml
        if: always() && env.ACT
        run: |
          if [ -f docker-compose.yaml.ignored ]; then
            echo "Restoring root docker-compose.yaml"
            sudo mv docker-compose.yaml.ignored docker-compose.yaml
          fi
        shell: bash

  # Preserve the required check name while requiring both edition jobs and builds.
  fresh-install-e2e:
    needs: [changes, browser-collection, build-images, production-browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download both browser execution artifacts
        if: always() && needs.changes.outputs.run_tests == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: fresh-install-playwright-*
          path: test-results/fresh-install-input
      - name: Download both API execution artifacts
        if: always() && needs.changes.outputs.run_tests == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: fresh-install-api-*
          path: test-results/fresh-install-input
      - name: Require complete production execution
        if: always()
        env:
          FRESH_INSTALL_JOB_RESULTS: ${{ toJSON(needs) }}
          TIER1_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/verify-fresh-install-execution.mjs
      - name: Preserve aggregate decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-install-execution-gate
          path: test-results/fresh-install-gate/
          if-no-files-found: error
          retention-days: 30
