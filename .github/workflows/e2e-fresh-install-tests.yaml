name: E2E Fresh Install Tests

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      no_cache:
        description: Build all images without layer caches
        type: boolean
        default: false
concurrency:
  group: fresh-install-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_tests: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.should_run == 'true' }}
      image_transport: ${{ steps.transport.outputs.image_transport }}
      registry_namespace: ${{ steps.transport.outputs.registry_namespace }}
      registry_tag: ${{ steps.transport.outputs.registry_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Share the conservative policy with integration coverage. In particular,
      # runner/fixture scripts, service builds and unknown paths cannot silently
      # bypass the production browser job; only known documentation may skip it.
      - name: Determine production validation requirements
        id: filter
        env:
          TIER1_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TIER1_HEAD_SHA: ${{ github.sha }}
        run: node scripts/select-integration-tests.mjs

      # Candidate images travel from build-images to production-browser through
      # the GitHub Container Registry when this run's token can push there: the
      # builder pushes and the consumer pulls by manifest digest, instead of a
      # tar export, gzip, artifact upload, download and `docker load` (14 of the
      # enterprise browser job's 44 minutes in run 40790512018). GitHub issues a
      # read-only token to pull requests from forks and to Dependabot, so those
      # runs keep the gzip archive artifacts. Both transports produce the same
      # build records, receipts and browser artifact manifest.
      - name: Select the candidate image transport
        id: transport
        env:
          SAME_REPOSITORY: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          transport=artifact
          if [ "$SAME_REPOSITORY" = true ] && [ "$ACTOR" != 'dependabot[bot]' ]; then transport=registry; fi
          {
            echo "image_transport=$transport"
            # Registry repository names are lowercase; the repository slug may not be.
            echo "registry_namespace=ghcr.io/${GITHUB_REPOSITORY,,}"
            # The tag is for people browsing the registry; consumers pull by digest.
            echo "registry_tag=run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"
          echo "Candidate image transport: $transport"

  browser-collection:
    name: Standalone browser collection
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e-tests/package-lock.json
      - name: Install standalone browser dependencies
        working-directory: e2e-tests
        run: npm ci
      - name: Collect both editions without root workspace dependencies
        working-directory: e2e-tests
        run: |
          mkdir -p ../test-results/browser-collection
          E2E_EDITION=community PLAYWRIGHT_JSON_OUTPUT_FILE=../test-results/browser-collection/community.json npm run test:list -- --reporter=json
          E2E_EDITION=enterprise PLAYWRIGHT_JSON_OUTPUT_FILE=../test-results/browser-collection/enterprise.json npm run test:list -- --reporter=json
      - name: Retain standalone browser collection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-collection
          path: test-results/browser-collection/
          if-no-files-found: error
          retention-days: 30

  build-images:
    needs: [changes, browser-collection]
    if: needs.changes.outputs.run_tests == 'true'
    # Pinned with production-browser: the candidate identity check compares
    # buildx's config digest against `docker image inspect` on the consumer,
    # so both sides must run the same Docker. See production-browser below.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TRANSPORT: ${{ needs.changes.outputs.image_transport }}
      REGISTRY_REFERENCE: ${{ needs.changes.outputs.registry_namespace }}/e2e-${{ matrix.service }}
      REGISTRY_TAG: ${{ needs.changes.outputs.registry_tag }}
    strategy:
      fail-fast: false
      matrix:
        # `prebuild` services compile the application on the runner first (see
        # the "production build" steps below) and are packaged by the production
        # Dockerfiles, the one runtime image definition per edition, exactly as
        # the Argo build packages them for deployment; `node` is the version
        # those images run on.
        include:
          - service: server
            edition: community
            prebuild: true
            node: '26.1.0'
            dockerfile: Dockerfile
            image: alga-e2e-test_server_ce_local:latest
            artifact: fresh-install-server-community
            cache: false
          - service: server-ee
            edition: enterprise
            prebuild: true
            node: '26.1.0'
            dockerfile: ee/server/Dockerfile
            image: alga-e2e-test_server_ee_local:latest
            artifact: fresh-install-server-enterprise
            cache: false
          - service: algasim
            context: ./packages/emulators
            dockerfile: packages/emulators/Dockerfile
            image: alga-e2e-test-algasim:latest
            cache: true
          - service: setup
            dockerfile: setup/Dockerfile.ubuntu
            image: alga-setup:ubuntu
            cache: true
          - service: email-service
            dockerfile: services/email-service/Dockerfile
            image: alga-e2e-test-email-service:latest
            cache: false
          - service: workflow-worker
            dockerfile: services/workflow-worker/Dockerfile
            image: alga-e2e-test-workflow-worker:latest
            cache: false
          - service: temporal-worker
            dockerfile: ee/temporal-workflows/Dockerfile
            image: alga-e2e-test-temporal-worker:latest
            cache: false
          - service: hocuspocus
            dockerfile: hocuspocus/Dockerfile
            image: alga-e2e-test-hocuspocus:latest
            cache: true
          - service: redis
            dockerfile: redis/Dockerfile
            image: alga-e2e-test-redis:latest
            cache: true
          - service: pgbouncer
            context: ./pgbouncer
            dockerfile: pgbouncer/Dockerfile
            image: alga-e2e-test-pgbouncer:latest
            cache: true
    steps:
      - uses: actions/checkout@v4

      # The tree hash names the source irrespective of the commit that carries
      # it: a pull request's merge commit and the squash commit that lands it
      # on main have different SHAs and the same tree whenever main did not
      # move in between. Every candidate is labelled with it, and the server
      # candidates are also tagged with it, so the Argo deployment build can
      # recognise an image CI already built from exactly this source and copy
      # it instead of compiling again.
      - name: Resolve the source tree
        id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Ensure build disk headroom
        run: |
          # Avoid minutes of unconditional cleanup on runners with enough space.
          if [ "$(df -Pk / | awk 'NR == 2 {print $4}')" -lt 47185920 ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          fi
          df -h /

      - name: Set up emulator build runtime
        if: matrix.service == 'algasim'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Compile candidate emulator packages and verify controls
        if: matrix.service == 'algasim'
        run: |
          npm install -g npm@11
          npm ci
          packages/emulators/build-image.sh --stage-only
          npm test --workspace=@alga-psa/emulator-host
          npm test --workspace=@alga-psa/emulator-stripe
          npm test --workspace=@alga-psa/emulator-qbo
          npm test --workspace=@alga-psa/emulator-xero
          npm test --workspace=@alga-psa/emulator-msgraph
          npm test --workspace=@alga-psa/emulator-smtp-sink
          node --test e2e-tests/harness/emulator-control.test.mjs
          node --test e2e-tests/harness/calendar-callback-proxy.test.mjs

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate to the candidate image registry
        if: env.IMAGE_TRANSPORT == 'registry'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Provide memory headroom for production compilation
        if: matrix.service == 'server' || matrix.service == 'server-ee'
        run: |
          # EE's webpack build exceeded runner RAM and was killed by the OS.
          # Keep the actual production build and its bounded Node heap; provide
          # backing space for transient native/webpack allocation peaks.
          free -h
          sudo fallocate -l 8G /swapfile-alga-production-build
          sudo chmod 600 /swapfile-alga-production-build
          sudo mkswap /swapfile-alga-production-build
          sudo swapon /swapfile-alga-production-build
          free -h

      # The server images are compiled on the runner (scripts/build-production-server.sh,
      # the recipe of the Dockerfile.build artifact builders) and packaged by
      # the production Dockerfiles from the context, the same way the Argo
      # build packages them for deployment, so the candidate under test is the
      # image that ships. Outside the image the webpack filesystem cache and the
      # Nx cache can be carried between runs: a snapshot of both travels through
      # the registry like the candidate images do, under one moving tag per
      # edition. Only runs of main write it, because a cache shapes build
      # output; pull requests only read it. A missing or unreadable snapshot
      # means a cold build, never a failure.
      - name: Set up Node.js for the production build
        if: matrix.prebuild
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install oras for build-cache snapshots
        if: matrix.prebuild
        uses: oras-project/setup-oras@v2

      - name: Install repository dependencies for the production build
        if: matrix.prebuild
        run: npm install --include=optional

      - name: Restore the build-cache snapshot
        if: matrix.prebuild
        id: build_cache
        env:
          BUILD_CACHE_REFERENCE: ${{ needs.changes.outputs.registry_namespace }}/build-cache:${{ matrix.edition }}
        run: node scripts/build-cache-snapshot.mjs restore --reference "$BUILD_CACHE_REFERENCE" --path server/node_modules/.cache/webpack --path .nx/cache

      - name: Build the production application on the runner
        if: matrix.prebuild
        env:
          NEXT_BUILD_MAX_OLD_SPACE_SIZE: '12288'
          EDITION_NAME: ${{ matrix.edition }}
          # Next folds this key into the webpack cache version and generates a
          # new one per build when it is unset, which would make every restored
          # snapshot a miss. The candidates are test images that never serve
          # traffic, so a fixed, public, test-only key is right for them; the
          # deployment build (nm-kube-config) must use a secret of its own.
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: OpTnSkDAbqi/eI+2i8Tg20NhJwnUrrgPdz4I4p/3N+0=
        run: |
          scripts/build-production-server.sh "$EDITION_NAME"
          du -sh server/.next server/node_modules/.cache/webpack .nx/cache 2>/dev/null || true

      - name: Build and export ${{ matrix.service }}
        id: export_image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          # Registry transport pushes under the run's tag only: the local Compose
          # name is applied by the consumer after it pulls the recorded digest.
          tags: ${{ env.IMAGE_TRANSPORT == 'registry' && format('{0}:{1}', env.REGISTRY_REFERENCE, env.REGISTRY_TAG) || matrix.image }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            com.nineminds.source-tree=${{ steps.tree.outputs.tree }}
          build-args: |
            NEXT_BUILD_MAX_OLD_SPACE_SIZE=12288
          outputs: ${{ env.IMAGE_TRANSPORT == 'registry' && 'type=image,push=true' || format('type=docker,dest={0}/{1}.tar', runner.temp, matrix.service) }}
          # One plain manifest per image, never an index with attestations: the
          # consumer pulls exactly one digest and the build record binds that
          # digest to this image's config.
          provenance: false
          sbom: false
          no-cache: ${{ inputs.no_cache == true }}
          # The server/email workspace layers are huge; exporting them to the
          # shared Actions cache adds transfer time and evicts smaller caches.
          # Setup's OS/npm layers are cheap to reuse and apt took 10m in run 33938095770.
          cache-from: ${{ matrix.cache && format('type=gha,version=2,scope=fresh-install-{0}', matrix.service) || '' }}
          cache-to: ${{ matrix.cache && format('type=gha,version=2,scope=fresh-install-{0},mode=max,ignore-error=true,timeout=3m', matrix.service) || '' }}

      - name: Compress image for transfer
        if: env.IMAGE_TRANSPORT == 'artifact'
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/${{ matrix.service }}.tar
        run: |
          gzip -1 "$IMAGE_ARCHIVE"

      - name: Record actual image archive build identity
        if: env.IMAGE_TRANSPORT == 'artifact'
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/${{ matrix.service }}.tar.gz
          BUILD_RECORD: ${{ runner.temp }}/${{ matrix.service }}-build.json
          BUILD_SERVICE: ${{ matrix.service }}
          BUILD_IMAGE: ${{ matrix.image }}
          BUILD_DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_PLATFORM: linux/amd64
          BUILD_CONFIG_IMAGE_ID: ${{ steps.export_image.outputs.imageid }}
          BUILD_REPORTED_DIGEST: ${{ steps.export_image.outputs.digest }}
          BUILD_METADATA: ${{ steps.export_image.outputs.metadata }}
        run: node scripts/record-docker-archive-build.mjs "$IMAGE_ARCHIVE" "$BUILD_RECORD"

      - name: Record actual published candidate image identity
        if: env.IMAGE_TRANSPORT == 'registry'
        env:
          BUILD_MANIFEST: ${{ runner.temp }}/${{ matrix.service }}-manifest.json
          BUILD_RECORD: ${{ runner.temp }}/${{ matrix.service }}-build.json
          BUILD_SERVICE: ${{ matrix.service }}
          BUILD_IMAGE: ${{ matrix.image }}
          BUILD_DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_PLATFORM: linux/amd64
          BUILD_CONFIG_IMAGE_ID: ${{ steps.export_image.outputs.imageid }}
          BUILD_REPORTED_DIGEST: ${{ steps.export_image.outputs.digest }}
          BUILD_METADATA: ${{ steps.export_image.outputs.metadata }}
          BUILD_REGISTRY_REFERENCE: ${{ env.REGISTRY_REFERENCE }}
          BUILD_REGISTRY_TAG: ${{ env.REGISTRY_TAG }}
        run: |
          # The manifest bytes the registry serves under the reported digest, not
          # the builder's own copy: the record proves the push landed.
          docker buildx imagetools inspect "$BUILD_REGISTRY_REFERENCE@$BUILD_REPORTED_DIGEST" --raw > "$BUILD_MANIFEST"
          node scripts/record-docker-registry-build.mjs "$BUILD_MANIFEST" "$BUILD_RECORD"

      # A second tag on the recorded manifest, after the record is written so
      # the candidate's identity stays bound to the run's own tag and digest.
      # Same source, same image: the Argo build looks this tag up by the tree
      # of the commit it is deploying (see nm-kube-config, check-image-exists).
      - name: Tag the candidate with its source tree
        if: env.IMAGE_TRANSPORT == 'registry' && matrix.prebuild
        env:
          TREE: ${{ steps.tree.outputs.tree }}
          BUILD_REPORTED_DIGEST: ${{ steps.export_image.outputs.digest }}
        run: docker buildx imagetools create --tag "$REGISTRY_REFERENCE:tree-$TREE" "$REGISTRY_REFERENCE@$BUILD_REPORTED_DIGEST"

      # Written after the image is published, so a snapshot failure can only
      # cost the next run its warm start, never this run its candidate.
      - name: Save the build-cache snapshot
        if: matrix.prebuild && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.IMAGE_TRANSPORT == 'registry'
        continue-on-error: true
        env:
          BUILD_CACHE_REFERENCE: ${{ needs.changes.outputs.registry_namespace }}/build-cache:${{ matrix.edition }}
        run: node scripts/build-cache-snapshot.mjs save --reference "$BUILD_CACHE_REFERENCE" --path server/node_modules/.cache/webpack --path .nx/cache

      - name: Upload image build record
        uses: actions/upload-artifact@v4
        with:
          name: fresh-install-build-record-${{ matrix.service }}
          path: ${{ runner.temp }}/${{ matrix.service }}-build.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload image archive
        if: env.IMAGE_TRANSPORT == 'artifact'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact || format('fresh-install-image-{0}', matrix.service) }}
          path: ${{ runner.temp }}/${{ matrix.service }}.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # One job definition, run once per shard. Every shard installs the same
  # candidate stack from the same images and then runs only the suites its
  # matrix entry names, so the suites that used to run back to back in one
  # job run side by side. The Playwright journeys are themselves split across
  # several `browser-<n>` shards per edition (`shard: <n>/<total>`); the runner
  # partitions the journey files by their measured duration
  # (e2e-tests/journey-weights.json) and the `browser-evidence` job below merges
  # the shards' evidence back into the one per-edition record and records
  # journey readiness under the name the browser-metrics layer matches.
  production-browser:
    name: Production ${{ matrix.lane }} (${{ matrix.edition }})
    needs: [changes, browser-collection, build-images]
    if: always()
    # Pinned: `ubuntu-latest` rolled to ubuntu-26.04 on 2026-10-21, whose
    # Docker reports a different image Id for a loaded archive, so candidate
    # identity verification failed, and whose Playwright cannot install
    # Chromium. Unpin once both tolerate 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # `lane` names the shard (job title, log artifact); `suites` lists what
        # it runs, resolved by the "Resolve this shard's suites" step below;
        # `shard` is the browser suite's share of the journeys, <index>/<total>.
        # Every browser lane of an edition must name the same total and the
        # indexes must cover 1..total exactly once, or the merged evidence
        # fails for missing or duplicated journeys.
        include:
          - edition: community
            server_archive: server
            compose_suffix: ''
            lane: browser-1
            suites: browser
            shard: 1/2
          - edition: community
            server_archive: server
            compose_suffix: ''
            lane: browser-2
            suites: browser
            shard: 2/2
          - edition: community
            server_archive: server
            compose_suffix: ''
            lane: api
            suites: api
          - edition: enterprise
            server_archive: server-ee
            compose_suffix: ':docker-compose.e2e-ee.yaml'
            lane: browser-1
            suites: browser
            shard: 1/3
          - edition: enterprise
            server_archive: server-ee
            compose_suffix: ':docker-compose.e2e-ee.yaml'
            lane: browser-2
            suites: browser
            shard: 2/3
          - edition: enterprise
            server_archive: server-ee
            compose_suffix: ':docker-compose.e2e-ee.yaml'
            lane: browser-3
            suites: browser
            shard: 3/3
          - edition: enterprise
            server_archive: server-ee
            compose_suffix: ':docker-compose.e2e-ee.yaml'
            lane: api
            suites: api
          - edition: enterprise
            server_archive: server-ee
            compose_suffix: ':docker-compose.e2e-ee.yaml'
            lane: upgrade
            suites: upgrade
          - edition: enterprise
            server_archive: server-ee
            compose_suffix: ':docker-compose.e2e-ee.yaml'
            lane: citus
            suites: citus
          - edition: enterprise
            server_archive: server-ee
            compose_suffix: ':docker-compose.e2e-ee.yaml'
            lane: integrations
            suites: teams microsoft
    env:
      COMPOSE_FILE: docker-compose.base.yaml:docker-compose.ce.yaml:docker-compose.prod.yaml:docker-compose.setup-ubuntu.override.yaml:docker-compose.imap-test.yaml:docker-compose.e2e-emulators.yaml${{ matrix.compose_suffix }}
      IMAGE_TRANSPORT: ${{ needs.changes.outputs.image_transport }}
      # Pulls are refused outside this namespace, whatever a build record says.
      E2E_REGISTRY_NAMESPACE: ${{ needs.changes.outputs.registry_namespace }}
    steps:
      - name: Check build results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_TESTS: ${{ needs.changes.outputs.run_tests }}
          COLLECTION_RESULT: ${{ needs.browser-collection.result }}
          BUILD_RESULT: ${{ needs.build-images.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$RUN_TESTS" = true ]; then
            test "$COLLECTION_RESULT" = success
            test "$BUILD_RESULT" = success
          else
            echo "No application files were modified; skipping fresh-install tests."
          fi

      # Turns the shard's suite list into one output per suite, so steps gate on
      # `steps.shard.outputs.<suite> == 'true'` and each suite's step chain then
      # skips as a whole through the existing step-outcome conditions.
      - name: Resolve this shard's suites
        id: shard
        env:
          LANE: ${{ matrix.lane }}
          SUITES: ${{ matrix.suites }}
        run: |
          known="browser api upgrade citus teams microsoft"
          for suite in $SUITES; do
            case " $known " in
              *" $suite "*) ;;
              *) echo "::error::Shard $LANE names an unknown suite: $suite"; exit 1 ;;
            esac
          done
          playwright=false
          workspace_dependencies=false
          {
            for suite in $known; do
              case " $SUITES " in
                *" $suite "*) echo "$suite=true" ;;
                *) echo "$suite=false" ;;
              esac
            done
            # Only suites that drive a browser need Playwright installed.
            case " $SUITES " in
              *" browser "*|*" upgrade "*|*" citus "*|*" teams "*) playwright=true ;;
            esac
            echo "playwright=$playwright"
            # The API suite runs from the repository's own node_modules, and so
            # do the upgrade preparation (tsx, knex), the Citus probe (pg) and
            # the development runtime that compiles the application for the
            # Teams development server and the Microsoft callback
            # (docker-compose.e2e-development.yaml).
            case " $SUITES " in
              *" api "*|*" upgrade "*|*" citus "*|*" teams "*|*" microsoft "*) workspace_dependencies=true ;;
            esac
            echo "workspace_dependencies=$workspace_dependencies"
          } >> "$GITHUB_OUTPUT"
          echo "Shard $LANE runs: $SUITES (playwright=$playwright, workspace_dependencies=$workspace_dependencies)"

      # Written before anything can fail and uploaded with the journey evidence,
      # so the merge knows how many shards to expect and which this one is even
      # when the runner never started. The runner reads the same `shard` value
      # from E2E_SHARD and records it in its evidence; the merge checks the two
      # agree.
      - name: Describe this browser shard
        if: needs.changes.outputs.run_tests == 'true' && steps.shard.outputs.browser == 'true'
        env:
          EDITION: ${{ matrix.edition }}
          LANE: ${{ matrix.lane }}
          SHARD: ${{ matrix.shard }}
        run: |
          case "$SHARD" in
            [1-9]*/[1-9]*) ;;
            *) echo "::error::Browser lane $LANE needs shard: <index>/<total>, got '$SHARD'"; exit 1 ;;
          esac
          jq -n --arg edition "$EDITION" --arg lane "$LANE" --arg shard "$SHARD" \
            '{edition: $edition, lane: $lane, index: ($shard | split("/")[0] | tonumber), total: ($shard | split("/")[1] | tonumber)}' \
            > "$RUNNER_TEMP/browser-shard.json"
          cat "$RUNNER_TEMP/browser-shard.json"

      - name: Checkout repository
        if: needs.changes.outputs.run_tests == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up test environment secrets and .env
        if: needs.changes.outputs.run_tests == 'true'
        run: |
          # Create secrets directory
          mkdir -p secrets

          # Create sample secrets (placeholders, real values not needed for this test if services are self-contained)
          # Using similar placeholders as pr-checks.yaml for consistency
          # Use printf instead of echo to avoid trailing newlines
          printf "placeholder-password" > secrets/postgres_password
          printf "placeholder-password" > secrets/db_password_server
          printf "placeholder-password" > secrets/db_password_hocuspocus
          printf "placeholder-password" > secrets/redis_password
          printf "placeholder-key-32-chars-long-01" > secrets/alga_auth_key
          printf "placeholder-key-32-chars-long-02" > secrets/crypto_key
          printf "placeholder-key-32-chars-long-03" > secrets/token_secret_key
          printf "placeholder-key-32-chars-long-04" > secrets/nextauth_secret
          printf "placeholder-key-32-chars-long-05" > secrets/credential_encryption_key
          printf "placeholder-password" > secrets/email_password
          printf "placeholder-id" > secrets/google_oauth_client_id
          printf "placeholder-secret" > secrets/google_oauth_client_secret

          # These files contain only the synthetic values above. Compose mounts
          # file secrets with host ownership; permit the non-root Temporal image
          # to read them without changing its production user.
          chmod 444 secrets/*

          # Copy and configure environment file
          cp .env.example .env

          # Configure required environment variables for the test
          # Set APP_ENV to production for production build testing
          cat >> .env << EOL
          APP_VERSION=1.0.0-e2e
          APP_NAME=alga-e2e-test
          APP_ENV=production
          APP_HOST=0.0.0.0
          APP_PORT=3000
          APP_EDITION=${{ matrix.edition }}
          NEXT_PUBLIC_EDITION=${{ matrix.edition }}

          # Database Configuration (will be overridden by docker-compose services but good to have)
          DB_TYPE=postgres
          DB_USER_ADMIN=postgres

          # Logging Configuration
          LOG_LEVEL=INFO
          LOG_IS_FORMAT_JSON=false
          LOG_IS_FULL_DETAILS=false

          # Email Configuration (disabled for tests)
          EMAIL_ENABLE=false

          # Authentication Configuration
          NEXTAUTH_URL=http://localhost:3000
          NEXTAUTH_SECRET=placeholder-key-32-chars-long-04
          NEXTAUTH_SESSION_EXPIRES=86400
          AUTH_TRUST_HOST=true

          # Optional Configuration
          REQUIRE_HOCUSPOCUS=false
          
          # Secret Provider Configuration (override production defaults)
          SECRET_READ_CHAIN=env,filesystem
          SECRET_WRITE_PROVIDER=filesystem
          EOL
        shell: bash

      - name: Temporarily rename root docker-compose.yaml to avoid conflict in act
        if: env.ACT
        run: |
          if [ -f docker-compose.yaml ]; then
            echo "Temporarily renaming root docker-compose.yaml to docker-compose.yaml.ignored"
            sudo mv docker-compose.yaml docker-compose.yaml.ignored
          fi
        shell: bash

      - name: Install Docker Compose v2.36.0
        if: needs.changes.outputs.run_tests == 'true'
        id: install_docker_compose # Add an ID for dependent steps
        run: |
          COMPOSE_VERSION="v2.36.0"
          COMPOSE_URL="https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-$(uname -s)-$(uname -m)"
          DEST_PATH="/usr/local/bin/docker-compose" # Standard location

          echo "Downloading Docker Compose from ${COMPOSE_URL} to ${DEST_PATH}"
          sudo rm -f "${DEST_PATH}" # Remove existing to avoid conflicts
          # Use curl with -fS (fail silently on server errors, show client errors) and -L (follow redirects)
          sudo curl -fSL "${COMPOSE_URL}" -o "${DEST_PATH}"
          
          # Verify download was successful and file is not empty and is executable
          if [ ! -s "${DEST_PATH}" ]; then
            echo "Error: Downloaded docker-compose is empty. URL ${COMPOSE_URL} might be incorrect or file not found."
            exit 1
          fi
          if ! file "${DEST_PATH}" | grep -q "executable"; then
            echo "Error: Downloaded file at ${DEST_PATH} is not an executable. It might be an HTML error page."
            echo "Downloaded content (first 5 lines):"
            sudo head -n 5 "${DEST_PATH}"
            exit 1
          fi
          
          sudo chmod +x "${DEST_PATH}"
          echo "Docker Compose version:"
          docker-compose --version # Verify installation
        shell: bash

      - name: Ensure installation disk headroom
        if: steps.install_docker_compose.outcome == 'success'
        run: |
          if [ "$(df -Pk / | awk 'NR == 2 {print $4}')" -lt 31457280 ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          fi
          df -h /

      - name: Authenticate to the candidate image registry
        if: steps.install_docker_compose.outcome == 'success' && env.IMAGE_TRANSPORT == 'registry'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download images from this run
        if: steps.install_docker_compose.outcome == 'success' && env.IMAGE_TRANSPORT == 'artifact'
        uses: actions/download-artifact@v8.0.1
        with:
          digest-mismatch: error
          pattern: fresh-install-image-*
          path: ${{ runner.temp }}/fresh-install-images
          merge-multiple: true

      - name: Download candidate image build records
        if: steps.install_docker_compose.outcome == 'success'
        uses: actions/download-artifact@v8.0.1
        with:
          digest-mismatch: error
          pattern: fresh-install-build-record-*
          path: ${{ runner.temp }}/fresh-install-build-records
          merge-multiple: true

      - name: Download production server for this edition
        if: steps.install_docker_compose.outcome == 'success' && env.IMAGE_TRANSPORT == 'artifact'
        uses: actions/download-artifact@v8.0.1
        with:
          digest-mismatch: error
          name: fresh-install-server-${{ matrix.edition }}
          path: ${{ runner.temp }}/fresh-install-images

      - name: Acquire and verify candidate images
        if: steps.install_docker_compose.outcome == 'success'
        env:
          IMAGE_DIRECTORY: ${{ runner.temp }}/fresh-install-images
          BUILD_RECORD_DIRECTORY: ${{ runner.temp }}/fresh-install-build-records
          SERVER_ARCHIVE: ${{ matrix.server_archive }}
          EDITION: ${{ matrix.edition }}
          E2E_EDITION: ${{ matrix.edition }}
        run: |
          node e2e-tests/harness/create-calendar-callback-tls.mjs "$RUNNER_TEMP/calendar-callback-tls"
          export E2E_CALLBACK_TLS_DIR="$RUNNER_TEMP/calendar-callback-tls"
          echo "E2E_CALLBACK_TLS_DIR=$E2E_CALLBACK_TLS_DIR" >> "$GITHUB_ENV"
          worker_images="workflow-worker"
          if [ "$EDITION" = enterprise ]; then worker_images="$worker_images temporal-worker"; fi
          verify_mode=loaded
          if [ "$IMAGE_TRANSPORT" = registry ]; then
            verify_mode=pulled
            test -n "$E2E_REGISTRY_NAMESPACE"
          fi
          # Bring one service's candidate image into the local daemon and write its
          # receipt. Pulls and loads are network- or gunzip-bound per image, so every
          # service runs at once below; the daemon serialises nothing between them.
          acquire() {
            service="$1"
            started=$SECONDS
            record="$BUILD_RECORD_DIRECTORY/$service-build.json"
            receipt="$RUNNER_TEMP/verified-$service.json"
            if [ "$IMAGE_TRANSPORT" = registry ]; then
              # Pull the digest the build job recorded, from this repository's
              # candidate namespace only, then give it the name Compose expects.
              reference=$(jq -r '.registry.reference' "$record")
              manifest_digest=$(jq -r '.registry.manifestDigest' "$record")
              local_image=$(jq -r '.image' "$record")
              case "$reference" in
                "$E2E_REGISTRY_NAMESPACE"/e2e-*) ;;
                *) echo "Refusing to pull $service from $reference"; exit 1 ;;
              esac
              docker pull --quiet "$reference@$manifest_digest"
              docker tag "$reference@$manifest_digest" "$local_image"
              docker image inspect "$local_image" > "$RUNNER_TEMP/pulled-$service.json"
              node scripts/browser-artifact-manifest.mjs registry "$RUNNER_TEMP/pulled-$service.json" "$receipt" "$record" "$service"
            else
              archive="$IMAGE_DIRECTORY/$service.tar.gz"
              node scripts/browser-artifact-manifest.mjs archive "$archive" "$receipt" "$record" "$service"
              docker load --input "$archive"
              rm "$archive"
            fi
            echo "acquired $service in $((SECONDS - started))s"
          }
          acquisitions=""
          for service in "$SERVER_ARCHIVE" setup email-service hocuspocus redis pgbouncer algasim $worker_images; do
            acquire "$service" > "$RUNNER_TEMP/acquire-$service.log" 2>&1 &
            acquisitions="$acquisitions $!:$service"
          done
          acquisition_failed=0
          for acquisition in $acquisitions; do
            service="${acquisition#*:}"
            if ! wait "${acquisition%%:*}"; then
              echo "::error::Acquiring the $service candidate image failed"
              acquisition_failed=1
            fi
            cat "$RUNNER_TEMP/acquire-$service.log"
          done
          test "$acquisition_failed" = 0
          # Resolve explicit and Compose-generated tags so a configuration change cannot
          # accidentally run an old/pulled image instead of this run's build.
          docker-compose -p alga-e2e-test --profile enterprise config --format json > "$RUNNER_TEMP/fresh-install-compose.json"
          for service in server setup email-service hocuspocus redis pgbouncer algasim worker-test-state $worker_images; do
            image=$(jq -r --arg service "$service" '.services[$service].image // (.name + "-" + $service)' "$RUNNER_TEMP/fresh-install-compose.json")
            record_service="$service"
            if [ "$service" = server ]; then record_service="$SERVER_ARCHIVE"; fi
            if [ "$service" = worker-test-state ]; then record_service=algasim; fi
            inspection="$RUNNER_TEMP/loaded-$service.json"
            docker image inspect "$image" > "$inspection"
            node scripts/verify-docker-archive-build.mjs "$verify_mode" "$inspection" "$BUILD_RECORD_DIRECTORY/$record_service-build.json" "$record_service"
          done
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import path from 'node:path';
          const { RUNNER_TEMP: temp, BUILD_RECORD_DIRECTORY: records, SERVER_ARCHIVE: server, EDITION: edition } = process.env;
          const services = [server, 'setup', 'email-service', 'hocuspocus', 'redis', 'pgbouncer', 'algasim', 'workflow-worker',
            ...(edition === 'enterprise' ? ['temporal-worker'] : [])];
          writeFileSync(path.join(temp, 'browser-artifact-input.json'), JSON.stringify(services.map(service => ({
            record: path.join(records, `${service}-build.json`),
            receipt: path.join(temp, `verified-${service}.json`),
            inspection: path.join(temp, `loaded-${service === server ? 'server' : service}.json`),
          }))));
          NODE
          node scripts/browser-artifact-manifest.mjs manifest "$RUNNER_TEMP/browser-artifact-input.json" "$RUNNER_TEMP/browser-artifact-manifest.json"

      - name: Start and verify candidate service emulators
        if: steps.install_docker_compose.outcome == 'success'
        run: |
          echo '127.0.0.1 algasim.test' | sudo tee -a /etc/hosts
          docker-compose -p alga-e2e-test up --no-build --wait --wait-timeout 90 -d algasim test-ingress
          docker-compose -p alga-e2e-test exec -T algasim node --input-type=module -e 'const r = await fetch("https://calendar-callback:3443/probe", { signal: AbortSignal.timeout(5000) }); if (r.status !== 404) throw new Error("Calendar callback TLS routing failed")'
          curl --fail --silent http://127.0.0.1:9500/control/catalog > "$RUNNER_TEMP/algasim-catalog.json"
          jq -e '[.result.emulators[].id] | sort == ["huntress", "levelio", "msgraph", "qbo", "smtp-sink", "stripe", "threecx", "webhook-sink", "xero"]' "$RUNNER_TEMP/algasim-catalog.json"
          docker image inspect alga-e2e-test-algasim:latest --format '{{.Id}}' > "$RUNNER_TEMP/algasim-image-id.txt"

      - name: Initialize isolated shared worker state
        if: steps.install_docker_compose.outcome == 'success'
        run: |
          # Only this fresh job's empty named volumes are initialized. All
          # application secret writers use UID1000; production checks stay on.
          docker-compose -p alga-e2e-test run --rm --no-deps worker-test-state

      - name: Start foundational services (postgres and redis)
        if: steps.install_docker_compose.outcome == 'success'
        run: |
          echo "Starting foundational services: postgres and redis"
          docker-compose -p alga-e2e-test up --no-build -d postgres redis
        shell: bash

      - name: Wait for postgres to be ready
        if: steps.install_docker_compose.outcome == 'success'
        run: |
          echo "Waiting for postgres to be ready..."
          
          # Wait for postgres to be healthy
          echo "Checking postgres health..."
          MAX_ATTEMPTS=30
          ATTEMPT_NUM=1
          until docker-compose -p alga-e2e-test exec -T postgres pg_isready -U postgres; do
            if [ $ATTEMPT_NUM -ge $MAX_ATTEMPTS ]; then
              echo "Timeout: Postgres did not become ready within the allocated time."
              docker-compose -p alga-e2e-test logs postgres
              exit 1
            fi
            echo "Attempt $ATTEMPT_NUM/$MAX_ATTEMPTS: Postgres not ready. Waiting 5 seconds..."
            sleep 5
            ATTEMPT_NUM=$((ATTEMPT_NUM+1))
          done
          echo "Postgres is ready."
        shell: bash

      - name: Start pgbouncer service
        if: steps.install_docker_compose.outcome == 'success'
        run: |
          echo "Starting pgbouncer service"
          docker-compose -p alga-e2e-test up --no-build -d pgbouncer
        shell: bash

      - name: Wait for pgbouncer to be ready
        if: steps.install_docker_compose.outcome == 'success'
        run: |
          echo "Waiting for pgbouncer to be ready..."
          
          # Wait for pgbouncer port to be open
          echo "Checking pgbouncer port availability..."
          MAX_ATTEMPTS=30
          ATTEMPT_NUM=1
          until docker run --rm --network alga-e2e-test_app-network busybox nc -z pgbouncer 6432; do
            if [ $ATTEMPT_NUM -ge $MAX_ATTEMPTS ]; then
              echo "Timeout: PgBouncer port did not become available within the allocated time."
              docker-compose -p alga-e2e-test logs pgbouncer
              exit 1
            fi
            echo "Attempt $ATTEMPT_NUM/$MAX_ATTEMPTS: PgBouncer port not ready. Waiting 5 seconds..."
            sleep 5
            ATTEMPT_NUM=$((ATTEMPT_NUM+1))
          done
          echo "PgBouncer port is ready."
          
          # Additional wait for pgbouncer to fully initialize
          echo "Waiting additional 5 seconds for pgbouncer to fully initialize..."
          sleep 5
        shell: bash

      - name: Start setup service (Ubuntu build override)
        if: steps.install_docker_compose.outcome == 'success'
        run: |
          echo "Starting setup service"
          # Use the setup image built for this run; never rebuild during installation.
          # Set DB_HOST_ADMIN and DB_PORT_ADMIN to connect directly to postgres for admin operations
          # while keeping DB_HOST and DB_PORT pointing to pgbouncer for migrations/seeds
          DB_HOST_ADMIN=postgres \
          DB_PORT_ADMIN=5432 \
          docker-compose -p alga-e2e-test \
            up --no-build -d setup
        shell: bash

      - name: Wait for Setup service to complete (Ubuntu build override)
        if: steps.install_docker_compose.outcome == 'success'
        id: wait_for_setup
        run: |
          echo "Waiting for setup service to complete..."
          MAX_ATTEMPTS=60 # 10 minutes (60 attempts * 10 seconds)
          ATTEMPT_NUM=1
          
          # Get the container ID before the loop, it might be gone after exit
          SETUP_CONTAINER_ID=$(docker-compose -p alga-e2e-test ps -q setup)
          if [ -z "$SETUP_CONTAINER_ID" ]; then
            echo "Critical: Could not get initial container ID for setup service. Assuming it failed to start."
            docker-compose -p alga-e2e-test logs setup
            echo "status=failure" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "Monitoring Setup Container ID: $SETUP_CONTAINER_ID"

          while [ $ATTEMPT_NUM -le $MAX_ATTEMPTS ]; do
            # Check if the setup container is still running
            if ! docker-compose -p alga-e2e-test ps setup | grep -q "Up"; then
              # Container has exited, check its exit code using the stored ID
              echo "Setup container (ID: $SETUP_CONTAINER_ID) is no longer 'Up'. Checking exit code."
              # Use the stored SETUP_CONTAINER_ID
              if [ -z "$SETUP_CONTAINER_ID" ]; then # Should not happen if initial check passed
                echo "Error: Lost setup container ID." # Should be redundant due to initial check
                SETUP_EXIT_CODE="1" 
              else
                echo "Inspecting container ID: $SETUP_CONTAINER_ID"
                INSPECT_OUTPUT=$(docker inspect -f '{{.State.ExitCode}} {{.State.Error}}' "$SETUP_CONTAINER_ID" 2>/dev/null)
                echo "Inspect output: '$INSPECT_OUTPUT'"
                SETUP_EXIT_CODE=$(echo "$INSPECT_OUTPUT" | awk '{print $1}')
                # If SETUP_EXIT_CODE is empty or not a number, default to 1
                if ! [[ "$SETUP_EXIT_CODE" =~ ^[0-9]+$ ]]; then
                    echo "Failed to parse exit code from inspect output, defaulting to 1."
                    SETUP_EXIT_CODE="1"
                fi
              fi
              
              echo "Reported Setup Exit Code: $SETUP_EXIT_CODE"
              if [ "$SETUP_EXIT_CODE" -eq 0 ]; then
                echo "Setup service completed successfully."
                echo "status=success" >> "$GITHUB_OUTPUT"
                exit 0
              else
                echo "Setup service failed with exit code $SETUP_EXIT_CODE."
                docker-compose -p alga-e2e-test logs setup
                echo "status=failure" >> "$GITHUB_OUTPUT"
                exit 1
              fi
            fi

            # Check logs for completion message as a secondary check (optional, primary is exit code)
            if docker-compose -p alga-e2e-test logs setup | grep -q "Setup completed!"; then
               echo "Setup completion message found in logs. Waiting a bit for container to exit."
               sleep 5 # Give it a moment to exit gracefully
               # Re-check exit status using the stored ID
                if ! docker-compose -p alga-e2e-test ps setup | grep -q "Up"; then
                    # Use the stored SETUP_CONTAINER_ID
                    INSPECT_OUTPUT_LOG_CHECK=$(docker inspect -f '{{.State.ExitCode}}' "$SETUP_CONTAINER_ID" 2>/dev/null)
                    SETUP_EXIT_CODE_LOG_CHECK=$(echo "$INSPECT_OUTPUT_LOG_CHECK" | awk '{print $1}')
                    if ! [[ "$SETUP_EXIT_CODE_LOG_CHECK" =~ ^[0-9]+$ ]]; then
                        echo "Failed to parse exit code from inspect output (log check), defaulting to 1."
                        SETUP_EXIT_CODE_LOG_CHECK="1"
                    fi

                    if [ "$SETUP_EXIT_CODE_LOG_CHECK" -eq 0 ]; then
                        echo "Setup service completed successfully after log check (Exit Code: $SETUP_EXIT_CODE_LOG_CHECK)."
                        echo "status=success" >> "$GITHUB_OUTPUT"
                        exit 0 # Successful exit from the script
                    else
                        echo "Setup service showed completion log but exited with code $SETUP_EXIT_CODE_LOG_CHECK."
                        docker-compose -p alga-e2e-test logs setup
                        echo "status=failure" >> "$GITHUB_OUTPUT"
                        exit 1 # Failed exit from the script
                    fi
                fi
            fi

            echo "Attempt $ATTEMPT_NUM/$MAX_ATTEMPTS: Setup service still running. Waiting 10 seconds..."
            sleep 10
            ATTEMPT_NUM=$((ATTEMPT_NUM+1))
          done
          echo "Timeout: Setup service did not complete within the allocated time."
          docker-compose -p alga-e2e-test logs
          echo "status=failure" >> "$GITHUB_OUTPUT"
          exit 1
        shell: bash

      - name: Start remaining services after setup completion
        id: services_started
        if: steps.wait_for_setup.outputs.status == 'success' && steps.install_docker_compose.outcome == 'success'
        run: |
          echo "Setup completed successfully. Starting remaining services..."
          # Start the selected edition and shared services using this run's images
          # Use --no-recreate to avoid restarting setup which already completed
          # Use --no-deps to avoid waiting on setup dependency again
          docker-compose -p alga-e2e-test up -d \
            --no-build --no-recreate --no-deps \
            server email-service imap-test-server hocuspocus
        shell: bash

      - name: Start and verify background workers
        if: steps.wait_for_setup.outputs.status == 'success' && steps.install_docker_compose.outcome == 'success'
        timeout-minutes: 8
        env:
          EDITION: ${{ matrix.edition }}
        run: |
          docker-compose -p alga-e2e-test up --no-build --no-deps --wait --wait-timeout 180 -d temporal-dev
          workers="workflow-worker"
          if [ "$EDITION" = enterprise ]; then workers="$workers temporal-worker"; fi
          docker-compose -p alga-e2e-test up --no-build --no-deps --wait --wait-timeout 180 -d $workers
          # Use the strict checker from an existing container on the internal
          # network. All three authored-runtime loops must report ready.
          docker-compose -p alga-e2e-test cp e2e-tests/harness/check-background-workers.mjs algasim:/tmp/check-background-workers.mjs
          docker-compose -p alga-e2e-test exec -T algasim node /tmp/check-background-workers.mjs

      - name: Verify actual cross-process tenant-secret access
        if: steps.wait_for_setup.outputs.status == 'success' && steps.install_docker_compose.outcome == 'success'
        timeout-minutes: 2
        env:
          EDITION: ${{ matrix.edition }}
        run: |
          probe() {
            docker-compose -p alga-e2e-test exec -T -e SHARED_WORKER_SECRET_PHASE="$2" "$1" node --input-type=module < e2e-tests/harness/check-shared-worker-secrets.mjs
          }
          workers="workflow-worker"
          if [ "$EDITION" = enterprise ]; then workers="$workers temporal-worker"; fi
          for worker in $workers; do
            probe server write
            probe "$worker" rotate
            probe email-service read
            probe server delete
          done

      - name: Execute authored workflow through the candidate worker
        id: authored_worker_execution
        if: steps.wait_for_setup.outputs.status == 'success' && steps.install_docker_compose.outcome == 'success'
        timeout-minutes: 3
        run: |
          mkdir -p logs
          docker-compose -p alga-e2e-test exec -T \
            -e AUTHORED_WORKFLOW_CI_OWNED=true \
            -e AUTHORED_WORKFLOW_EXPECTED_DB_HOST=postgres \
            -e AUTHORED_WORKFLOW_EXPECTED_DB_NAME=server \
            -e DB_HOST_ADMIN=postgres -e DB_PORT_ADMIN=5432 \
            workflow-worker node /app/services/workflow-worker/scripts/check-authored-workflow.mjs > logs/authored-workflow-execution.log
          # The helper prints its structured result after execution and scoped
          # fixture cleanup. Earlier lines may contain runtime startup logging.
          tail -n 1 logs/authored-workflow-execution.log > logs/authored-workflow-execution.json
          jq -e '.status == "passed" and .fixtureCleanup == "passed" and .execution.temporalStatus == "COMPLETED" and .execution.runStatus == "SUCCEEDED"' logs/authored-workflow-execution.json

      - name: Retain authored execution failure diagnostics
        if: ${{ failure() && steps.authored_worker_execution.outcome == 'failure' }}
        timeout-minutes: 1
        run: |
          mkdir -p logs/authored-workflow-diagnostics
          container=$(docker-compose -p alga-e2e-test ps -q workflow-worker)
          test -n "$container"
          docker-compose -p alga-e2e-test exec -T workflow-worker node --input-type=module -e 'import { readdirSync } from "node:fs"; for (const name of readdirSync("/tmp")) if (/^authored-workflow-failure-[a-f0-9-]{36}\.json$/.test(name)) console.log(name);' > "$RUNNER_TEMP/authored-diagnostic-files"
          while IFS= read -r name; do
            docker cp "$container:/tmp/$name" "logs/authored-workflow-diagnostics/$name"
          done < "$RUNNER_TEMP/authored-diagnostic-files"

      - name: Collect initial container logs
        if: steps.wait_for_setup.outputs.status == 'success' && steps.install_docker_compose.outcome == 'success'
        run: |
          echo "=== CONTAINER STATUS ==="
          docker-compose -p alga-e2e-test ps
          
          echo -e "\n=== ALL CONTAINER LOGS ==="
          docker-compose -p alga-e2e-test logs --tail=100
          
          echo -e "\n=== SERVER LOGS (detailed) ==="
          docker-compose -p alga-e2e-test logs server --tail=200
        shell: bash

      - name: Wait for Server service to be healthy
        id: server_ready
        if: ${{ !cancelled() && steps.services_started.outcome == 'success' }}
        run: |
          echo "Waiting for server service to be healthy..."
          MAX_ATTEMPTS=30 # 5 minutes (30 attempts * 10 seconds)
          ATTEMPT_NUM=1
          # Using APP_PORT from .env, default to 3000 if not found (though it should be there)
          APP_PORT_VALUE=$(grep APP_PORT .env | cut -d '=' -f2 | head -n 1 || echo "3000")
          HEALTH_CHECK_URL="http://localhost:${APP_PORT_VALUE}/api/health" # Assuming a health endpoint exists
          # Fallback if /api/health is not standard, try base URL
          # HEALTH_CHECK_URL="http://localhost:${APP_PORT_VALUE}/"

          until curl --output /dev/null --silent --head --fail "$HEALTH_CHECK_URL"; do
            if [ $ATTEMPT_NUM -ge $MAX_ATTEMPTS ]; then
              echo "Timeout: Server service did not become healthy at $HEALTH_CHECK_URL within the allocated time."
              echo "=== FINAL SERVER LOGS ==="
              docker-compose -p alga-e2e-test logs server --tail=500
              echo "=== ALL CONTAINER STATUS ==="
              docker-compose -p alga-e2e-test ps
              exit 1
            fi
            echo "Attempt $ATTEMPT_NUM/$MAX_ATTEMPTS: Server not yet healthy at $HEALTH_CHECK_URL. Waiting 10 seconds..."
            
            # Show server logs every 5 attempts to debug issues
            if [ $((ATTEMPT_NUM % 5)) -eq 0 ]; then
              echo "=== SERVER LOGS (attempt $ATTEMPT_NUM) ==="
              docker-compose -p alga-e2e-test logs server --tail=50
            fi
            
            sleep 10
            ATTEMPT_NUM=$((ATTEMPT_NUM+1))
          done
          echo "Server service is healthy at $HEALTH_CHECK_URL."
        shell: bash

      - name: Verify provider routing from running Alga processes
        id: provider_topology
        if: steps.wait_for_setup.outputs.status == 'success' && steps.install_docker_compose.outcome == 'success'
        env:
          E2E_EDITION: ${{ matrix.edition }}
        run: |
          set -euo pipefail
          test "$(docker network inspect alga-e2e-test_app-network --format '{{.Internal}}')" = true
          mkdir -p logs
          node e2e-tests/harness/check-provider-topology.mjs > logs/provider-readiness-topology.json

      - name: Provision isolated browser fixture credential
        id: capture_creds
        if: ${{ !cancelled() && steps.server_ready.outcome == 'success' }}
        run: node e2e-tests/harness/setup-browser-credential.mjs

      - name: Warm up authentication system
        if: ${{ !cancelled() && steps.capture_creds.outcome == 'success' }}
        run: |
          echo "Warming up authentication system to prime database connections..."
          APP_PORT_VALUE=$(grep APP_PORT .env | cut -d '=' -f2 | head -n 1 || echo "3000")

          # Make a few requests to warm up the auth system and connection pool
          # First, hit the CSRF endpoint to initialize NextAuth
          curl -s -o /dev/null -w "CSRF endpoint: %{http_code}\n" \
            "http://localhost:${APP_PORT_VALUE}/api/auth/csrf" || true

          # Then make a login attempt with invalid credentials to warm up the full auth path
          # This primes: database connections, NextAuth session machinery, lazy-loaded modules
          CSRF_TOKEN=$(curl -s "http://localhost:${APP_PORT_VALUE}/api/auth/csrf" | grep -oP '"csrfToken":"\K[^"]+' || echo "")
          curl -s -o /dev/null -w "Auth warmup: %{http_code}\n" \
            -X POST "http://localhost:${APP_PORT_VALUE}/api/auth/callback/credentials" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "email=warmup@test.invalid&password=warmup&csrfToken=${CSRF_TOKEN}" || true

          echo "Auth system warmed up. Waiting for connections to stabilize..."
          sleep 3
        shell: bash

      - name: Set up Node.js
        id: browser_node
        if: ${{ !cancelled() && steps.wait_for_setup.outputs.status == 'success' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright npm packages
        id: browser_packages
        if: ${{ !cancelled() && steps.browser_node.outcome == 'success' && steps.shard.outputs.playwright == 'true' }}
        working-directory: ./e2e-tests
        run: npm ci
        shell: bash

      - name: Get Playwright version
        if: ${{ !cancelled() && steps.browser_packages.outcome == 'success' }}
        id: playwright_version
        working-directory: ./e2e-tests
        run: |
          PLAYWRIGHT_VERSION=$(npx playwright --version | awk '{print $2}')
          echo "version=$PLAYWRIGHT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Playwright version: $PLAYWRIGHT_VERSION"
        shell: bash

      - name: Cache Playwright browsers
        if: ${{ !cancelled() && steps.playwright_version.outcome == 'success' }}
        id: playwright_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ steps.playwright_version.outputs.version }}

      - name: Install Playwright browsers
        id: browser_install
        if: ${{ !cancelled() && steps.playwright_version.outcome == 'success' && steps.playwright_cache.outputs.cache-hit != 'true' }}
        working-directory: ./e2e-tests
        run: npx playwright install chromium
        shell: bash

      - uses: ./.github/actions/prepare-apt
        if: ${{ !cancelled() && steps.browser_packages.outcome == 'success' }}

      - name: Install Playwright system dependencies
        id: browser_system
        if: ${{ !cancelled() && steps.browser_packages.outcome == 'success' }}
        working-directory: ./e2e-tests
        # Hard ceiling so this step can never again consume the whole job budget.
        # The retry loop below must fit strictly inside this: 4 attempts of 240s
        # plus 3 pauses of 10s is 990s, leaving 90s of headroom under 18 minutes.
        # At 12 minutes the loop's own worst case (740s with 3 attempts) exceeded
        # the ceiling, so the action killed the step mid-attempt instead of the
        # loop ever reporting -- 18 minutes is still only 15% of the job's
        # 120-minute budget, which has doubled since the 12 was chosen.
        timeout-minutes: 18
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # `npx playwright install-deps` shells out to `apt-get`, which has
          # intermittently stalled for 30+ minutes on the GitHub runner (an
          # apt/dpkg lock or a Debian mirror hang). prepare-apt above keeps a bad
          # mirror from hanging the fetch; bound each attempt anyway, because
          # without a timeout a single stall consumed the entire 60-minute job
          # budget and the run was cancelled at "Install Playwright system
          # dependencies" before the login e2e test ever executed -- even though
          # the build and all services were up and healthy by ~T+29m. Good runs
          # finish this step in 35-490s, so bound each attempt and retry: a
          # transient stall self-heals instead of killing the job.
          #
          # apt resumes partial downloads, so attempts accumulate real progress
          # rather than restarting: a throttled mirror (seen at ~35 KB/s for the
          # 26 MB of archives) needs more cumulative download time than one
          # attempt allows. Keep the attempt cap short so a genuine stall is cut
          # off quickly, and spend the budget on attempt count instead.
          set -x
          attempt=1
          max_attempts=4
          until timeout 240 npx playwright install-deps chromium; do
            code=$?
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "playwright install-deps failed after $attempt attempts (last exit $code)."
              exit "$code"
            fi
            echo "Attempt $attempt failed/stalled (exit $code); clearing apt locks and retrying..."
            # A timed-out attempt can leave apt/dpkg holding a lock; clear it so
            # the retry is not guaranteed to stall the same way. The pattern is
            # anchored so pkill does not match its own `sudo pkill ... apt-get`
            # command line and kill itself before reaching apt.
            sudo pkill -9 -f '^(/usr/bin/)?(apt-get|dpkg)( |$)' 2>/dev/null || true
            sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock \
              /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend 2>/dev/null || true
            sudo dpkg --configure -a 2>/dev/null || true
            attempt=$((attempt+1))
            sleep 10
          done
        shell: bash

      - name: Verify installed browser can launch
        id: browser_ready
        if: ${{ !cancelled() && steps.browser_system.outcome == 'success' && (steps.browser_install.outcome == 'success' || steps.playwright_cache.outputs.cache-hit == 'true') }}
        working-directory: ./e2e-tests
        timeout-minutes: 2
        run: |
          node --input-type=module -e 'import { chromium } from "@playwright/test"; const browser = await chromium.launch({ headless: true }); await browser.close();'

      - name: Verify browser retry and first-failure diagnostics policy
        id: browser_policy
        if: ${{ !cancelled() && steps.browser_ready.outcome == 'success' }}
        working-directory: ./e2e-tests
        timeout-minutes: 7
        run: xvfb-run --auto-servernum npm run test:harness

      - name: Run Playwright E2E tests
        # A diagnostic-policy failure must still fail the job, but should not
        # prevent collecting independent customer-journey evidence.
        if: ${{ !cancelled() && steps.shard.outputs.browser == 'true' && steps.provider_topology.outcome == 'success' && steps.capture_creds.outcome == 'success' && steps.browser_ready.outcome == 'success' && (steps.browser_policy.outcome == 'success' || steps.browser_policy.outcome == 'failure') }}
        working-directory: ./e2e-tests
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_EDITION: ${{ matrix.edition }}
          E2E_SHARD: ${{ matrix.shard }}
          E2E_REVISION: ${{ github.sha }}
          E2E_ARTIFACT_MANIFEST: ${{ runner.temp }}/browser-artifact-manifest.json
          E2E_USER_EMAIL: ${{ steps.capture_creds.outputs.e2e_user_email }}
          E2E_USER_PASSWORD: ${{ steps.capture_creds.outputs.e2e_user_password }}
          E2E_DATABASE_ISOLATED: 'true'
          E2E_EMULATORS_ISOLATED: 'true'
          E2E_EMAIL_TRANSPORT_ISOLATED: 'true'
          E2E_REDIS_PASSWORD: placeholder-password
          ALGASIM_CONTROL_URL: http://127.0.0.1:9500
          ALGASIM_PUBLIC_STRIPE_URL: http://localhost:4050
          ALGASIM_CALLBACK_BASE_URL: http://server:3000
          E2E_DB_HOST: 127.0.0.1
          E2E_DB_PORT: '5432'
          E2E_DB_NAME: server
          E2E_DB_USER: postgres
          E2E_DB_PASSWORD: placeholder-password
        timeout-minutes: 25
        run: xvfb-run --auto-servernum npm test
        shell: bash

      # The server is force-recreated for the upgrade and Teams stages below, so
      # the end-of-job container-logs artifact only holds the last incarnation.
      # Keep the browser-stage server and worker output next to the Playwright
      # report while it still exists.
      - name: Preserve browser-stage service logs
        if: always() && steps.shard.outputs.browser == 'true' && steps.wait_for_setup.outputs.status == 'success' && steps.install_docker_compose.outcome == 'success'
        timeout-minutes: 3
        run: |
          mkdir -p e2e-tests/test-results/browser-stage-logs
          for service in server workflow-worker temporal-worker email-service; do
            timeout --kill-after=5s 30s docker-compose -p alga-e2e-test logs --no-color "$service" > "e2e-tests/test-results/browser-stage-logs/${service}.log" 2>&1 || echo "Log capture for $service exited with $?" >> "e2e-tests/test-results/browser-stage-logs/${service}.log"
          done
        shell: bash

      # This shard's share of the journey evidence, with the shard descriptor
      # and the verified candidate manifest. The `browser-evidence` job merges
      # every shard of the edition into `fresh-install-playwright-<edition>`,
      # records journey readiness and publishes the flaky evidence; a shard
      # artifact on its own never satisfies the gate (its evidence declares
      # `selection.mode: shard`). Uploaded only after a successful installation
      # setup, so the descriptor's presence tells the merge the shard came up.
      - name: Upload Playwright diagnostics
        if: always() && steps.shard.outputs.browser == 'true' && steps.wait_for_setup.outputs.status == 'success' && !env.ACT
        uses: actions/upload-artifact@v4
        with:
          name: fresh-install-browser-shard-${{ matrix.edition }}-${{ matrix.lane }}
          path: |
            e2e-tests/playwright-report/
            e2e-tests/test-results/
            e2e-tests/harness-results/
            e2e-tests/execution-evidence/
            ${{ runner.temp }}/algasim-catalog.json
            ${{ runner.temp }}/algasim-image-id.txt
            ${{ runner.temp }}/browser-artifact-manifest.json
            ${{ runner.temp }}/browser-shard.json
          retention-days: 7

      - name: Stop background consumers before API fixtures and database switches
        if: ${{ !cancelled() && steps.wait_for_setup.outputs.status == 'success' }}
        env:
          EDITION: ${{ matrix.edition }}
        run: |
          # API fixtures mutate application data; later upgrade smoke phases
          # switch only the server database. Do not let workers consume those
          # events using the original database or shared execution queues.
          workers="workflow-worker"
          if [ "$EDITION" = enterprise ]; then workers="$workers temporal-worker"; fi
          docker-compose -p alga-e2e-test stop $workers

      - name: Install repository test dependencies
        id: api_dependencies
        if: ${{ !cancelled() && steps.shard.outputs.workspace_dependencies == 'true' && steps.wait_for_setup.outputs.status == 'success' }}
        timeout-minutes: 10
        run: node scripts/install-api-test-dependencies.mjs

      - name: Attest ownership of the fresh-install API database
        id: api_database
        if: ${{ !cancelled() && steps.shard.outputs.api == 'true' && steps.api_dependencies.outcome == 'success' }}
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker-compose -p alga-e2e-test ps -q postgres)
          test -n "$container_id"
          test "$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "$container_id")" = alga-e2e-test
          test "$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.service" }}' "$container_id")" = postgres
          test "$(docker inspect --format '{{ .State.Running }}' "$container_id")" = true
          environment_id=$(node -e 'console.log(require("node:crypto").randomUUID())')
          # Provision through the verified owned container, not an arbitrary DB URL.
          docker exec -i -e PGPASSWORD=placeholder-password "$container_id" psql --no-password -U postgres -d server -v ON_ERROR_STOP=1 -v environment_id="$environment_id" <<'SQL'
          CREATE TABLE public.alga_test_environment_ownership (
            singleton boolean PRIMARY KEY CHECK (singleton),
            environment_id uuid NOT NULL,
            database_name text NOT NULL
          );
          INSERT INTO public.alga_test_environment_ownership
            VALUES (true, :'environment_id'::uuid, current_database());
          SQL
          echo "E2E_DATABASE_ID=$environment_id" >> "$GITHUB_ENV"

      - name: Run API E2E tests with execution reconciliation
        if: ${{ !cancelled() && steps.api_database.outcome == 'success' }}
        timeout-minutes: 15
        env:
          E2E_EDITION: ${{ matrix.edition }}
          TEST_API_BASE_URL: http://127.0.0.1:3000
          E2E_DATABASE_ISOLATED: 'true'
          E2E_DB_HOST: 127.0.0.1
          E2E_DB_PORT: '5432'
          E2E_DB_NAME: server
          E2E_DB_USER: postgres
          E2E_DB_PASSWORD: placeholder-password
        run: node scripts/run-additional-workspace-tests.mjs api-e2e

      - name: Upload API execution evidence
        if: ${{ always() && steps.api_database.outcome != 'skipped' && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: fresh-install-api-${{ matrix.edition }}
          path: test-results/api-e2e/
          if-no-files-found: error
          retention-days: 30

      - name: Prepare populated v1.5.0 upgrade
        id: upgrade_schema
        if: ${{ !cancelled() && steps.shard.outputs.upgrade == 'true' && steps.capture_creds.outcome == 'success' }}
        timeout-minutes: 10
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_USER_ADMIN: postgres
          DB_PASSWORD_ADMIN: placeholder-password
          DB_USER_SERVER: app_user
          UPGRADE_DATABASE_ISOLATED: 'true'
          UPGRADE_DB_NAME: upgrade_ci
          E2E_USER_EMAIL: ${{ steps.capture_creds.outputs.e2e_user_email }}
        run: node scripts/prepare-supported-upgrade-ci.mjs

      - name: Switch candidate server to upgraded database
        id: upgrade_server
        if: ${{ !cancelled() && steps.upgrade_schema.outcome == 'success' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          image=alga-e2e-test_server_ee_local:latest
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = "$GITHUB_SHA"
          expected_image=$(docker image inspect --format '{{.Id}}' "$image")
          node e2e-tests/harness/create-upgrade-pgbouncer.mjs "$RUNNER_TEMP/fresh-install-compose.json" "$RUNNER_TEMP/upgrade-pooler"
          export COMPOSE_FILE="$COMPOSE_FILE:$RUNNER_TEMP/upgrade-pooler/upgrade-compose.json"
          pooler_image=$(jq -r '.services["upgrade-pgbouncer"].image' "$RUNNER_TEMP/upgrade-pooler/upgrade-compose.json")
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$pooler_image")" = "$GITHUB_SHA"
          expected_pooler_image=$(docker image inspect --format '{{.Id}}' "$pooler_image")
          docker-compose -p alga-e2e-test up --no-build --no-deps -d upgrade-pgbouncer
          pooler_container=$(docker-compose -p alga-e2e-test ps -q upgrade-pgbouncer)
          test "$(docker inspect --format '{{.Image}}' "$pooler_container")" = "$expected_pooler_image"
          pooler_ready=false
          for _attempt in $(seq 1 30); do
            if docker-compose -p alga-e2e-test exec -T server node <<'JS'
          const { Client } = require('pg');
          const { readFileSync } = require('node:fs');
          const client = new Client({ host: 'upgrade-pgbouncer', port: 6432, database: 'upgrade_ci',
            user: process.env.DB_USER_SERVER || 'app_user', password: readFileSync('/run/secrets/db_password_server', 'utf8').trim(),
            connectionTimeoutMillis: 2000, query_timeout: 2000 });
          (async () => {
            try {
              await client.connect();
              const result = await client.query('SELECT current_database() AS database');
              if (result.rows[0]?.database !== 'upgrade_ci') throw new Error('Unexpected database');
            } catch { process.exitCode = 1; }
            finally { await client.end(); }
          })();
          JS
            then pooler_ready=true; break; fi
            sleep 2
          done
          test "$pooler_ready" = true
          # Browser and API phases are complete. Release their database pools
          # before starting the upgrade app; the original pooler retains idle
          # sessions even after its clients disconnect. Keep Temporal available
          # for the later Teams phase and retain stopped-container diagnostics.
          docker-compose -p alga-e2e-test stop server email-service pgbouncer
          docker-compose -p alga-e2e-test up --no-build --no-deps --force-recreate -d server
          container=$(docker-compose -p alga-e2e-test ps -q server)
          test "$(docker inspect --format '{{.Image}}' "$container")" = "$expected_image"
          echo "UPGRADE_APPLICATION_REVISION=$GITHUB_SHA" >> "$GITHUB_ENV"
          ready=false
          for _attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/api/health >/dev/null; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true

      - name: Run supported-upgrade browser gate
        if: ${{ !cancelled() && steps.upgrade_server.outcome == 'success' && steps.browser_ready.outcome == 'success' }}
        timeout-minutes: 10
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_EDITION: enterprise
          E2E_DATABASE_ISOLATED: 'true'
          E2E_DB_HOST: 127.0.0.1
          E2E_DB_PORT: '5432'
          E2E_DB_NAME: upgrade_ci
          E2E_DB_USER: postgres
          E2E_DB_PASSWORD: placeholder-password
          E2E_USER_PASSWORD: ${{ steps.capture_creds.outputs.e2e_user_password }}
        run: xvfb-run --auto-servernum node e2e-tests/run-upgrade.mjs

      - name: Preserve PostgreSQL upgrade runtime diagnostics before server replacement
        if: ${{ always() && matrix.edition == 'enterprise' && steps.upgrade_server.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          export COMPOSE_FILE="$COMPOSE_FILE:$RUNNER_TEMP/upgrade-pooler/upgrade-compose.json"
          mkdir -p e2e-tests/test-results/upgrade-postgres-runtime
          docker-compose -p alga-e2e-test logs --no-color --timestamps server > e2e-tests/test-results/upgrade-postgres-runtime/server.log
          docker-compose -p alga-e2e-test logs --no-color --timestamps postgres pgbouncer upgrade-pgbouncer > e2e-tests/test-results/upgrade-postgres-runtime/database.log
          docker-compose -p alga-e2e-test exec -T -e PGPASSWORD=placeholder-password postgres psql --no-password -v ON_ERROR_STOP=1 -U postgres -d postgres -Atc \
            "SELECT json_build_object('max_connections', current_setting('max_connections'), 'connections', (SELECT json_agg(s) FROM (SELECT datname, usename, backend_type, state, count(*) FROM pg_stat_activity GROUP BY datname, usename, backend_type, state) s));" \
            > e2e-tests/test-results/upgrade-postgres-runtime/connection-counts.json

      - name: Upload supported-upgrade evidence
        if: ${{ always() && matrix.edition == 'enterprise' && steps.upgrade_schema.outcome != 'skipped' && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: supported-upgrade-execution
          path: test-results/supported-upgrade/
          if-no-files-found: error
          retention-days: 30

      - name: Upload upgrade browser diagnostics
        if: ${{ always() && matrix.edition == 'enterprise' && steps.upgrade_server.outcome == 'success' && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: supported-upgrade-diagnostics
          path: e2e-tests/test-results/
          retention-days: 7

      - name: Release PostgreSQL upgrade pooler before the next phase
        if: ${{ always() && matrix.edition == 'enterprise' && steps.upgrade_schema.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          if [ -f "$RUNNER_TEMP/upgrade-pooler/upgrade-compose.json" ]; then
            export COMPOSE_FILE="$COMPOSE_FILE:$RUNNER_TEMP/upgrade-pooler/upgrade-compose.json"
            docker-compose -p alga-e2e-test stop upgrade-pgbouncer
          fi

      - name: Start isolated Citus upgrade service
        id: citus_upgrade_service
        if: ${{ !cancelled() && steps.shard.outputs.citus == 'true' && steps.capture_creds.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/citus-upgrade-compose.json" <<'JSON'
          {"services":{"upgrade-citus":{"image":"citusdata/citus:12.1","command":["postgres","-c","password_encryption=md5"],"environment":{"POSTGRES_USER":"postgres","POSTGRES_PASSWORD":"placeholder-password","POSTGRES_DB":"postgres","POSTGRES_HOST_AUTH_METHOD":"md5"},"networks":["app-network"]},"server":{"environment":{"DB_HOST":"upgrade-citus","DB_PORT":"5432","DB_NAME_SERVER":"upgrade_citus_ci"}}}}
          JSON
          export COMPOSE_FILE="$COMPOSE_FILE:$RUNNER_TEMP/citus-upgrade-compose.json"
          docker-compose -p alga-e2e-test up --no-build --no-deps -d upgrade-citus
          ready=false
          for _attempt in $(seq 1 60); do
            if node --input-type=module <<'JS'
          import pg from 'pg';
          const client = new pg.Client({ host: '127.0.0.1', port: 55433, user: 'postgres', password: 'placeholder-password', database: 'postgres', connectionTimeoutMillis: 2000, query_timeout: 2000 });
          try { await client.connect(); await client.query('SELECT 1'); }
          catch { process.exitCode = 1; }
          finally { await client.end(); }
          JS
            then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true

      - name: Prepare populated supported Citus upgrade
        id: citus_upgrade_schema
        if: ${{ !cancelled() && steps.citus_upgrade_service.outcome == 'success' && steps.capture_creds.outcome == 'success' }}
        timeout-minutes: 20
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          UPGRADE_DB_PORT: '55433'
          DB_USER_ADMIN: postgres
          DB_PASSWORD_ADMIN: placeholder-password
          DB_USER_SERVER: app_user
          UPGRADE_DB_BACKEND: citus
          UPGRADE_DATABASE_ISOLATED: 'true'
          UPGRADE_DB_NAME: upgrade_citus_ci
          E2E_USER_EMAIL: ${{ steps.capture_creds.outputs.e2e_user_email }}
        run: node scripts/prepare-supported-upgrade-ci.mjs

      - name: Switch the same candidate image to upgraded Citus
        id: citus_upgrade_server
        if: ${{ !cancelled() && steps.citus_upgrade_schema.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          image=alga-e2e-test_server_ee_local:latest
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = "$GITHUB_SHA"
          expected_image=$(docker image inspect --format '{{.Id}}' "$image")
          export COMPOSE_FILE="$COMPOSE_FILE:$RUNNER_TEMP/citus-upgrade-compose.json"
          docker-compose -p alga-e2e-test up --no-build --no-deps --force-recreate -d server
          container=$(docker-compose -p alga-e2e-test ps -q server)
          test "$(docker inspect --format '{{.Image}}' "$container")" = "$expected_image"
          echo "UPGRADE_APPLICATION_REVISION=$GITHUB_SHA" >> "$GITHUB_ENV"
          ready=false
          for _attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/api/health >/dev/null; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true

      - name: Run supported Citus upgrade browser gate
        id: citus_upgrade_browser
        if: ${{ !cancelled() && steps.citus_upgrade_server.outcome == 'success' && steps.browser_ready.outcome == 'success' }}
        timeout-minutes: 10
        env:
          UPGRADE_DB_BACKEND: citus
          E2E_BASE_URL: http://localhost:3000
          E2E_EDITION: enterprise
          E2E_DATABASE_ISOLATED: 'true'
          E2E_DB_HOST: 127.0.0.1
          E2E_DB_PORT: '55433'
          E2E_DB_NAME: upgrade_citus_ci
          E2E_DB_USER: postgres
          E2E_DB_PASSWORD: placeholder-password
          E2E_USER_PASSWORD: ${{ steps.capture_creds.outputs.e2e_user_password }}
        run: xvfb-run --auto-servernum node e2e-tests/run-upgrade.mjs

      - name: Preserve Citus upgrade runtime diagnostics before server replacement
        if: ${{ always() && steps.citus_upgrade_server.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          export COMPOSE_FILE="$COMPOSE_FILE:$RUNNER_TEMP/citus-upgrade-compose.json"
          mkdir -p e2e-tests/test-results/upgrade-citus-runtime
          docker-compose -p alga-e2e-test logs --no-color --timestamps server upgrade-citus > e2e-tests/test-results/upgrade-citus-runtime/services.log
          docker-compose -p alga-e2e-test exec -T -e PGPASSWORD=placeholder-password upgrade-citus psql --no-password -v ON_ERROR_STOP=1 -U postgres -d postgres -Atc \
            "SELECT json_build_object('max_connections', current_setting('max_connections'), 'connections', (SELECT json_agg(s) FROM (SELECT datname, usename, backend_type, state, count(*) FROM pg_stat_activity GROUP BY datname, usename, backend_type, state) s));" \
            > e2e-tests/test-results/upgrade-citus-runtime/connection-counts.json

      - name: Upload supported Citus upgrade evidence
        if: ${{ always() && steps.citus_upgrade_browser.outcome != 'skipped' && matrix.edition == 'enterprise' && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: supported-citus-upgrade-execution
          path: test-results/supported-upgrade/
          if-no-files-found: error
          retention-days: 30

      - name: Upload supported Citus upgrade diagnostics
        if: ${{ always() && steps.citus_upgrade_server.outcome == 'success' && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: supported-citus-upgrade-diagnostics
          path: e2e-tests/test-results/
          retention-days: 7

      # The setup chain shares the owned, expiring quarantine (scripts/lib/quarantine.json)
      # and must not fail the job carrying other browser gates. Readiness records a missing
      # Teams verdict as quarantined-failing and re-arms when the entry expires.
      - name: Start explicit Teams development configuration
        id: teams_development_server
        if: ${{ !cancelled() && steps.shard.outputs.teams == 'true' && steps.capture_creds.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # The development server compiles the application from the checkout
          # in the development runtime (docker-compose.e2e-development.yaml),
          # not in the production candidate, which carries no development
          # dependency tree. Its compiler cache and the static-chunk diagnostics
          # get disk-backed directories of their own.
          sudo install -d -o 1000 -g 1000 -m 0700 "$RUNNER_TEMP/teams-webpack-cache"
          sudo install -d -o 1000 -g 1000 -m 0700 "$RUNNER_TEMP/teams-static-chunks"
          export E2E_DEVELOPMENT_WORKSPACE="$GITHUB_WORKSPACE"
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const workspace = process.env.GITHUB_WORKSPACE;
          // /app is the checkout itself, so nothing may be mounted directly under
          // it: Docker would materialise the mount point as an untracked file or
          // directory in the checkout and the callback wrapper's clean-source
          // check would rightly refuse it. The harness scripts run from their
          // checkout paths; the diagnostics directory lives beside /app.
          const volumes = [];
          volumes.push({ type: 'bind', source: `${process.env.RUNNER_TEMP}/teams-static-chunks`, target: '/teams-static-chunks' });
          volumes.push({ type: 'bind', source: `${process.env.RUNNER_TEMP}/teams-webpack-cache`, target: '/app/server/node_modules/.cache/webpack' });
          const server = { entrypoint: ['node', '/app/e2e-tests/harness/start-teams-development-ci.mjs'], command: [], volumes,
            environment: { NODE_ENV: 'development', TEAMS_EMULATOR_MODE: 'true', NEXT_DIST_DIR: '.next/teams-development',
              E2E_TEAMS_DEVELOPMENT: 'true', E2E_DATABASE_ISOLATED: 'true', E2E_STATIC_CHUNK_DIAGNOSTICS_DIR: '/teams-static-chunks',
              DB_HOST: 'postgres', DB_PORT: '5432', DB_NAME_SERVER: 'server', REDIS_PREFIX: 'teams-development:',
              TEAMS_BOT_APP_ID: 'e2e-teams-bot', TEAMS_BOT_APP_TENANT_ID: 'e2e-bot-tenant', TEAMS_BOT_APP_PASSWORD: 'synthetic-e2e-teams-bot-secret',
              TEAMS_BOT_OPENID_CONFIG_URL: 'http://algasim:4010/v1/.well-known/openidconfiguration', TEAMS_BOT_SERVICE_URL_ALLOWLIST: 'http://algasim:4010',
              NEXT_PUBLIC_APP_URL: 'http://localhost:3000', NODE_OPTIONS: '--max-old-space-size=12288 --import=/app/e2e-tests/harness/capture-teams-static-chunks.mjs' } };
          writeFileSync(`${process.env.RUNNER_TEMP}/teams-development-compose.json`, JSON.stringify({ services: { server } }));
          JS
          export COMPOSE_FILE="$COMPOSE_FILE:docker-compose.e2e-development.yaml:$RUNNER_TEMP/teams-development-compose.json"
          # Earlier production/provider phases have completed. Retain their logs,
          # but release worker memory before compiling the development app.
          # The EE development server still uses Temporal for job initialization.
          # Keep its frontend available while releasing the consumer processes.
          docker-compose -p alga-e2e-test stop email-service hocuspocus workflow-worker temporal-worker
          docker-compose -p alga-e2e-test up --no-build --no-deps --force-recreate -d server
          docker-compose -p alga-e2e-test exec -T server node -e 'const fs = require("node:fs"); const probe = "/app/server/node_modules/.cache/webpack/.write-probe"; fs.writeFileSync(probe, "cache-writable", { flag: "wx" }); fs.unlinkSync(probe);'
          ready=false
          mkdir -p "$RUNNER_TEMP/teams-development-probe"
          : > "$RUNNER_TEMP/teams-development-probe/attempts.txt"
          for _attempt in $(seq 1 90); do
            if status=$(curl --max-time 15 --fail --silent -w '%{http_code}' -o /dev/null http://localhost:3000/auth/msp/signin); then
              case "$status" in 2??|3??) ready=true ;; esac
            fi
            if [ -z "$status" ] || [ "$status" = 000 ]; then status=no-response; fi
            printf '%s %s %s\n' "$_attempt" "$(date +%s)" "$status" >> "$RUNNER_TEMP/teams-development-probe/attempts.txt"
            if [ "$ready" = true ]; then break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            : > "$RUNNER_TEMP/teams-development-probe/last-body-full.html"
            status=$(curl --max-time 15 --silent -w '%{http_code}' \
              -D "$RUNNER_TEMP/teams-development-probe/last-headers.txt" \
              -o "$RUNNER_TEMP/teams-development-probe/last-body-full.html" \
              http://localhost:3000/auth/msp/signin) || true
            if [ -z "$status" ] || [ "$status" = 000 ]; then status=no-response; fi
            head -c 4096 "$RUNNER_TEMP/teams-development-probe/last-body-full.html" > "$RUNNER_TEMP/teams-development-probe/last-body.html" || true
            rm -f "$RUNNER_TEMP/teams-development-probe/last-body-full.html"
            timeout --kill-after=5s 30s docker-compose -p alga-e2e-test logs --no-color --tail=200 server > "$RUNNER_TEMP/teams-development-probe/server-tail.log" 2>&1 || true
            timeout --kill-after=5s 30s docker-compose -p alga-e2e-test ps > "$RUNNER_TEMP/teams-development-probe/container-status.txt" 2>&1 || true
            echo "::warning::Teams development server never became ready after $_attempt attempts; last status $status"
            head -n 40 "$RUNNER_TEMP/teams-development-probe/last-body.html"
          fi
          printf '%s\n' "$status" > "$RUNNER_TEMP/teams-development-probe/last-status.txt"
          test "$ready" = true

      - name: Check Teams source authentication configuration
        id: teams_auth_preflight
        if: ${{ !cancelled() && steps.teams_development_server.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          E2E_DATABASE_ISOLATED: 'true'
          E2E_USER_EMAIL: ${{ steps.capture_creds.outputs.e2e_user_email }}
          E2E_USER_PASSWORD: ${{ steps.capture_creds.outputs.e2e_user_password }}
        run: |
          docker-compose -p alga-e2e-test exec -T \
            -e E2E_DATABASE_ISOLATED -e E2E_USER_EMAIL -e E2E_USER_PASSWORD server \
            node --import /app/node_modules/tsx/dist/loader.mjs /app/e2e-tests/harness/check-teams-development-auth.mjs

      - name: Warm authenticated Teams dashboard
        id: teams_dashboard_ready
        if: ${{ !cancelled() && steps.teams_auth_preflight.outcome == 'success' && steps.browser_ready.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          E2E_TEAMS_DEVELOPMENT: 'true'
          E2E_DATABASE_ISOLATED: 'true'
          E2E_BASE_URL: http://localhost:3000
          E2E_USER_EMAIL: ${{ steps.capture_creds.outputs.e2e_user_email }}
          E2E_USER_PASSWORD: ${{ steps.capture_creds.outputs.e2e_user_password }}
        run: node e2e-tests/harness/warm-teams-dashboard.mjs

      - name: Run Teams development execution gate
        id: teams_development_browser
        if: ${{ !cancelled() && steps.teams_development_server.outcome == 'success' && steps.teams_auth_preflight.outcome == 'success' && steps.browser_ready.outcome == 'success' && steps.teams_dashboard_ready.outcome == 'success' }}
        # No longer quarantined (scripts/lib/quarantine.json is empty). Like the
        # Teams setup steps above, this one does not veto the browser job it shares
        # with other requirements; the readiness gate enforces the uploaded verdict,
        # so a failure here fails readiness on teams-development-execution alone.
        continue-on-error: true
        timeout-minutes: 10
        env:
          E2E_TEAMS_DEVELOPMENT: 'true'
          E2E_BASE_URL: http://localhost:3000
          E2E_EDITION: enterprise
          E2E_DATABASE_ISOLATED: 'true'
          E2E_EMULATORS_ISOLATED: 'true'
          ALGASIM_CONTROL_URL: http://localhost:9500
          E2E_DB_HOST: 127.0.0.1
          E2E_DB_PORT: '5432'
          E2E_DB_NAME: server
          E2E_DB_USER: postgres
          E2E_DB_PASSWORD: placeholder-password
          E2E_USER_EMAIL: ${{ steps.capture_creds.outputs.e2e_user_email }}
          E2E_USER_PASSWORD: ${{ steps.capture_creds.outputs.e2e_user_password }}
        run: xvfb-run --auto-servernum node e2e-tests/run-teams-development.mjs

      - name: Upload Teams development execution
        if: ${{ always() && steps.teams_development_browser.outcome != 'skipped' && matrix.edition == 'enterprise' && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: teams-development-execution
          path: test-results/teams-development/
          if-no-files-found: error
          retention-days: 30

      - name: Collect bounded Teams static chunk diagnostics
        if: ${{ always() && steps.teams_development_server.outcome == 'success' }}
        timeout-minutes: 1
        run: |
          mkdir -p e2e-tests/test-results/local/static-chunks
          sudo cp -R "$RUNNER_TEMP/teams-static-chunks/." e2e-tests/test-results/local/static-chunks/
          sudo chown -R "$(id -u):$(id -g)" e2e-tests/test-results/local/static-chunks

      - name: Upload Teams development diagnostics
        if: ${{ always() && steps.teams_development_server.outcome == 'success' && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: teams-development-diagnostics
          path: e2e-tests/test-results/local/
          retention-days: 7

      - name: Upload Teams development probe diagnostics
        if: ${{ always() && steps.teams_development_server.outcome != 'skipped' && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: teams-development-probe
          path: ${{ runner.temp }}/teams-development-probe/
          if-no-files-found: warn
          retention-days: 7

      - name: Run actual Microsoft callback against isolated authority
        id: microsoft_callback
        if: ${{ !cancelled() && steps.shard.outputs.microsoft == 'true' && steps.capture_creds.outcome == 'success' }}
        timeout-minutes: 9
        env:
          NATIVE_MICROSOFT_OIDC_SOURCE_EMAIL: ${{ steps.capture_creds.outputs.e2e_user_email }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/microsoft-callback"
          sudo install -d -o 1000 -g 1000 -m 0700 "$RUNNER_TEMP/microsoft-callback/dist" "$RUNNER_TEMP/microsoft-callback/webpack"
          # Both the host verifier and the container write separate evidence files.
          sudo install -d -o 1000 -g 1000 -m 0777 "$GITHUB_WORKSPACE/test-results/microsoft-callback"
          # The callback compiles the application with `next dev`, which runs in
          # the development runtime from the checkout (see the Teams step).
          export E2E_DEVELOPMENT_WORKSPACE="$GITHUB_WORKSPACE"
          export COMPOSE_FILE="$COMPOSE_FILE:docker-compose.e2e-development.yaml"
          node scripts/run-microsoft-callback-ci.mjs

      - name: Upload Microsoft callback execution
        if: ${{ always() && steps.microsoft_callback.outcome != 'skipped' && matrix.edition == 'enterprise' && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-callback-execution
          path: test-results/microsoft-callback/
          if-no-files-found: error
          retention-days: 30

      - name: Collect all container logs on failure
        if: failure() && steps.install_docker_compose.outcome == 'success'
        timeout-minutes: 5
        run: |
          mkdir -p logs
          timeout --kill-after=2s 5s free -m > logs/host-memory.txt 2>&1 || { capture_exit=$?; echo "Memory capture exit: $capture_exit" >> logs/host-memory.txt; }
          timeout --kill-after=2s 5s df -h > logs/host-disk.txt 2>&1 || { capture_exit=$?; echo "Disk capture exit: $capture_exit" >> logs/host-disk.txt; }
          # Preserve the useful logs before inspecting a potentially wedged daemon.
          # Kill-after also bounds clients that ignore TERM; partial output survives.
          timeout --kill-after=5s 45s docker-compose -p alga-e2e-test logs --no-color --tail=1000 server > logs/failure-server.log 2>&1 || { capture_exit=$?; echo "Server log collection timed out or failed; exit: $capture_exit" >> logs/failure-server.log; }
          timeout --kill-after=5s 45s docker-compose -p alga-e2e-test logs --no-color --tail=1000 > logs/failure-all-services.log 2>&1 || { capture_exit=$?; echo "Combined log collection timed out or failed; exit: $capture_exit" >> logs/failure-all-services.log; }
          timeout --kill-after=5s 15s docker-compose -p alga-e2e-test ps > logs/failure-container-status.txt 2>&1 || { capture_exit=$?; echo "Container status timed out or failed; exit: $capture_exit" >> logs/failure-container-status.txt; }
          # Avoid redundant per-container reads and expensive system disk scans.
          tail -n 200 logs/failure-server.log
          tail -n 200 logs/failure-all-services.log
        shell: bash

      - name: Save container logs as artifacts
        timeout-minutes: 5
        if: always() && steps.install_docker_compose.outcome == 'success'
        run: |
          mkdir -p logs

          # Copy any Playwright screenshots to logs directory
          cp e2e-tests/*.png logs/ 2>/dev/null || echo "No Playwright screenshots found"
          cp e2e-tests/test-results/**/*.png logs/ 2>/dev/null || echo "No test-results screenshots found"

          # Each request has a hard kill bound, keeping artifact upload reachable.
          # Append failure markers instead of overwriting partial diagnostic output.
          timeout --kill-after=5s 45s docker-compose -p alga-e2e-test logs --no-color server > logs/server.log 2>&1 || { capture_exit=$?; echo "Server log collection timed out or failed; exit: $capture_exit" >> logs/server.log; }
          timeout --kill-after=5s 45s docker-compose -p alga-e2e-test logs --no-color > logs/all-services.log 2>&1 || { capture_exit=$?; echo "Combined log collection timed out or failed; exit: $capture_exit" >> logs/all-services.log; }
          for service in setup postgres redis pgbouncer hocuspocus workflow-worker temporal-worker temporal-dev; do
            timeout --kill-after=2s 10s docker-compose -p alga-e2e-test logs --no-color "$service" > "logs/${service}.log" 2>&1 || { capture_exit=$?; echo "Service log collection timed out or failed; exit: $capture_exit" >> "logs/${service}.log"; }
          done
          timeout --kill-after=2s 10s docker-compose -p alga-e2e-test ps > logs/container-status.txt 2>&1 || { capture_exit=$?; echo "Container status timed out or failed; exit: $capture_exit" >> logs/container-status.txt; }

          # Save environment info
          echo "Environment variables:" > logs/environment.txt
          env | grep -E "(APP_|NODE_|DB_|REDIS_)" >> logs/environment.txt || echo "Could not save environment"
          
          ls -la logs/
        shell: bash

      - name: Upload logs as artifacts
        if: always() && steps.install_docker_compose.outcome == 'success' && github.actor != 'nektos/act'
        uses: actions/upload-artifact@v4
        with:
          name: container-logs-${{ matrix.edition }}-${{ matrix.lane }}
          path: logs/
          retention-days: 7

      - name: Cleanup Docker Compose
        timeout-minutes: 3
        if: always() && steps.install_docker_compose.outcome == 'success' # Ensure docker-compose was attempted to be installed
        run: |
          echo "Cleaning up Docker Compose environment..."
          # Check if docker-compose command is available before trying to use it
          if command -v docker-compose &> /dev/null; then
            timeout --kill-after=10s 120s docker-compose -p alga-e2e-test down -v --remove-orphans || echo "Docker Compose cleanup failed, but continuing."
          else
            echo "docker-compose command not found, skipping cleanup."
          fi
        shell: bash

      - name: Restore root docker-compose.yaml
        if: always() && env.ACT
        run: |
          if [ -f docker-compose.yaml.ignored ]; then
            echo "Restoring root docker-compose.yaml"
            sudo mv docker-compose.yaml.ignored docker-compose.yaml
          fi
        shell: bash

  # One job per edition, carrying the name the browser-metrics collector
  # matches ("browser / Production browser (<edition>)"). It folds the
  # edition's browser shards back into the single evidence record
  # (`fresh-install-playwright-<edition>`) that the metrics reconciliation and
  # the weekly flaky report read, and records journey readiness from the merged
  # metrics. The gate job below performs the same merge from the same shard
  # artifacts, so neither waits on the other.
  browser-evidence:
    name: Production browser (${{ matrix.edition }})
    needs: [changes, production-browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        edition: [community, enterprise]
    steps:
      - name: Record browser tests not selected
        if: needs.changes.outputs.run_tests == 'false'
        run: echo "Browser tests were not selected by the changes filter."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.run_tests == 'true'

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.run_tests == 'true'
        with:
          node-version: '22'

      - name: Download this edition's browser shard evidence
        if: needs.changes.outputs.run_tests == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: fresh-install-browser-shard-${{ matrix.edition }}-*
          path: ${{ runner.temp }}/browser-shards

      # Fails when the merged evidence did not pass: a shard that never
      # published, a shard whose journeys failed, or shards that disagree about
      # the collection or the candidate. Writes its files either way so the
      # uploads and the recorder below still see the merged state.
      - name: Merge browser shard evidence
        id: merge
        if: needs.changes.outputs.run_tests == 'true'
        env:
          EDITION: ${{ matrix.edition }}
        run: node scripts/merge-browser-shards.mjs --edition "$EDITION" --input "$RUNNER_TEMP/browser-shards" --output "$RUNNER_TEMP/browser-evidence"

      - name: Upload merged Playwright execution evidence
        if: always() && steps.merge.outcome != 'skipped' && !env.ACT
        uses: actions/upload-artifact@v4
        with:
          name: fresh-install-playwright-${{ matrix.edition }}
          path: ${{ runner.temp }}/browser-evidence/
          retention-days: 7

      # A retry-only pass still fails the strict gate, so this upload must
      # survive the red job that publishes it. Reporting flakes is never itself a
      # gate. The merge fills this directory only when something retried, so a
      # run with no flake publishes nothing and the weekly report spends no API
      # budget on it; the always-written document rides along in the merged
      # evidence artifact above.
      - name: Upload browser flaky-test evidence
        if: always() && steps.merge.outcome != 'skipped' && !env.ACT
        uses: actions/upload-artifact@v4
        with:
          name: flaky-tests-browser-${{ matrix.edition }}
          path: ${{ runner.temp }}/browser-evidence/e2e-tests/execution-evidence/flaky/
          if-no-files-found: ignore
          retention-days: 30

      # Recorded once every browser shard's installation setup succeeded (each
      # shard publishes its descriptor only then), including failed or partial
      # journey execution. A shard that never came up records nothing, as the
      # single browser job did after a setup failure.
      - name: Record browser journey readiness
        if: always() && steps.merge.outcome != 'skipped' && steps.merge.outputs.complete == 'true' && !env.ACT
        continue-on-error: true
        run: node scripts/record-browser-metrics.mjs
        env:
          TEST_METRICS_BROWSER: ${{ runner.temp }}/browser-evidence/e2e-tests/execution-evidence/metrics.json
          E2E_EDITION: ${{ matrix.edition }}
          GOOGLE_SA_KEY: ${{ secrets.TEST_METRICS_GOOGLE_SA_KEY }}
          TEST_METRICS_SHEET_ID: ${{ vars.TEST_METRICS_SHEET_ID }}

  # Preserve the required check name while requiring every shard of both
  # editions and the builds. The browser shards are merged here from their own
  # artifacts, so the evidence below still arrives once per edition.
  fresh-install-e2e:
    needs: [changes, browser-collection, build-images, production-browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download every browser shard's execution artifact
        if: always() && needs.changes.outputs.run_tests == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: fresh-install-browser-shard-*
          path: test-results/fresh-install-input
      - name: Merge each edition's browser shards into its execution evidence
        if: always() && needs.changes.outputs.run_tests == 'true'
        run: |
          status=0
          for edition in community enterprise; do
            node scripts/merge-browser-shards.mjs --edition "$edition" \
              --input test-results/fresh-install-input \
              --output "test-results/fresh-install-input/fresh-install-playwright-$edition" || status=1
          done
          exit "$status"
      - name: Download both API execution artifacts
        if: always() && needs.changes.outputs.run_tests == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: fresh-install-api-*
          path: test-results/fresh-install-input
      - name: Require complete production execution
        if: always()
        env:
          FRESH_INSTALL_JOB_RESULTS: ${{ toJSON(needs) }}
          TIER1_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/verify-fresh-install-execution.mjs
      - name: Preserve aggregate decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-install-execution-gate
          path: test-results/fresh-install-gate/
          if-no-files-found: error
          retention-days: 30
          overwrite: true
