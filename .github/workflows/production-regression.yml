name: Production regression tests

on:
  pull_request:
  push:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      suite:
        description: Integration suite
        type: choice
        options: [tier1, full]
        default: full
      no_cache:
        description: Build images without layer caches
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-regression-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selection:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.select.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: select
        run: node scripts/select-integration-tests.mjs
        env:
          TIER1_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TIER1_HEAD_SHA: ${{ github.sha }}
  unit:
    uses: ./.github/workflows/unit-tests.yml
    secrets: inherit

  mobile:
    uses: ./.github/workflows/mobile-checks.yml
    secrets: inherit

  node:
    uses: ./.github/workflows/node-tests.yml
    secrets: inherit

  workspace:
    uses: ./.github/workflows/workspace-tests.yml
    secrets: inherit

  integration:
    uses: ./.github/workflows/integration-tests.yml
    secrets: inherit

  # The browser lane is called from two jobs because the package-writing grant
  # depends on the event and a job's `permissions:` cannot be conditional. A
  # called workflow cannot hold more than its caller grants, so a pull request
  # that reaches only `browser-pr` has no token that can push a package. The
  # called workflow's build-images job inherits whichever grant its caller has.
  browser-pr:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/e2e-fresh-install-tests.yaml
    permissions:
      contents: read
      packages: read
    secrets: inherit

  browser-trusted:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/e2e-fresh-install-tests.yaml
    # Pushes and dispatches hand candidate images between the lane's jobs
    # through the GitHub Container Registry. No `id-token` here: only the
    # promotion job signs anything.
    permissions:
      contents: read
      packages: write
    secrets: inherit

  # One name for the lane's verdict, so inventory, readiness and the readiness
  # requirements (scripts/lib/production-readiness.mjs) keep reading
  # needs.browser.result whichever caller ran.
  browser:
    name: Browser lane verdict
    needs: [browser-pr, browser-trusted]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the caller that ran to have succeeded
        env:
          PR_RESULT: ${{ needs.browser-pr.result }}
          TRUSTED_RESULT: ${{ needs.browser-trusted.result }}
        run: |
          echo "browser-pr: $PR_RESULT, browser-trusted: $TRUSTED_RESULT"
          if [ "$PR_RESULT" = success ] && [ "$TRUSTED_RESULT" = skipped ]; then exit 0; fi
          if [ "$TRUSTED_RESULT" = success ] && [ "$PR_RESULT" = skipped ]; then exit 0; fi
          exit 1

  # The only job anywhere that writes a `tree-<hash>` tag. Argo copies the image
  # under `tree-<tree of the commit it deploys>`, so that name must only ever
  # point at what main built. It runs after the browser lane (a job inside the
  # called workflow cannot hold id-token, because browser-pr cannot grant it),
  # which also means only browser-tested images are promoted. Everything it
  # trusts is recomputed here: the tree from this checkout, the labels from the
  # registry. Verify first, tag second, attest third.
  promote-trusted-images:
    name: Promote trusted tree images
    needs: browser-trusted
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.browser-trusted.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      SERVICES: server server-ee
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate to the candidate image registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Recomputed, not read from the build job's output.
      - name: Resolve the source tree
        id: tree
        run: |
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          # Registry names are lowercase; the repository slug may not be.
          echo "namespace=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Download the candidate build records
        uses: actions/download-artifact@v4
        with:
          pattern: fresh-install-build-record-*
          path: ${{ runner.temp }}/build-records

      - name: Verify the candidates were built from this commit and tree
        id: candidates
        env:
          TREE: ${{ steps.tree.outputs.tree }}
          RECORDS: ${{ runner.temp }}/build-records
        run: |
          # Fail closed: any missing record, digest or label mismatch stops the
          # job before a tag exists.
          for service in $SERVICES; do
            record="$RECORDS/fresh-install-build-record-$service/$service-build.json"
            reference="ghcr.io/${GITHUB_REPOSITORY,,}/e2e-$service"
            digest="$(node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(!/^sha256:[0-9a-f]{64}$/.test(r.registry?.manifestDigest)) process.exit(1); console.log(r.registry.manifestDigest)' "$record")"
            docker buildx imagetools inspect "$reference@$digest" --format '{{json .Image}}' \
              | node scripts/verify-trusted-tree-image.mjs labels --tree "$TREE" --revision "$GITHUB_SHA"
            echo "${service//-/_}=$digest" >> "$GITHUB_OUTPUT"
          done

      - name: Tag the verified candidates with their source tree
        env:
          TREE: ${{ steps.tree.outputs.tree }}
          SERVER_DIGEST: ${{ steps.candidates.outputs.server }}
          SERVER_EE_DIGEST: ${{ steps.candidates.outputs.server_ee }}
        run: |
          for pair in "server:$SERVER_DIGEST" "server-ee:$SERVER_EE_DIGEST"; do
            service="${pair%%:*}" digest="${pair#*:}"
            reference="ghcr.io/${GITHUB_REPOSITORY,,}/e2e-$service"
            docker buildx imagetools create --tag "$reference:tree-$TREE" "$reference@$digest"
          done

      # The attestation is what consumers check: its certificate records the ref
      # of this run, which a pull request or a branch cannot make refs/heads/main.
      - name: Attest the community candidate
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ steps.tree.outputs.namespace }}/e2e-server
          subject-digest: ${{ steps.candidates.outputs.server }}
          push-to-registry: true

      - name: Attest the enterprise candidate
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ steps.tree.outputs.namespace }}/e2e-server-ee
          subject-digest: ${{ steps.candidates.outputs.server-ee }}
          push-to-registry: true

  temporal:
    needs: selection
    if: needs.selection.outputs.should_run == 'true'
    uses: ./.github/workflows/temporal-readiness.yml
    secrets: inherit

  citus:
    needs: selection
    if: needs.selection.outputs.should_run == 'true'
    uses: ./.github/workflows/citus-migration-smoke.yml
    secrets: inherit

  inventory:
    name: Repository test inventory
    if: always()
    needs: [selection, unit, node, workspace, integration, browser, temporal, citus, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Only collection/evidence bundles; image archives are intentionally absent.
      # Keep directories separate so equal report filenames cannot overwrite.
      - name: Download runner collection artifacts from this run
        if: needs.selection.outputs.should_run == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: "{server-unit-execution,workspace-unit-${{ github.sha }},workspace-runtime-${{ github.sha }},server-colocated-${{ github.sha }},nx-tooling-${{ github.sha }},ui-kit-showcase-${{ github.sha }},enterprise-integration-${{ github.sha }},ai-gateway-${{ github.sha }},enterprise-unit-shard-1,enterprise-unit-shard-2,enterprise-unit-shard-3,server-integration-shard-1,server-integration-shard-2,server-integration-shard-3,server-integration-shard-4,infrastructure-shard-1,infrastructure-shard-2,infrastructure-shard-3,workspace-db-evidence,fresh-install-api-community,temporal-readiness-execution,temporal-engine-execution,temporal-database-execution,mobile-execution,node-tooling-${{ github.sha }},appliance-node-${{ github.sha }},browser-discovery-${{ github.sha }},manual-test-inventory}"
          path: test-results/inventory-input
          merge-multiple: false
      - name: Reconcile tracked candidates against actual runner registrations
        if: always()
        run: node scripts/verify-repository-inventory.mjs
        env:
          INVENTORY_JOBS: ${{ toJSON(needs) }}
          TIER1_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      # A React test that no jsdom glob claims runs under environment: 'node'
      # and dies on its first `window`. Checked here, beside the inventory,
      # because both answer "is this test wired up the way it claims to be".
      - name: Require every React test to reach a browser environment
        if: always()
        # Write into the directory the step below uploads; the default path
        # (test-results/react-test-environment.json) is outside it and is lost
        # with the runner.
        run: node scripts/verify-react-test-environment.mjs test-results/repository-inventory/react-test-environment.json
      - name: Preserve repository inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-inventory
          path: test-results/repository-inventory/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  readiness:
    name: Production regression readiness
    if: always()
    needs: [selection, unit, node, workspace, integration, browser, temporal, citus, mobile, inventory]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download server-unit-aggregate
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: server-unit-aggregate
          path: test-results/readiness-input/server-unit-aggregate
      - name: Download node-workflow-gate-${{ github.sha }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: node-workflow-gate-${{ github.sha }}
          path: test-results/readiness-input/node-workflow-gate-${{ github.sha }}
      - name: Download workspace-execution-gate
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: workspace-execution-gate
          path: test-results/readiness-input/workspace-execution-gate
      - name: Download integration-execution-gate
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: integration-execution-gate
          path: test-results/readiness-input/integration-execution-gate
      - name: Download infrastructure-execution-evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: infrastructure-execution-evidence
          path: test-results/readiness-input/infrastructure-execution-evidence
      - name: Download workspace-db-aggregate
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: workspace-db-aggregate
          path: test-results/readiness-input/workspace-db-aggregate
      - name: Download fresh-install-execution-gate
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: fresh-install-execution-gate
          path: test-results/readiness-input/fresh-install-execution-gate
      - name: Download temporal-execution-gate
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: temporal-execution-gate
          path: test-results/readiness-input/temporal-execution-gate
      - name: Download citus-aggregate
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: citus-aggregate
          path: test-results/readiness-input/citus-aggregate
      - name: Download supported-upgrade execution
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: supported-upgrade-execution
          path: test-results/readiness-input/supported-upgrade-execution
      - name: Download supported Citus upgrade execution
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: supported-citus-upgrade-execution
          path: test-results/readiness-input/supported-citus-upgrade-execution
      - name: Download Teams development execution
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: teams-development-execution
          path: test-results/readiness-input/teams-development-execution
      - name: Download Microsoft callback execution
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: microsoft-callback-execution
          path: test-results/readiness-input/microsoft-callback-execution
      - name: Download repository inventory
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: repository-inventory
          path: test-results/readiness-input/repository-inventory
      - name: Require every mandatory workflow and execution verdict
        if: always()
        run: node scripts/verify-production-readiness.mjs
        env:
          READINESS_JOBS: ${{ toJSON(needs) }}
          TIER1_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      - name: Preserve readiness decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-regression-readiness-${{ github.sha }}
          path: test-results/production-readiness/
          if-no-files-found: error
          retention-days: 30
      # One row per run in the sheet's gate_runs tab: the verdict above plus the
      # lanes that went red (docs/reference/test-metrics.md). No-op without the
      # Google secrets; never fails the gate.
      - name: Record gate verdict to Google Sheet
        if: always()
        continue-on-error: true
        run: node scripts/record-gate-metrics.mjs
        env:
          READINESS_JOBS: ${{ toJSON(needs) }}
          GOOGLE_SA_KEY: ${{ secrets.TEST_METRICS_GOOGLE_SA_KEY }}
          TEST_METRICS_SHEET_ID: ${{ vars.TEST_METRICS_SHEET_ID }}
