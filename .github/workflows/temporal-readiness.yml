name: Temporal Readiness

on:
  pull_request:
    paths:
      - 'ee/temporal-workflows/**'
      - 'ee/packages/**'
      - 'ee/server/seeds/**'
      - 'shared/**'
      - 'scripts/run-additional-workspace-tests.mjs'
      - 'scripts/lib/**'
      - 'packages/**'
      - 'scripts/check-temporal-worker-packaging-contract.mjs'
      - 'scripts/temporal-worker-dist-import-smoke.mjs'
      - 'scripts/temporal-worker-docker-parity.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/temporal-readiness.yml'
  push:
    branches:
      - main
    paths:
      - 'ee/temporal-workflows/**'
      - 'ee/packages/**'
      - 'ee/server/seeds/**'
      - 'shared/**'
      - 'scripts/run-additional-workspace-tests.mjs'
      - 'scripts/lib/**'
      - 'packages/**'
      - 'scripts/check-temporal-worker-packaging-contract.mjs'
      - 'scripts/temporal-worker-dist-import-smoke.mjs'
      - 'scripts/temporal-worker-docker-parity.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/temporal-readiness.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  engine-tests:
    name: Temporal engine execution complete
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Collect and execute isolated Temporal engine workflows
        run: node scripts/run-additional-workspace-tests.mjs temporal-engine
      - name: Preserve Temporal engine execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporal-engine-execution
          path: test-results/temporal-engine/
          if-no-files-found: error
          retention-days: 30

  fast-readiness:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Temporal readiness fast gate
        run: npm run guard:temporal-readiness:fast

      - name: Execute built snapshot workflow in Temporal test server
        run: npm run test:temporal-snapshot-runtime

      - name: Upload Temporal readiness execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporal-readiness-execution
          path: test-results/temporal-readiness/
          retention-days: 7

  docker-parity:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Docker parity gate
        run: npm run guard:temporal-readiness:docker
