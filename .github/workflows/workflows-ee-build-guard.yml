name: EE Workflows Build Guard

on:
  pull_request:
    paths:
      - server/**
      - ee/server/**
      - packages/workflows/**
      - ee/packages/workflows/**
      - packages/ee/**
      - package.json
      - package-lock.json
      - nx.json
      - scripts/guard-ee-workflows-next-build.mjs
      - scripts/guard-no-legacy-workflows-shims.mjs
      - .github/workflows/workflows-ee-build-guard.yml
  push:
    branches:
      - main
    paths:
      - server/**
      - ee/server/**
      - packages/workflows/**
      - ee/packages/workflows/**
      - packages/ee/**
      - package.json
      - package-lock.json
      - nx.json
      - scripts/guard-ee-workflows-next-build.mjs
      - scripts/guard-no-legacy-workflows-shims.mjs
      - .github/workflows/workflows-ee-build-guard.yml

jobs:
  ee-workflows-build-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Upgrade npm to version 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Provide production build memory headroom
        run: |
          free -h
          sudo fallocate -l 8G /swapfile-alga-ee-guard
          sudo chmod 600 /swapfile-alga-ee-guard
          sudo mkswap /swapfile-alga-ee-guard
          sudo swapon /swapfile-alga-ee-guard
          free -h

      - name: Provide build-time env
        run: |
          cp .env.example server/.env

      - name: Build server (EE)
        env:
          EDITION: ee
          NEXT_PUBLIC_EDITION: enterprise
          USE_PREBUILT: 'true'
          # NODE_OPTIONS below is inherited by forked children, so each "Collecting
          # page data" worker also gets a 14 GB heap allowance. Four of those on a
          # 16 GB runner OOM'd the host — every failure of this job has died there.
          # Dropping to 2 workers was not enough: 2 × 14 GB still overcommits the
          # 16 GB runner, and the host was killed again during "Collecting page data
          # using 2 workers" (abrupt "operation was canceled", no build error).
          # Serialize to a single worker: 1 × 14 GB fits, so this phase can no longer
          # OOM. Costs ~a few minutes of build time (page-data runs serially) — well
          # within the 30 min job timeout.
          NEXT_BUILD_CPUS: '1'
        run: |
          npx nx build-deps server --output-style=static
          # Override the 8 GB cap baked into server/package.json's build script;
          # the EE webpack build hits the heap limit on ubuntu-latest at 8 GB.
          # 14 GB leaves ~2 GB headroom on the 16 GB runner for the OS and other processes.
          # Only the compile phase (single process, ~11m) needs this much.
          cd server
          NODE_OPTIONS='--max-old-space-size=14336' NODE_ENV=production npx next build --webpack

      - name: "Guard: legacy workflows shims removed"
        run: node scripts/guard-no-legacy-workflows-shims.mjs

      - name: "Guard: no OSS workflows stub in EE output"
        run: node scripts/guard-ee-workflows-next-build.mjs server/.next
