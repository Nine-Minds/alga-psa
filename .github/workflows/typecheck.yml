name: TypeScript Type Check

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

# Stop superseded PR runs from holding a runner for the full 20-minute job.
# Keep every main run.
concurrency:
  group: typecheck-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Nx affected typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Required for `nx affected --base/--head` on PRs; shallow clones can miss the base SHA.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Nx computation cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-cache-${{ runner.os }}-${{ hashFiles('package-lock.json', 'nx.json', 'tsconfig.base.json', '**/project.json') }}
          restore-keys: |
            nx-cache-${{ runner.os }}-

      - name: Upgrade npm to version 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: |
          if ! npm ci; then
            echo "npm ci failed; attempting npm install fallback to regenerate lock data"
            npm install --legacy-peer-deps
          fi

      - name: Determine Nx base/head
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "NX_BASE=${{ github.event.pull_request.base.sha }}" >> $GITHUB_ENV
            echo "NX_HEAD=${{ github.event.pull_request.head.sha }}" >> $GITHUB_ENV
          else
            echo "NX_BASE=${{ github.event.before }}" >> $GITHUB_ENV
            echo "NX_HEAD=${{ github.sha }}" >> $GITHUB_ENV
          fi

      # ubuntu-latest runners have 16 GB RAM. The server, sebastian-ee and billing
      # typechecks pull in large shared type graphs and need the serial heap budget,
      # so they cannot share the runner with any other concurrent tsc. Running the full
      # `nx affected` set in parallel let two heavy typechecks overlap and OOM-killed the
      # runner ("received a shutdown signal" / "operation was canceled"), even though the
      # typecheck itself had no errors. We split into three passes:
      #   1. Smaller libraries in parallel (capped heap × parallelism stays under 16 GB).
      #   2. `@alga-psa/billing` alone, with a larger heap (see below).
      #   3. The heavy apps serially, each with the whole box to itself.
      # Pass 3 re-evaluates `affected` but the libraries are instant Nx cache hits from
      # passes 1 and 2, so it only does real work for the apps — and only when they are affected.
      - name: Nx affected typecheck (libraries, parallel)
        run: npx nx affected -t typecheck --base=$NX_BASE --head=$NX_HEAD --output-style=static --parallel=2 --exclude=server,sebastian-ee,@alga-psa/billing
        env:
          NX_DAEMON: 'false'
          # 2 concurrent × 6 GB = 12 GB, leaving headroom for the runner.
          NODE_OPTIONS: '--max-old-space-size=6144'

      # The billing typecheck peaks at ~6 GB on Linux/Node 20, right at the 6 GB cap
      # above, so it intermittently OOMs. Run it alone so it can have 8 GB without
      # pushing the parallel pass past the runner's RAM.
      - name: Nx affected typecheck (billing, isolated)
        shell: bash
        run: |
          if npx nx show projects --affected --base=$NX_BASE --head=$NX_HEAD | grep -qx '@alga-psa/billing'; then
            npx nx run @alga-psa/billing:typecheck --output-style=static
          else
            echo "@alga-psa/billing is not affected; skipping."
          fi
        env:
          NX_DAEMON: 'false'
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Nx affected typecheck (apps, isolated & serial)
        run: npx nx affected -t typecheck --base=$NX_BASE --head=$NX_HEAD --output-style=static --parallel=1
        env:
          NX_DAEMON: 'false'
          # Each heavy project runs alone; 14 GB leaves headroom for the runner.
          NODE_OPTIONS: '--max-old-space-size=14336'
