name: Microsoft Graph endpoint guard

on:
  pull_request:
    paths:
      - '.github/workflows/microsoft-graph-endpoint-guard.yml'
      - 'ee/**'
      - 'packages/**'
      - 'scripts/**'
      - 'server/**'
      - 'shared/**'
      - 'tools/microsoft-graph/**'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/microsoft-graph-endpoint-guard.yml'
      - 'ee/**'
      - 'packages/**'
      - 'scripts/**'
      - 'server/**'
      - 'shared/**'
      - 'tools/microsoft-graph/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run guard:microsoft-graph-endpoints
