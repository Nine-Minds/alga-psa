name: Microsoft Graph endpoint guard

on:
  pull_request:
    paths:
      - '.github/workflows/microsoft-graph-endpoint-guard.yml'
      - 'ee/**'
      - 'packages/**'
      - 'scripts/**'
      - 'server/**'
      - 'shared/**'
      - 'tools/microsoft-graph/**'
      - 'package.json'
  push:
    # The weekly repin branch is included so the bump pull request carries a real
    # guard result: pull requests opened by GITHUB_TOKEN do not trigger
    # `pull_request` workflows, so without this the bump PR would have no checks.
    branches:
      - main
      - 'chore/microsoft-graph-metadata-*'
    paths:
      - '.github/workflows/microsoft-graph-endpoint-guard.yml'
      - 'ee/**'
      - 'packages/**'
      - 'scripts/**'
      - 'server/**'
      - 'shared/**'
      - 'tools/microsoft-graph/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run guard:microsoft-graph-endpoints
