name: Start disposable MinIO
description: >-
  Start a throwaway S3-compatible object store on 127.0.0.1 and wait until the
  real server answers. Tests that exercise the S3 storage provider read the
  STORAGE_S3_* variables the calling job exports; stop the container with
  `docker rm -f <name>` in an always() step.
inputs:
  name:
    description: Container name.
    required: true
  port:
    description: Host port mapped to MinIO's S3 API (9000 in the container).
    required: true
  access-key:
    description: Root user (the S3 access key).
    required: true
  secret-key:
    description: Root password (the S3 secret key).
    required: true
runs:
  using: composite
  steps:
    - name: Start MinIO and wait for readiness
      shell: bash
      env:
        MINIO_CONTAINER: ${{ inputs.name }}
        MINIO_PORT: ${{ inputs.port }}
        MINIO_ACCESS_KEY: ${{ inputs.access-key }}
        MINIO_SECRET_KEY: ${{ inputs.secret-key }}
      run: |
        # MinIO's own registries stopped serving anonymous pulls (quay.io and
        # docker.io/minio both answer "unauthorized" now). Same MinIO release —
        # 2025.4.22 is RELEASE.2025-04-22T22-12-26Z — from a repository that
        # still allows them. This packaging launches the server itself, so it
        # takes no trailing `server /data` arguments.
        docker run -d --name "$MINIO_CONTAINER" \
          -p "127.0.0.1:${MINIO_PORT}:9000" \
          -e MINIO_ROOT_USER="$MINIO_ACCESS_KEY" \
          -e MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
          bitnamilegacy/minio:2025.4.22-debian-12-r2
        # Bitnami's entrypoint boots a throwaway MinIO instance first to run
        # its own setup, answers /minio/health/ready during that window, then
        # stops it and starts the real, foreground server a few seconds later.
        # Polling health/ready alone can observe the throwaway instance and
        # return "ready" before the real server exists, so the first S3 call
        # races the stop/restart transition and fails with ECONNRESET. Wait for
        # the entrypoint's own "MinIO setup finished" marker first so polling
        # only starts once the real server is what answers.
        for ((attempt = 1; attempt <= 60; attempt++)); do
          if docker logs "$MINIO_CONTAINER" 2>&1 | grep -q "MinIO setup finished"; then break; fi
          sleep 1
          if [[ "$attempt" -eq 60 ]]; then
            echo "MinIO setup never completed"
            docker logs "$MINIO_CONTAINER"
            exit 1
          fi
        done
        for ((attempt = 1; attempt <= 60; attempt++)); do
          if curl --fail --silent "http://127.0.0.1:${MINIO_PORT}/minio/health/ready"; then exit 0; fi
          sleep 1
        done
        docker logs "$MINIO_CONTAINER"
        exit 1
