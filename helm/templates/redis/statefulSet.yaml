{{- if .Values.redis.enabled }}
{{- $ns := include "sebastian.namespace" . -}}
{{- $existing := (lookup "apps/v1" "StatefulSet" $ns "redis") -}}
{{- $annotations := dict -}}
{{- if and $existing $existing.metadata $existing.metadata.annotations -}}
{{- $annotations = $existing.metadata.annotations -}}
{{- end -}}
{{- $owned := and $existing (eq (get $annotations "meta.helm.sh/release-name") .Release.Name) -}}
{{- if or (not $existing) $owned }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: {{ include "sebastian.namespace" . }}
  labels:
    app: redis
  annotations:
    "helm.sh/resource-policy": keep
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        {{- if .Values.devEnv.enabled }}
        alga.dev/environment: "true"
        {{- end }}
      annotations:
        redis-password: "{{ .Values.config.redis.password }}"
    spec:
      # The official image's own `redis` user. The config (which holds the
      # password) is written to an emptyDir, so the image filesystem stays
      # untouched; the init container only fixes ownership of an existing /data
      # volume that an earlier root-run Redis populated.
      securityContext:
        runAsUser: {{ .Values.redis.runAsUser }}
        runAsGroup: {{ .Values.redis.runAsGroup }}
        fsGroup: {{ .Values.redis.runAsGroup }}
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.redis.persistence.enabled }}
      initContainers:
      - name: fix-data-permissions
        image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
        command: ["sh", "-c", "chown -R {{ .Values.redis.runAsUser }}:{{ .Values.redis.runAsGroup }} /data"]
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - CHOWN
              - DAC_OVERRIDE
              - FOWNER
        volumeMounts:
        - name: redis-data
          mountPath: /data
      {{- end }}
      containers:
      - name: redis
        image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
        command: ["sh", "-c", "umask 077 && printf \"requirepass ${REDIS_PASSWORD}\nsave ''\n\" > /etc/redis/redis.conf && redis-server /etc/redis/redis.conf"]
        imagePullPolicy: Always
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: {{ .Values.redis.service.port }}
          name: cql
        env:
          - name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: redis-credentials
                key: REDIS_PASSWORD
        volumeMounts:
        - name: redis-config
          mountPath: /etc/redis
        {{- if .Values.redis.persistence.enabled }}
        - name: redis-data
          mountPath: /data
        {{- end }}

      {{- if .Values.devEnv.enabled }}
      {{- with .Values.devEnv.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      volumes:
      - name: redis-config
        emptyDir: {}
      {{- if .Values.redis.persistence.enabled }}
      - name: redis-data
        persistentVolumeClaim:
          {{- if .Values.redis.persistence.existingClaim }}
            claimName: {{ .Values.redis.persistence.existingClaim }}
          {{- else }}
            claimName: {{ include "sebastian.fullname" . }}-redis-data
          {{- end }}
      {{- end }}


{{- end }}
{{- end }}
