version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "${EXPOSE_INFRA_BIND_ADDR:-127.0.0.1}:6379:6379"
    volumes:
      - redis-data:/data

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
    depends_on:
      - redis

volumes:
  redis-data: