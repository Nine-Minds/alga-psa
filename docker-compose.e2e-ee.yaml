# Layer over the isolated fresh-install stack to test the actual EE image and
# migrated EE schema and background workflow storage registration.
services:
  server:
    image: alga-e2e-test_server_ee_local:latest
    environment:
      EDITION: enterprise
      APP_EDITION: enterprise
      NEXT_PUBLIC_EDITION: enterprise
    secrets:
      - credential_encryption_key
  setup:
    environment:
      EDITION: enterprise
  workflow-worker:
    environment:
      EDITION: enterprise
    secrets:
      - credential_encryption_key
  postgres:
    # The EE browser stack runs the application, Temporal and both workers
    # against this disposable database while API fixtures connect directly.
    # PostgreSQL's default 100 sessions exhausts during the API E2E stage.
    command: postgres -c password_encryption=md5 -c max_connections=200
