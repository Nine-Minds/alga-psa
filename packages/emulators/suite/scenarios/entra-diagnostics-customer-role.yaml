name: entra-diagnostics-customer-role
description: Entra diagnostic fault; apply after the green fixture is connected
steps:
  - disarm: msgraph/operation-fault
  - arm: msgraph/operation-fault
    params:
      operation: "bbbbbbbb-1111-4111-8111-111111111111:GET /users"
      status: 403
      body: { error: { code: Authorization_RequestDenied, message: Directory read privilege missing } }
