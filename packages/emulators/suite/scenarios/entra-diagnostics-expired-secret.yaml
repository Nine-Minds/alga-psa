name: entra-diagnostics-expired-secret
description: Entra diagnostic fault; apply after the green fixture is connected
steps:
  - disarm: msgraph/operation-fault
  - arm: msgraph/operation-fault
    params:
      operation: "token:common"
      status: 400
      body: { error: invalid_client, error_description: "AADSTS7000222: Expired client secret" }
