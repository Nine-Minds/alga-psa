services:
  minio-test:
    image: bitnamilegacy/minio:2025.4.22
    container_name: alga-psa-minio-test
    ports:
      - "9002:9000"  # API port (different from your Payload MinIO on 9000)
      - "9003:9003"  # Console port
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_CONSOLE_PORT_NUMBER: "9003"
    volumes:
      - minio-test-data:/bitnami/minio/data
    networks:
      - playwright-test

networks:
  playwright-test:
    name: alga-psa-playwright-test
    driver: bridge

volumes:
  minio-test-data:
    name: alga-psa-minio-test-data
