namespace: msp

service:
  name: temporal-frontend
  port: 7233

db:
  host: db.msp.svc.cluster.local
  port: 5432
  adminUser: postgres
  adminPasswordSecret:
    name: db-credentials
    key: DB_PASSWORD_SUPERUSER

server:
  # Match the HelmRelease timeout (30m). With Kubernetes' 600s default a slow
  # appliance can miss the rollout deadline mid-upgrade; Helm then fails the
  # release early and, with remediation retries at 0, it stays stalled even
  # after the pods come up.
  progressDeadlineSeconds: 1800
  startupProbe:
    failureThreshold: 90
    periodSeconds: 10
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
  livenessProbe:
    initialDelaySeconds: 300
    periodSeconds: 20
  # The chart default 512Mi limit OOMKilled temporal-server on field appliances
  # (steady state ~220Mi, spikes past 512Mi during history/matching bursts),
  # and its 500m CPU limit throttled it continuously (1.7k throttled periods,
  # ~13% CPU pressure) while the node had idle cores.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

temporal:
  db: postgres12
  namespace: default
  namespaceRetention: 72h
  createDefaultNamespace: true
  postgresSeeds: db.msp.svc.cluster.local
