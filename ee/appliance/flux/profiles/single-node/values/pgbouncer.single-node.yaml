namespace: msp
# Match the HelmRelease timeout (30m). With Kubernetes' 600s default a slow
# appliance can miss the rollout deadline mid-upgrade; Helm then fails the
# release early and, with remediation retries at 0, it stays stalled even
# after the pods come up.
progressDeadlineSeconds: 1800

service:
  name: pgbouncer
  port: 6432

postgres:
  host: db.msp.svc.cluster.local
  port: 5432
  appDatabase: server
  adminDatabase: postgres
  appUser: app_user_pgbouncer
  adminUser: postgres
  appPasswordSecret:
    name: db-credentials
    key: DB_PASSWORD_PGBOUNCER
  adminPasswordSecret:
    name: db-credentials
    key: DB_PASSWORD_SUPERUSER

authType: scram-sha-256
