namespace: msp
# Match the HelmRelease timeout (30m). With Kubernetes' 600s default a slow
# appliance can miss the rollout deadline mid-upgrade; Helm then fails the
# release early and, with remediation retries at 0, it stays stalled even
# after the pods come up.
progressDeadlineSeconds: 1800
enabled: true

image:
  repository: ghcr.io/nine-minds/email-service
  tag: latest
  pullPolicy: IfNotPresent
  is_private: false
  credentials: ""

app:
  edition: enterprise
  env: production
  name: alga-psa

redis:
  host: redis.msp.svc.cluster.local
  port: "6379"
  passwordSecret:
    name: redis-credentials
    key: REDIS_PASSWORD

db:
  type: postgres
  host: pgbouncer.msp.svc.cluster.local
  port: "6432"
  serverDatabase: server
  user: app_user_pgbouncer
  serverPasswordSecret:
    name: db-credentials
    key: DB_PASSWORD_PGBOUNCER
  adminUser: postgres
  adminPasswordSecret:
    name: db-credentials
    key: DB_PASSWORD_SUPERUSER

# Point inbound IMAP webhooks at the in-cluster alga-core server (alga-core runs
# hostNetwork, so http://server:3000 is unresolvable in k3s) and source the
# webhook secret from the alga-core server secret so the HMAC matches.
webhook:
  url: "http://alga-core-sebastian.msp.svc.cluster.local:3000/api/email/webhooks/imap"
  secretKeyRef:
    name: alga-core-sebastian-secrets
    key: IMAP_WEBHOOK_SECRET

# Source the application secrets from the alga-core server secret so the crypto
# key (used to decrypt tenant IMAP credentials) and auth secrets match.
appSecrets:
  existingSecret: alga-core-sebastian-secrets
  keys:
    cryptoKey: CRYPTR_KEY        # NOTE: alga-core stores the crypto key under CRYPTR_KEY
    nextauthSecret: NEXTAUTH_SECRET
    tokenSecretKey: TOKEN_SECRET_KEY

# Share the tenant-secret store with alga-core via a host directory so this
# service can read the IMAP passwords alga-core writes via the filesystem
# secret provider.
sharedTenantSecrets:
  enabled: true

# Inbound attachments and the original .eml are written with the local storage
# provider, which alga-core reads from its files PVC (<release>-sebastian-storage,
# mounted at /data/files). That claim is ReadWriteOnce on local-path; RWO limits
# attachment to a single node, not a single pod, and the appliance is single-node,
# so email-service mounts the same claim. The claim's directory is handed to uid
# 1000 by the alga-core fix-permissions init container (local-path ignores fsGroup).
filesStorage:
  mountPath: /data/files
  existingClaim: alga-core-sebastian-storage

# Runs as the image default uid (1000), the same uid as alga-core and
# temporal-worker. The shared tenant-secret store is handed to uid 1000 by the
# alga-core `fix-permissions` init container (hostPath ignores fsGroup).

# Block startup until the server database has been bootstrapped (email_providers
# table exists) so the service does not crashloop during first-run migrations.
waitForBootstrap:
  enabled: true
