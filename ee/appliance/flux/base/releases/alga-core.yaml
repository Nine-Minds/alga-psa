apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alga-core
  namespace: alga-system
spec:
  interval: 10m
  timeout: 30m
  releaseName: alga-core
  targetNamespace: msp
  install:
    createNamespace: true
    # The regular bootstrap Job runs concurrently and waits for tenant creation
    # through Temporal. Let dependent releases start while that work completes;
    # the status engine tracks application readiness separately.
    disableWait: true
    remediation:
      retries: 0
  upgrade:
    disableWait: true
    # Deliberately no automatic upgrade remediation: helm-controller's upgrade
    # remediation strategy is a Helm rollback, which would roll the app back
    # under a database the bootstrap Job has already migrated forward. A
    # failed upgrade therefore stalls (RetriesExceeded) and is retried by the
    # appliance instead: the update engine clears a leftover bootstrap Job
    # and re-runs the upgrade with reconcile.fluxcd.io/resetAt + forceAt, and
    # the Manage page's Recover does the same (host-service/helm-release-recovery.mjs).
    remediation:
      retries: 0
  chart:
    spec:
      chart: sebastian
      version: 0.0.1
      interval: 10m
      reconcileStrategy: Revision
      sourceRef:
        kind: HelmRepository
        name: alga-charts
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: appliance-values-alga-core
      valuesKey: alga-core.single-node.yaml
